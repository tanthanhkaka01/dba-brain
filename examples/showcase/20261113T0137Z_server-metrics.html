      <td class="nowrap mono">${esc(oraMB(p.freeMB))}</td></tr>`).join("");
  /* Percent of limit, not the raw count: 215 sessions means nothing without the 610 beside it,
     and ORA-00020 is what the column is read to avoid. The peak is carried because the ceiling
     is hit at the peak, never at the moment the collector happened to look. */
  const limitRows = o.limits.map(l=>{
    const c = l.usedPct == null ? "" : l.usedPct >= 90 ? "crit" : l.usedPct >= 75 ? "warn" : "";
    return `<tr>
      <td class="metric">${esc(l.resource)}</td>
      <td class="nowrap mono">${l.current == null ? "—" : l.current}</td>
      <td class="nowrap mono">${l.peak == null ? "—" : l.peak}${
        l.peakPct == null ? "" : `<div class="detail">${l.peakPct}% of limit</div>`}</td>
      <td class="nowrap mono">${l.limit == null ? "—" : l.limit}</td>
      <td class="nowrap"><span class="${c}">${l.usedPct == null ? "—" : l.usedPct + "%"}</span></td>
    </tr>`;
  }).join("");
  /* A namespace nothing asked for has no hit ratio and shows "—": reading that as 0% would rank
     the untouched namespaces as the worst on the instance. Reloads are the number that matters —
     a reload is a statement that had to be parsed again because it was aged out of the pool. */
  const cacheRows = o.libraryCache.map(c=>{
    const hit = c.hitPct == null ? "" : c.hitPct < 90 ? "crit" : c.hitPct < 95 ? "warn" : "";
    return `<tr>
      <td class="metric">${esc(c.namespace)}</td>
      <td class="nowrap mono">${esc(oraCount(c.gets))}</td>
      <td class="nowrap"><span class="${hit}">${c.hitPct == null ? "—" : c.hitPct + "%"}</span></td>
      <td class="nowrap mono">${esc(oraCount(c.reloads))}</td>
      <td class="nowrap mono">${esc(oraCount(c.invalidations))}</td>
    </tr>`;
  }).join("");
  const bc = o.bufferCache;
  const bcBlock = !bc ? "" : `<h3 class="sub">Buffer cache</h3>
    <p class="sec-note">Hit ratio since instance start —
      <b class="${bc.hitPct == null ? "" : bc.hitPct < 90 ? "crit" : bc.hitPct < 95 ? "warn" : ""}">${
        bc.hitPct == null ? "—" : bc.hitPct + "%"}</b>
      from ${esc(oraCount(bc.consistentGets))} consistent gets and
      ${esc(oraCount(bc.dbBlockGets))} block gets against
      ${esc(oraCount(bc.physicalReads))} physical reads. Cumulative, so it describes this
      instance's history rather than its state right now.</p>`;
  const head = `${o.summary.pools} pool(s)`
    + (o.summary.criticalPools ? ` · ${o.summary.criticalPools} critical` : "")
    + (o.summary.reloads ? ` · ${esc(oraCount(o.summary.reloads))} library cache reloads` : "");
  return `<details class="fold"${o.summary.worstStatus !== "OK" ? " open" : ""}>
    <summary>Oracle instance health — ${head}</summary>
    <div class="in">
    <h3 class="sub">SGA pools</h3>
    <p class="sec-note">Free memory per pool. A shared pool down to single-digit megabytes is
      about to raise ORA-04031, and it shows first as statements being aged out and re-parsed —
      which is the reload count in the table below.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>Pool</th><th>Free</th></tr></thead>
      <tbody>${poolRows}</tbody></table></div>
    ${o.libraryCache.length ? `<h3 class="sub">Library cache</h3>
    <p class="sec-note"><b>Reloads</b> are statements that had to be parsed again because they
      were aged out of the shared pool — the symptom that connects a shrinking pool to slower
      queries. <b>Invalidations</b> are objects whose cached plans were thrown away by a DDL or a
      statistics change.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Namespace</th><th>Gets</th><th>Hit ratio</th><th>Reloads</th>
        <th>Invalidations</th></tr></thead>
      <tbody>${cacheRows}</tbody></table></div>` : ""}
    ${bcBlock}
    ${o.limits.length ? `<h3 class="sub">Process and session limits</h3>
    <p class="sec-note">How close the instance is to refusing new connections with ORA-00020. The
      <b>peak</b> is what decides that, not the current count — the ceiling is reached at the busy
      moment, never at the one the collector happened to sample.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Resource</th><th>Current</th><th>Peak</th><th>Limit</th><th>Used</th></tr></thead>
      <tbody>${limitRows}</tbody></table></div>` : ""}
    </div></details>`;
}

/* Segments and objects: what is broken, what is about to break, and what used the space.
   Four failures live here and none of them is visible in the tablespace numbers above. */
function oracleObjectsBlock(o){
  if (!o) return "";
  const s = o.summary;
  if (!s.invalidObjects && !s.unusableIndexes && !s.extentLimits && !s.topSegments
      && !s.rollbackSegments) return "";
  /* INVALID code raises ORA-04068 at CALL time, not when it broke. This is a list of things that
     will fail on next use, which is why it leads the section rather than sitting under the sizes. */
  const invalidBlock = !o.invalidObjects.length ? "" : `<h3 class="sub">Invalid objects</h3>
    <p class="sec-note">INVALID code raises <span class="mono">ORA-04068</span> when it is
      <i>called</i>, not when it broke — so this is a list of things that will fail on next use.
      Recompile with <span class="mono">ALTER … COMPILE</span>, or run
      <span class="mono">utlrp.sql</span>; anything that will not compile has a real dependency
      that is gone.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>Owner</th><th>Type</th><th>Invalid</th><th>Examples</th></tr></thead>
      <tbody>${o.invalidObjects.map(i=>`<tr class="warn">
        <td><span class="sev ${cls(sev(i.status))}">${esc(sev(i.status))}</span></td>
        <td class="metric">${esc(i.owner)}</td>
        <td class="nowrap mono">${esc(i.objectType)}</td>
        <td class="nowrap mono">${i.count == null ? "—" : i.count}</td>
        <td class="mono">${esc(i.examples.join(", ")) || "—"}</td></tr>`).join("")}
      </tbody></table></div>`;
  /* An UNUSABLE index is not a slow index, it is an absent one: queries silently full-scan and
     any DML touching it fails outright. */
  const unusableBlock = !o.unusableIndexes.length ? "" : `<h3 class="sub">Unusable indexes</h3>
    <p class="sec-note">Not slow indexes — <b>absent</b> ones. Queries fall back to full scans
      without saying so, and any INSERT or UPDATE touching one fails with
      <span class="mono">ORA-01502</span>. Rebuild with
      <span class="mono">ALTER INDEX … REBUILD</span>.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Index</th><th>Scope</th></tr></thead>
      <tbody>${o.unusableIndexes.map(i=>`<tr class="crit">
        <td class="metric mono">${esc(i.index)}</td>
        <td class="nowrap">${i.partition ? `one partition` : `whole index`}</td></tr>`).join("")}
      </tbody></table></div>`;
  /* The one 8i failure a capacity percentage cannot predict: the segment fails while the
     tablespace still shows gigabytes free. */
  const extentBlock = !o.extentLimits.length ? "" : `<h3 class="sub">Segments near MAX_EXTENTS</h3>
    <p class="sec-note">These fail with <span class="mono">ORA-01631</span> on their next extent
      <b>while the tablespace still has free space</b>, so nothing in the storage table above
      predicts it. A dictionary-managed 8i tablespace gives every segment a hard ceiling; the fix
      is <span class="mono">ALTER … STORAGE (MAXEXTENTS UNLIMITED)</span> or a rebuild with
      larger extents.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>Segment</th><th>Type</th><th>Tablespace</th><th>Extents</th>
        <th>Used</th></tr></thead>
      <tbody>${o.extentLimits.map(e=>`<tr class="${cls(sev(e.status))}">
        <td><span class="sev ${cls(sev(e.status))}">${esc(sev(e.status))}</span></td>
        <td class="metric mono">${esc(e.segment)}</td>
        <td class="nowrap mono">${esc(e.type)}</td>
        <td class="nowrap mono">${esc(e.tablespace)}</td>
        <td class="nowrap mono">${e.extents == null ? "—" : e.extents} / ${
          e.maxExtents == null ? "—" : e.maxExtents}</td>
        <td class="nowrap"><span class="crit">${e.usedPct == null ? "—" : e.usedPct + "%"}</span></td>
        </tr>`).join("")}
      </tbody></table></div>`;
  const segmentBlock = !o.topSegments.length ? "" : `<h3 class="sub">Largest segments (${
      o.topSegments.length})</h3>
    <p class="sec-note">The tablespace table answers "is there room left"; this answers <b>what
      used the room</b>. Allocated size, not row counts — allocation is what consumes the
      tablespace and it is true whether or not statistics are current. A high extent count on a
      large segment is a candidate for a rebuild with a bigger extent size.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Segment</th><th>Type</th><th>Tablespace</th><th>Size</th>
        <th>Extents</th></tr></thead>
      <tbody>${o.topSegments.map(g=>`<tr>
        <td class="metric mono">${esc(g.segment)}</td>
        <td class="nowrap mono">${esc(g.type)}</td>
        <td class="nowrap mono">${esc(g.tablespace)}</td>
        <td class="nowrap mono">${esc(oraMB(g.sizeMB))}</td>
        <td class="nowrap mono">${g.extents == null ? "—" : g.extents}</td></tr>`).join("")}
      </tbody></table></div>`;
  /* On 8i this is the throughput ceiling and no other metric sees it. Shrinks and extends matter
     as much as the wait ratio: a segment that had to grow back did the work, it just did not
     have to queue for a slot to do it. */
  const rollbackBlock = !o.rollbackSegments.length ? "" : `<h3 class="sub">Rollback segments (${
      o.rollbackSegments.length})</h3>
    <p class="sec-note"><b>Wait ratio</b> is transactions queueing for a rollback slot — on 8i
      this is the write-throughput ceiling, and nothing else on this page measures it. <b>Shrinks
      and extends</b> matter even at a zero wait ratio: a segment that keeps growing back after
      being shrunk is doing that work on every long transaction. ${s.rollbackResizes
        ? `${s.rollbackResizes} resize(s) across the set.` : ""}</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Segment</th><th>Waits</th><th>Gets</th><th>Wait ratio</th><th>Active tx</th>
        <th>Extents</th><th>Shrinks / extends</th><th>Size</th></tr></thead>
      <tbody>${o.rollbackSegments.map(r=>{
        const c = r.waitPct == null ? "" : r.waitPct >= 2 ? "crit" : r.waitPct >= 1 ? "warn" : "";
        return `<tr>
        <td class="metric mono">${esc(r.name)}</td>
        <td class="nowrap mono">${esc(oraCount(r.waits))}</td>
        <td class="nowrap mono">${esc(oraCount(r.gets))}</td>
        <td class="nowrap"><span class="${c}">${r.waitPct == null ? "—" : r.waitPct + "%"}</span></td>
        <td class="nowrap mono">${r.activeTransactions == null ? "—" : r.activeTransactions}</td>
        <td class="nowrap mono">${r.extents == null ? "—" : r.extents}</td>
        <td class="nowrap mono">${r.shrinks == null ? "—" : r.shrinks} / ${
          r.extends == null ? "—" : r.extends}</td>
        <td class="nowrap mono">${esc(oraMB(r.sizeMB))}</td></tr>`;}).join("")}
      </tbody></table></div>`;
  const head = [
    s.invalidObjects ? `${s.invalidObjects} invalid object(s)` : "",
    s.unusableIndexes ? `${s.unusableIndexes} unusable index(es)` : "",
    s.extentLimits ? `${s.extentLimits} near MAX_EXTENTS` : "",
    s.topSegments ? `${s.topSegments} segment(s)` : "",
    s.rollbackSegments ? `${s.rollbackSegments} rollback segment(s)` : "",
  ].filter(Boolean).join(" · ");
  const bad = s.invalidObjects || s.unusableIndexes || s.extentLimits;
  return `<details class="fold"${bad ? " open" : ""}>
    <summary>Segments &amp; objects — ${esc(head)}</summary>
    <div class="in">${unusableBlock}${extentBlock}${invalidBlock}${segmentBlock}${rollbackBlock}</div>
    </details>`;
}

/* Redo and archiving — whether this instance can be recovered to a point in time at all.
   NOARCHIVELOG was the single most consequential fact about one instance and no page stated it:
   the value sat inside a card titled "Log file space", a name that on every other server means
   per-database log usage. */
function oracleRedoBlock(o){
  if (!o || !o.logMode) return "";
  const s = o.summary;
  const verdict = o.archiving
    ? `<span class="sev ok">ARCHIVELOG</span> point-in-time recovery is possible`
    : `<span class="sev crit">NOARCHIVELOG</span> <b>no point-in-time recovery</b> — the only
       restore possible is to the moment of the last full backup`;
  const destRows = o.destinations.map(d=>`<tr class="${cls(sev(d.status))}">
      <td><span class="sev ${cls(sev(d.status))}">${esc(d.state || "?")}</span></td>
      <td class="metric mono">${esc(d.destination || "—")}</td>
      <td class="nowrap mono">${esc(d.binding || "—")}</td>
      <td class="mono">${esc(d.error && d.error !== "none" ? d.error : "—")}</td></tr>`).join("");
  /* The same number means opposite things in each mode, so it is never shown without the mode:
     a backlog under ARCHIVELOG is archiving falling behind and heading for a frozen instance,
     while under NOARCHIVELOG no group is ever archived and the count is normal. */
  const backlog = o.unarchivedLogs == null ? "" : (o.archiving
    ? `<p class="sec-note"><b class="${o.unarchivedLogs > 0 ? "warn" : ""}">${o.unarchivedLogs}</b>
        redo group(s) filled and not yet archived. Under ARCHIVELOG this is archiving falling
        behind — when it reaches the number of groups the instance stops until ARCH catches up.</p>`
    : `<p class="sec-note">${o.unarchivedLogs} redo group(s) filled and not archived — expected,
        and not a backlog: in NOARCHIVELOG no group is ever archived.</p>`);
  const fra = o.recoveryArea;
  const fraBlock = !fra ? "" : `<h3 class="sub">Fast Recovery Area</h3>
    <p class="sec-note"><b>Unreclaimable</b> is the number that stops the instance, not used:
      space held by files the FRA is still required to keep cannot be freed under pressure.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Area</th><th>Used</th><th>Reclaimable</th><th>Unreclaimable</th>
        <th>Size</th><th>Files</th></tr></thead>
      <tbody><tr class="${cls(sev(fra.status))}">
        <td class="metric mono">${esc(fra.name)}</td>
        <td class="nowrap mono">${fra.usedPct == null ? "—" : fra.usedPct + "%"}</td>
        <td class="nowrap mono">${fra.reclaimablePct == null ? "—" : fra.reclaimablePct + "%"}</td>
        <td class="nowrap"><span class="${fra.unreclaimablePct >= 85 ? "crit" : ""}">${
          fra.unreclaimablePct == null ? "—" : fra.unreclaimablePct + "%"}</span></td>
        <td class="nowrap mono">${esc(oraMB(fra.spaceUsedMB))} / ${esc(oraMB(fra.spaceLimitMB))}</td>
        <td class="nowrap mono">${fra.files == null ? "—" : fra.files}</td>
      </tr></tbody></table></div>`;
  const head = esc(o.logMode)
    + (s.failedDestinations ? ` · ${s.failedDestinations} destination(s) failing` : "")
    + (o.redoTotalMB != null ? ` · ${esc(oraMB(o.redoTotalMB))} redo` : "");
  /* Opens by itself when there is no point-in-time recovery: that is not a detail to go looking
     for, it is the recovery position of the whole instance. */
  return `<details class="fold"${(!o.archiving || s.failedDestinations) ? " open" : ""}>
    <summary>Redo &amp; archiving — ${head}</summary>
    <div class="in">
    <p class="sec-note">${verdict}.</p>
    ${backlog}
    ${o.destinations.length ? `<h3 class="sub">Archive destinations</h3>
    <p class="sec-note">A MANDATORY destination that stops accepting redo freezes the instance
      once every online group is filled; an OPTIONAL one silently loses the archive.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>State</th><th>Destination</th><th>Binding</th><th>Error</th></tr></thead>
      <tbody>${destRows}</tbody></table></div>` : ""}
    ${fraBlock}
    </div></details>`;
}

/* The heaviest statements, by disk reads and by buffer gets. Two lists because a statement can
   top one and be absent from the other: on one instance here the worst buffer-gets statement runs
   91 million times at 3 gets each and does no disk I/O at all.

   Uncapped, from the raw rows: the chart pipeline's MAX_ITEMS_PER_METRIC dropped 18 of the 28
   statements collected, and a top-SQL list missing two thirds of its entries is worse than none —
   the reader believes they have seen the worst. */
function oracleTopSqlBlock(o){
  if (!o || (!o.byDiskReads.length && !o.byBufferGets.length)) return "";
  const table = (rows, valueLabel, perLabel, extra) => `
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>${valueLabel}</th><th>Executions</th><th>${perLabel}</th>
        ${extra ? `<th>${extra}</th>` : ""}<th>Statement</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td class="nowrap mono">${esc(oraCount(r.value))}</td>
        <td class="nowrap mono">${esc(oraCount(r.executions))}</td>
        <td class="nowrap mono">${esc(oraCount(r.perExecution))}</td>
        ${extra ? `<td class="nowrap mono">${esc(oraCount(
            extra === "Disk reads" ? r.diskReads : r.rowsProcessed))}</td>` : ""}
        <td class="mono sqltext">${esc(r.sql || "—")}
          <div class="detail">sql_id ${esc(r.sqlId)}</div></td></tr>`).join("")}
      </tbody></table></div>`;
  const head = `${o.byDiskReads.length} by disk reads · ${o.byBufferGets.length} by buffer gets`;
  return `<details class="fold">
    <summary>Top SQL — ${esc(head)}</summary>
    <div class="in">
    <p class="sec-note">Two lists, because they name different problems. <b>Disk reads</b> is the
      statement making storage the bottleneck; <b>buffer gets</b> is the one burning CPU on
      logical I/O, which can be the heaviest statement on the instance while doing no disk I/O at
      all. Ranked by total — that is what the instance actually pays — but <b>per execution</b> is
      what says whether the fix is a plan or a caller: 378k reads over 3 executions is one bad
      plan, the same total over 4 million executions is a statement doing its job.</p>
    ${o.byDiskReads.length ? `<h3 class="sub">By disk reads</h3>${
      table(o.byDiskReads, "Disk reads", "Per execution", "")}` : ""}
    ${o.byBufferGets.length ? `<h3 class="sub">By buffer gets</h3>${
      table(o.byBufferGets, "Buffer gets", "Per execution", "Disk reads")}` : ""}
    </div></details>`;
}

/* What is actually on this server, one row per database.

   The page carried every one of these facts already — size, log usage, recovery model, CHECKDB
   age, backup ages, Query Store — spread across six sections, so "what is on this server and how
   is each one doing" meant reading all six and joining them by eye.

   System databases are listed. They are why this section exists: master, model and msdb each
   carried a CHECKDB warning that no row on any page could be attached to, because the database
   list was built from DATABASE_STATUS, whose SQL Server variant selects `database_id > 4`. A
   metric's own scope must not decide what the page is allowed to show.

   Same rows as the fleet page's Server Detail, from the same builder
   (inventory_health.build_database_rows), so the two cannot disagree about one database. */
/* Everything the inventory says about this one server - and every field of a block where the
   inventory prints only a few (server_sections.build_server_detail). The operator, 2026-10-23: the
   page of one instance carries more than the inventory, never less. Until then it had no version,
   no configuration, no security counts and no host facts; the inventory had them all. */
function serverDetailBlock(s){
  if (!s || !s.facts) return "";
  const kv = rows => `<div class="tbl-wrap"><table class="rpt kv"><tbody>${rows.map(r=>`<tr>
      <td class="metric">${esc(r[0])}${r[2]==="static"?`<span class="code">static - from the inventory file, not a metric</span>`:""}</td>
      <td class="wrapcell">${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
  const chips = (label, items) => !items.length ? "" : `<p class="sec-note" style="margin:10px 0 6px"><b>${esc(label)}</b></p>
      <div class="cards">${items.join("")}</div>`;
  const ram = mb => mb==null ? "" : mb >= 1024 ? (mb/1024).toFixed(1)+" GB" : Math.round(mb)+" MB";
  const proc = p => `<span class="chip"><b>${esc(p.process)}</b>${p.cpu_percent!=null?" · CPU "+esc(p.cpu_percent)+"%":""}${
      p.memory_mb!=null?" · RAM "+esc(ram(p.memory_mb)):""}${p.process_count?` <span class="c">×${esc(p.process_count)}</span>`:""}</span>`;
  const services = (s.services||[]).map(x=>{
    const bad = String(x.status||"").toUpperCase()!=="OK";
    return `<span class="chip${bad?" crit":""}"><b>${esc(x.name)}</b> ${esc(x.state)}</span>`;
  });
  const network = (s.network||[]).map(n=>`<span class="chip"><b>${esc(n.interface)}</b> ${esc(n.ip_address||"")}${
      n.speed_mbps?` · ${esc(n.speed_mbps)} Mb/s`:""}${n.send_mbps!=null?` · send ${esc(n.send_mbps)} Mb/s`:""}${
      n.receive_mbps!=null?` · receive ${esc(n.receive_mbps)} Mb/s`:""}${n.errors?` · <span class="crit">${esc(n.errors)} errors</span>`:""}${
      n.dropped?` · ${esc(n.dropped)} dropped`:""}</span>`);
  const events = (s.events||[]).map(e=>`<span class="chip warn"><b>${esc(e.log)}</b> ${esc(e.count)} error events${
      e.detail?` <span class="c">${esc(e.detail)}</span>`:""}</span>`);
  const hostBlock = (s.host||[]).length || services.length || (s.topCpu||[]).length || network.length || events.length
    ? `<h3 class="sub">Host</h3>${(s.host||[]).length ? kv(s.host) : ""}
       ${chips("Services", services)}${chips("Top processes by CPU", (s.topCpu||[]).map(proc))}
       ${chips("Top processes by memory", (s.topMemory||[]).map(proc))}${chips("Network interfaces", network)}
       ${chips("Event log", events)}` : "";
  const configBlock = !(s.config||[]).length ? "" : `<h3 class="sub">Configuration</h3>${kv(s.config)}${
      (s.configAdvice||[]).length ? `<ul class="sec-note" style="margin-top:8px">${
        s.configAdvice.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>` : ""}`;
  const securityBlock = !(s.security||[]).length ? "" : `<h3 class="sub">Security</h3>${kv(s.security)}`;
  const findingsBlock = !(s.findings||[]).length ? "" : `<h3 class="sub">Findings</h3>
      <ul class="sec-note">${s.findings.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`;
  return `<h2 class="sec">Server detail<span class="sec-tools">${s.asOf ? "instance as of " + when(s.asOf) : ""}</span></h2>
    <p class="sec-note"${s.stale?' style="color:var(--warn)"':""}>${esc(s.freshness||"")}</p>
    ${kv(s.facts)}${configBlock}${hostBlock}${securityBlock}${findingsBlock}`;
}

function databasesBlock(d){
  if (!d || !d.databases || !d.databases.length) return "";
  const s = d.summary;
  const gb = v => v == null ? "—" : (v >= 100 ? Math.round(v) : v.toFixed(2)) + " GB";
  /* How many files a size is spread over, where the collector counted them. */
  const files = n => n == null ? "" : ` <span class="muted">· ${n} file${n === 1 ? "" : "s"}</span>`;
  const SYSTEM = ["master","model","msdb","tempdb"];
  /* Allocated size next to how much of it is in use. The pair is the point: a log at 99% used
     with an unchanged data file is a broken log-backup chain, and either number alone hides it. */
  const logCell = r => {
    if (r.logGB == null && r.logUsedPct == null) return "—";
    const pct = r.logUsedPct;
    /* LOG_FILE_SPACE's verdict, not a percentage of the page's own: it grades fullness only when
       the log cannot grow (audit 2026-11-05, B2). */
    const cls = r.logUsedStatus === "CRITICAL" ? "crit" : r.logUsedStatus === "WARNING" ? "warn" : "";
    return `${gb(r.logGB)}${pct == null ? "" :
      ` <span class="${cls}">${pct.toFixed(1)}%</span>`}${files(r.logFiles)}`
      + (r.logReuseWait && r.logReuseWait !== "NOTHING"
         ? `<span class="code" title="why the log cannot truncate">${esc(r.logReuseWait)}</span>` : "");
  };
  /* "never" is not a date and must not read as one. It means no successful CHECKDB has ever been
     recorded for this database, so corruption would first be found by a query or a restore. */
  const checkdbCell = r => {
    /* null: this engine has no CHECKDB (the catalogue says which metrics fit it). Not "never". */
    if (r.checkdb === null) return `<span class="muted">n/a</span>`;
    if (!r.checkdb || r.checkdb === "never")
      return `<span class="sev crit">never</span>`;
    return `<span class="mono">${when(r.checkdb)}</span>`;
  };
  /* The backup policy's verdict on this type (data/backup_policy.json), not hours of the page's own:
     26/48 h painted a weekly FULL red at five days while the policy called it in time (B1). A type
     the policy does not require says so. */
  const ageCell = (r, type, hours) => {
    const state = (r.typeStates || {})[type];
    if (state === "NOT_REQUIRED") return `<span class="muted" title="Not required by data/backup_policy.json">n/r</span>`;
    if (hours == null) return `<span class="muted">—</span>`;
    const cls = state === "CRITICAL" ? "crit" : state === "WARNING" ? "warn" : "";
    const text = hours < 48 ? Math.round(hours) + "h" : Math.round(hours / 24) + "d";
    return `<span class="${cls}">${text}</span>`;
  };
  const qsCell = r => {
    if (!r.queryStore) return `<span class="muted">—</span>`;
    return r.queryStoreCapturing
      ? `<span class="sev ok">ON</span>`
      : `<span class="sev warn">${esc(r.queryStore)}</span>`;
  };
  const rows = d.databases.map(r => {
    const system = SYSTEM.indexOf(r.name) >= 0;
    /* Every engine words "usable" differently — SQL Server and PostgreSQL say ONLINE, Oracle
       reports v$database.open_mode ("READ WRITE"). Comparing against the literal painted every
       Oracle database on the page red while it was open and serving. Mirrors
       dbabrain.lib.inventory_render.ONLINE_DATABASE_STATES. */
    const down = r.state && ONLINE_STATES.indexOf(r.state.toUpperCase()) < 0;
    const bad = (r.checkdb !== null && (!r.checkdb || r.checkdb === "never")) || down
             || r.logUsedStatus === "CRITICAL";
    return `<tr class="${down ? "crit" : bad ? "warn" : ""}">
      <td class="metric">${esc(r.name)}${system ? `<span class="code">system</span>` : ""}</td>
      <td>${!r.state ? `<span class="sev crit">?</span>`
            : down ? `<span class="sev crit">${esc(r.state)}</span>`
                   : `<span class="sev ok">${esc(r.state.toUpperCase())}</span>`}</td>
      <td class="nowrap mono">${esc(r.recovery || "—")}</td>
      <td class="nowrap mono">${gb(r.dataGB)}${files(r.dataFiles)}${r.staticSize ? `<span class="code">static</span>` : ""}</td>
      <td class="nowrap mono">${logCell(r)}</td>
      <td class="nowrap mono">${r.compat == null ? "—" : esc(String(r.compat))}</td>
      <td class="nowrap mono">${esc(r.pageVerify || "—")}</td>
      <td class="nowrap">${checkdbCell(r)}</td>
      <td class="nowrap mono">${r.users == null ? "—" : r.users}</td>
      <td class="nowrap">${qsCell(r)}</td>
      <td class="nowrap">${ageCell(r, "FULL", r.fullAgeHours)}</td>
      <td class="nowrap">${ageCell(r, "DIFF", r.diffAgeHours)}</td>
      <td class="nowrap">${ageCell(r, "LOG", r.logAgeHours)}</td>
    </tr>`;
  }).join("");
  /* PostgreSQL's log is one WAL for the cluster, not a file per database: its own line. */
  const wal = s.wal ? ` · WAL ${s.wal.sizeMB == null ? "—" : s.wal.sizeMB >= 1024
      ? (s.wal.sizeMB / 1024).toFixed(2) + " GB" : Math.round(s.wal.sizeMB) + " MB"}`
      + (s.wal.files == null ? "" : ` in ${s.wal.files} files`)
      + (s.wal.maxWalSizeMB == null ? "" : ` (max_wal_size ${s.wal.maxWalSizeMB >= 1024
          ? (s.wal.maxWalSizeMB / 1024).toFixed(0) + " GB" : s.wal.maxWalSizeMB + " MB"})`) : "";
  const head = `${s.count} database${s.count === 1 ? "" : "s"} · ${s.online} online`
    + (s.neverCheckdb ? ` · ${s.neverCheckdb} never CHECKDB'd` : "") + wal
    + (s.backupGraded ? ` · ${s.backupOk}/${s.backupGraded} within backup policy` : "")
    /* When the table was read: its newest input, and its oldest where they differ (B9). */
    + (s.asOf ? ` · as of ${when(s.asOf)}` + (s.oldestAsOf && s.oldestAsOf !== s.asOf ? ` (oldest input ${when(s.oldestAsOf)})` : "") : "");
  /* Open when something on it needs doing — the same rule the sections around it use. */
  return `<details class="fold"${(s.neverCheckdb || s.online < s.count) ? " open" : ""}>
    <summary>Databases — ${esc(head)}</summary>
    <div class="in">
    <p class="sec-note">Every database on this instance, including the <b>system</b> ones
      (master, model, msdb, tempdb) — they are listed because findings are raised against them:
      a CHECKDB warning on <span class="mono">master</span> had nowhere to appear before this
      table existed. <b>Last CHECKDB</b> reads <i>never</i> when no successful integrity check has
      ever been recorded, which means corruption on that database would first be found by a query
      or by a restore. <b>Log</b> shows the allocated size next to how much of it is in use, with
      the reason it cannot truncate beside it when there is one — 99% used against an unchanged
      data file is a broken log-backup chain, not a big database. <b>FULL / DIFF / LOG</b> are the
      ages of the newest backup of each type; the per-type verdict against
      <code>data/backup_policy.json</code> is in the Backup policy section above.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Database</th><th>State</th><th>Recovery</th><th>Data</th><th>Log (used)</th>
        <th>Compat</th><th>Page verify</th><th>Last CHECKDB</th><th>Users</th><th>Query Store</th>
        <th>FULL</th><th>DIFF</th><th>LOG</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    </div></details>`;
}

/* What this instance runs on a schedule. One table for SQL Server Agent and for Oracle's
   DBMS_JOB / DBMS_SCHEDULER, because the question is the same on both and an operator asking
   "what runs on this box at 02:00" should not have to know which engine answers it.

   Only enabled jobs are rows; the disabled ones are a count in the header. A job that is switched
   off is not a schedule, and listing it beside the live ones is how a table stops being the
   answer to "what runs here".

   The run counters carry their own window (7d on SQL Server from sysjobhistory, total on
   Oracle's scheduler, which only keeps lifetime counters). Showing both as one number would
   invent a comparison the data does not support. */
function jobsBlock(j){
  if (!j || !j.jobs || !j.jobs.length) return "";
  const s = j.summary;
  const outcome = r => {
    if (r.lastOutcome === "SUCCEEDED" || r.lastOutcome === "SCHEDULED") return `<span class="sev ok">${esc(r.lastOutcome)}</span>`;
    if (r.lastOutcome === "FAILED" || r.lastOutcome === "BROKEN") return `<span class="sev crit">${esc(r.lastOutcome)}</span>`;
    if (!r.lastOutcome || r.lastOutcome === "NONE") return `<span class="sev">never run</span>`;
    return `<span class="sev warn">${esc(r.lastOutcome)}</span>`;
  };
  const history = r => {
    if (r.runs == null && r.failed == null) return "—";
    const failed = r.failed || 0, runs = r.runs || 0;
    const cls = failed > 0 ? (failed >= runs && runs > 0 ? "crit" : "warn") : "";
    const win = r.window === "total" ? "lifetime" : "7d";
    return `<span class="${cls}">${(r.succeeded == null ? runs - failed : r.succeeded)} ok / ${failed} failed</span>`
         + ` <span class="code">of ${runs} run(s), ${win}</span>`;
  };
  const secs = n => n < 60 ? n + "s"
                 : n < 3600 ? Math.round(n / 60) + "m"
                 : (n / 3600).toFixed(1) + "h";
  /* Each engine says something different about how long a run takes, and the three are not
     interchangeable, so the cell names the one it got. Oracle 10g+ hands over an INTERVAL that
     TO_CHAR renders as "+000000000 00:05:12.000000"; the HH:MM:SS in the middle is the whole
     readable content of it. */
  const duration = r => {
    if (r.maxDurationSeconds != null)
      return `${secs(r.maxDurationSeconds)}<span class="code">longest, 7d</span>`;
    if (r.lastDuration) {
      const clock = /(\d+:\d\d:\d\d)/.exec(r.lastDuration);
      return `${esc(clock ? clock[1] : r.lastDuration)}<span class="code">last run</span>`;
    }
    if (r.totalRuntimeSeconds != null)
      return `${secs(r.totalRuntimeSeconds)}<span class="code">total, lifetime</span>`;
    return "—";
  };
  const rows = j.jobs.map(r=>{
    const failing = (r.failed || 0) > 0 || r.lastOutcome === "FAILED";
    /* Oracle stops running a job after 16 consecutive failures. The count is the only warning
       before a schedule silently stops existing, and SQL Server has nothing like it. */
    const streak = (r.consecutiveFailures || 0) > 0
      ? `<div class="detail">${r.consecutiveFailures} consecutive failure(s) — Oracle breaks a job at 16</div>` : "";
    /* schema_user, and only when it disagrees with the submitter: a job whose PL/SQL resolves
       against a different schema than the one that owns it is how "it worked yesterday" starts. */
    const schema = r.schema && r.schema !== r.owner
      ? `<div class="detail">runs as schema ${esc(r.schema)}</div>` : "";
    const restart = r.restartable ? `<div class="detail">restartable — retried after a failure</div>` : "";
    /* Only the first step's command is collected. Saying so beside it is what stops the column
       being read as the whole job when it is one step of five. */
    const steps = r.steps && r.steps > 1
      ? `<span class="code">step 1 of ${r.steps}</span>` : "";
    return `<tr class="${failing ? "warn" : ""}">
      <td>${outcome(r)}</td>
      <td class="metric">${esc(r.name)}${
        r.category ? `<span class="code">${esc(r.category)}</span>` : ""}${streak}${schema}${restart}</td>
      <td class="cmdcell">${r.command ? esc(r.command) : "—"}${steps}</td>
      <td class="wrapcell mono">${esc(r.schedule || "—")}</td>
      <td class="nowrap mono">${esc(r.nextRun || "—")}</td>
      <td class="nowrap mono">${esc(r.lastRun || "never")}</td>
      <td class="nowrap mono">${duration(r)}</td>
      <td class="nowrap">${history(r)}</td>
      <td class="nowrap mono">${esc(r.owner || "—")}</td>
    </tr>`;
  }).join("");
  const head = `${s.enabled} enabled`
    + (s.disabled ? ` · ${s.disabled} disabled (not listed)` : "")
    + (s.failing ? ` · ${s.failing} failing` : "")
    + (s.neverRun ? ` · ${s.neverRun} never run` : "");
  /* Open when a job is failing, folded when the schedule is simply running — the same rule the
     linked-server, backup and Query Store sections above it use. */
  return `<details class="fold"${s.failing ? " open" : ""}>
    <summary>Scheduled jobs — ${esc(head)}</summary>
    <div class="in">
    <p class="sec-note">What this instance runs on a schedule, what it executes, and how it has
      actually been going. SQL Server Agent jobs and Oracle DBMS_JOB / DBMS_SCHEDULER jobs share
      this table. <b>Command</b> is the first step only, truncated — enough to recognise the job,
      not to review its code. The engines disagree about what their counters mean and this table
      does not paper over it: <b>History</b> and <b>Duration</b> each state the window they cover,
      7 days on SQL Server against the lifetime of the job on Oracle's scheduler. Disabled jobs are
      counted in the header but not listed; a job that is switched off is not a schedule.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Last outcome</th><th>Job</th><th>Command</th><th>Schedule</th><th>Next run</th>
        <th>Last run</th><th>Duration</th><th>History</th><th>Owner</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    </div></details>`;
}

/* Who can reach this instance, and what they hold once inside. Two tables rather than one:
   a login is server-scope, a user is database-scope, and the mapping between them is the thing
   that breaks. After one instance migration all 55 database users pointed
   at logins that did not exist on the target, and no view on this page could say so. */
function accessBlock(a){
  if (!a || (!a.logins.length && !a.databaseUsers.length)) return "";
  const s = a.summary;
  const chip = (t, cls) => `<span class="sev ${cls}">${esc(t)}</span>`;
  const loginRows = a.logins.map(r=>{
    const cls = r.high ? "warn" : "ok";
    const perms = r.permissions.length ? `<div class="detail">${esc(r.permissions.join(", "))}</div>` : "";
    const age = r.passwordAgeDays === null ? "—" : `${r.passwordAgeDays}d`;
    /* Status is its own column, not a word buried in a flags list. A disabled login is still
       listed — it is an account somebody can re-enable — but whether it can be used right now is
       the first thing an access review asks of each row, and it was only inferable from a
       lower-case "disabled" in the last column. */
    const status = r.disabled
      ? `<span class="sev warn">DISABLED</span>`
      : `<span class="sev ok">ENABLED</span>`;
    const flags = [r.checkPolicy === "off" ? "policy off" : ""].filter(Boolean).join(" · ");
    return `<tr class="${r.high ? "warn" : ""}">
      <td>${chip(r.high ? "HIGH" : "—", cls)}</td>
      <td class="metric">${esc(r.name)}<span class="code">${esc(r.type)}</span></td>
      <td class="nowrap">${status}</td>
      <td class="rolecell mono">${esc(r.roles.join(", ") || "—")}${perms}</td>
      <td class="wrapcell mono">${esc(r.defaultDatabase || "—")}</td>
      <td class="nowrap mono">${esc(age)}</td>
      <td class="nowrap">${esc(flags || "—")}</td>
    </tr>`;
  }).join("");
  const userRows = a.databaseUsers.map(r=>{
    const cls = r.orphaned ? "crit" : (r.high ? "warn" : "ok");
    const note = r.note ? `<div class="detail">${esc(r.note)}</div>` : "";
    return `<tr class="${cls === "ok" ? "" : cls}">
      <td>${chip(r.orphaned ? "ORPHANED" : (r.high ? "HIGH" : "—"), cls)}</td>
      <td class="nowrap mono">${esc(r.database)}</td>
      <td class="metric">${esc(r.name)}<span class="code">${esc(r.type)}</span></td>
      <td class="wrapcell mono">${esc(r.login || "— none —")}</td>
      <td class="rolecell">${esc(r.roles.join(", ") || "—")}${note}</td>
    </tr>`;
  }).join("");
  /* The login count is EVERY login on the instance, disabled ones included — they are listed
     with a "disabled" flag rather than hidden, because a disabled sysadmin is still an account
     someone can re-enable, and a reader auditing access has to see it. Saying how many are
     disabled in the header is what stops "31 logins" being read as 31 usable ones. */
  const head = `${s.logins} login${s.logins===1?"":"s"} · ${s.highPrivilegeLogins} privileged`
    + (s.disabledLogins ? ` · ${s.disabledLogins} disabled` : "")
    + ` · ${s.databaseUsers} database user${s.databaseUsers===1?"":"s"} in ${s.databases} db`
    + (s.orphanedUsers ? ` · ${s.orphanedUsers} orphaned` : "");
  return `<details class="fold"${s.orphanedUsers ? " open" : ""}>
    <summary>Access — ${esc(head)}</summary>
    <div class="in">
    <p class="sec-note">Every principal that can reach this instance, and every database user
      inside it. An <b>orphaned</b> user has no login behind it: it survives a restore because it
      lives in the database, but its SID belongs to the instance the backup came from, so nobody
      can connect as it until a login is created with that same SID. <b>HIGH</b> marks a role or
      permission that can change who else gets in — sysadmin, securityadmin, serveradmin,
      setupadmin, CONTROL SERVER at server scope; db_owner, db_securityadmin, db_accessadmin,
      db_ddladmin at database scope. This is an inventory: nothing here raises an alert on its
      own, because the alerting on the same principals belongs to the login-health and
      host-794 metrics.</p>
    <h3 class="sub">Instance logins</h3>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>Login</th><th>Status</th><th>Server roles / permissions</th>
        <th>Default db</th><th>Password age</th><th>Flags</th></tr></thead>
      <tbody>${loginRows}</tbody></table></div>
    <h3 class="sub">Database users</h3>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>Database</th><th>User</th><th>Login</th><th>Database roles</th></tr></thead>
      <tbody>${userRows}</tbody></table></div>
    </div></details>`;
}

/* Who can take this server's files (0.38.0): each database's data-file encryption, the host's
   administrators, and the edition held to the environment. One block, built once for both pages
   (reports/protection.py). It prints what was read and names what was not: a section the
   collector could not read is a row with its reason, never an empty table. */
function protectionBlock(p){
  if (!p) return "";
  const enc = p.encryption || {}, adm = p.admins || {};
  const findings = p.findings || [], changes = p.changes || [];
  if (!enc.collected && !adm.collected && !findings.length) return "";
  const chip = (t, cls) => `<span class="sev ${cls}">${esc(t)}</span>`;
  const items = enc.items || [], stores = enc.keystores || [];
  const scope = items.length && items[0].scope === "tablespace" ? "tablespace" : "database";
  const headBits = [];
  if (enc.collected && !enc.error) headBits.push(`${enc.encrypted} of ${enc.total} ${scope}${enc.total===1?"":"s"} encrypted`);
  if (adm.collected && !adm.error) headBits.push(`${adm.distinctAccounts} administrator account${adm.distinctAccounts===1?"":"s"} on the host`);
  if (changes.length) headBits.push(`${changes.length} change${changes.length===1?"":"s"} at the last read`);
  if (p.editionFinding) headBits.push("edition not meant for production");

  const findingsHtml = !findings.length ? "" : `<h3 class="sub">Findings</h3>
    <ul class="sec-note">${findings.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`;
  const changesHtml = !changes.length ? "" : `<h3 class="sub">Changed at the last read</h3>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>What</th><th>Read</th></tr></thead>
      <tbody>${changes.map(c=>`<tr class="${c.status==="WARNING"?"warn":"crit"}">
        <td>${chip(c.status, c.status==="WARNING"?"warn":"crit")}</td>
        <td class="wrapcell">${esc(c.message)}</td>
        <td class="nowrap mono">${when(c.at)}</td></tr>`).join("")}</tbody></table></div>`;

  let encHtml = `<h3 class="sub">Data files${enc.asOf ? ` <span class="muted">· as of ${when(enc.asOf)}</span>` : ""}</h3>`;
  if (!enc.collected) {
    encHtml += `<p class="sec-note">Not collected for this server: no database is registered on it, its engine has no reading yet, or the metric has not run.</p>`;
  } else if (enc.error) {
    encHtml += `<p class="sec-note" style="color:var(--warn)">Not read: ${esc(enc.error)}</p>`;
  } else {
    if (stores.length) {
      encHtml += `<div class="tbl-wrap"><table class="rpt">
        <thead><tr><th></th><th>Keystore</th><th>Type</th><th>Location</th><th>Opens without a password</th></tr></thead>
        <tbody>${stores.map(k=>`<tr class="${k.opensWithoutPassword==="yes"?"warn":""}">
          <td>${chip(k.status, k.status==="OPEN"?"ok":"unk")}</td>
          <td class="metric">${esc(k.name)}</td>
          <td class="nowrap mono">${esc(k.walletType || "—")}</td>
          <td class="wrapcell mono">${esc(k.location || "—")}</td>
          <td class="nowrap">${esc(k.opensWithoutPassword || "not read")}</td></tr>`).join("")}</tbody></table></div>`;
    }
    if (items.length) {
      const detail = r => [
        r.algorithm,
        r.protector ? `protected by ${r.protectorType || "key"} ${r.protector}` : "",
        r.thumbprint ? `thumbprint ${r.thumbprint}` : "",
        r.privateKeyBackedUp ? `private key backed up: ${r.privateKeyBackedUp}` : "",
        r.provider ? `provider: ${r.provider}` : "",
        r.tablesTotal ? `${r.tablesEncrypted} of ${r.tablesTotal} tables encrypted` : "",
      ].filter(Boolean).join(" · ");
      /* "kept" only when the vault was read and holds that thumbprint; a row with no thumbprint,
         or a vault that could not be read, says nothing about it. */
      const vault = r => r.vault === "kept" ? chip("IN THE VAULT", "ok")
                       : r.vault === "not kept" ? chip("NOT IN THE VAULT", "crit")
                       : (r.thumbprint && !enc.vaultRead ? "vault not read" : "—");
      encHtml += `<div class="tbl-wrap"><table class="rpt">
        <thead><tr><th></th><th>${scope === "tablespace" ? "Tablespace" : "Database"}</th><th>Read from the engine</th><th>Certificate in dbabrain's vault</th></tr></thead>
        <tbody>${items.map(r=>`<tr class="${r.encrypted?"":"warn"}">
          <td>${chip(r.state.toUpperCase(), r.encrypted?"ok":"warn")}</td>
          <td class="metric">${esc(r.name)}</td>
          <td class="wrapcell">${esc(detail(r) || "—")}</td>
          <td class="nowrap">${vault(r)}</td></tr>`).join("")}</tbody></table></div>`;
    } else {
      encHtml += `<p class="sec-note">The engine listed no ${scope} to read.</p>`;
    }
    if (enc.howToEncrypt && enc.encrypted < enc.total) encHtml += `<p class="sec-note">${esc(enc.howToEncrypt)}.</p>`;
  }

  let admHtml = `<h3 class="sub">Administrators on the host${adm.asOf ? ` <span class="muted">· as of ${when(adm.asOf)}</span>` : ""}</h3>`;
  if (!adm.collected) {
    admHtml += `<p class="sec-note">Not collected: this server has no command access to its host (cmd_access), or the metric has not run yet.</p>`;
  } else if (adm.error) {
    admHtml += `<p class="sec-note" style="color:var(--warn)">Not read: ${esc(adm.error)}</p>`;
  } else {
    admHtml += `<p class="sec-note">Read as <b>${esc(adm.readAs || "—")}</b>${adm.rootAccess ? ` · root access for the read: ${esc(adm.rootAccess)}` : ""}.</p>`;
    if ((adm.accounts||[]).length) admHtml += `<div class="tbl-wrap"><table class="rpt">
        <thead><tr><th>Group</th><th>Account</th><th>Kind</th><th>Source</th></tr></thead>
        <tbody>${adm.accounts.map(a=>`<tr>
          <td class="nowrap mono">${esc(a.group)}</td>
          <td class="metric">${esc(a.account)}</td>
          <td class="nowrap">${esc(a.kind || "—")}</td>
          <td class="nowrap">${esc(a.source || "—")}</td></tr>`).join("")}</tbody></table></div>`;
    if ((adm.settings||[]).length) admHtml += `<div class="tbl-wrap"><table class="rpt">
        <thead><tr><th>Setting</th><th>Value</th><th>Read from</th></tr></thead>
        <tbody>${adm.settings.map(x=>`<tr class="${x.marked?"warn":""}">
          <td class="metric">${esc(x.name)}</td>
          <td class="nowrap mono">${x.marked ? chip(x.value, "warn") : esc(x.value)}</td>
          <td class="wrapcell">${esc(x.detail)}</td></tr>`).join("")}</tbody></table></div>`;
    if ((adm.keys||[]).length) admHtml += `<div class="tbl-wrap"><table class="rpt">
        <thead><tr><th>Key that opens root</th><th>Type</th><th>Comment</th><th>File</th></tr></thead>
        <tbody>${adm.keys.map(k=>`<tr>
          <td class="wrapcell mono">${esc(k.fingerprint)}</td>
          <td class="nowrap">${esc(k.type || "—")}</td>
          <td class="wrapcell">${esc(k.comment || "—")}</td>
          <td class="wrapcell mono">${esc(k.file || "—")}</td></tr>`).join("")}</tbody></table></div>`;
    if ((adm.unreadable||[]).length) admHtml += `<p class="sec-note" style="margin-top:8px"><b>Not read</b></p>
      <ul class="sec-note">${adm.unreadable.map(u=>`<li><span class="mono">${esc(u.section)}</span> — ${esc(u.why)}</li>`).join("")}</ul>`;
  }

  return `<details class="fold"${findings.length || changes.length ? " open" : ""}>
    <summary>Protection — who can take this server's files${headBits.length ? " · " + esc(headBits.join(" · ")) : ""}</summary>
    <div class="in">
    <p class="sec-note">A database's own files open on another install, so whoever is an
      administrator on the host can copy them. Encryption at rest protects a copied file or a
      stolen disk - never against an administrator on the running machine - so this lists both:
      whether each ${scope}'s data is encrypted, read where the engine says it, and who can be an
      administrator on the host, read with the login dbabrain already has. Detection only: nothing
      here is graded or changed, and what raises an alert is a <b>change</b> between two reads
      (an account added to an admin group, a new key for root, encryption turned off).</p>
    ${findingsHtml}${changesHtml}${encHtml}${admHtml}
    </div></details>`;
}

/* The backup catalog's file table - one implementation, injected into the server page
   (server-metrics.html, a server's own files) and the fleet page (backup-restore.html, every
   server's). It needs the page's `esc` and `when`. 0.34.0, 1.217; shared since the fleet page. */
/* ---------- Backup & restore files (0.34.0) ----------
   The backup catalog, file by file, newest first, in ONE table (the operator: backup and restore
   need not be two reports). A backup row carries what the backup wrote - its size in bytes, its
   SHA-256 recorded once and never changed, the engine's own verification, whether it is still on
   disk and still hashes to that value, the virus scan - and beside it every restore that used it:
   the mark (when, onto which target, the result), how many times, and whether a restore proved it.
   Files restored onto this server from another one are rows of their own.
   The filters are the questions a reader brings - "the FULLs", "what has a restore ever used" -
   so they hide rows already on the page rather than rebuilding it. */
const bytesB = n => n == null ? "—" : Number(n).toLocaleString("en-US") + " B";
const bytesHuman = n => {
  if (n == null) return "";
  const u = ["B","KB","MB","GB","TB"]; let v = Number(n), i = 0;
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return v.toFixed(i ? 2 : 0) + " " + u[i];
};
const shaCell = h => h ? `<span class="mono" title="${esc(h)}">${esc(h.slice(0,16))}…</span>`
  : `<span class="sev crit">none</span>`;
const tri = (v, yes, no) => v == null ? `<span class="sev">not checked</span>`
  : v ? `<span class="sev ok">${yes}</span>` : `<span class="sev crit">${no}</span>`;
const VERIFY_CLS = {passed:"ok", failed:"crit", not_run:""};
const COPY_VERDICT_CLS = {match:"ok", copied:"ok", recopied:"warn", copying:"warn"};
const RESULT_CLS = {done:"ok", copied:"ok", verified:"ok", refused:"crit", error:"crit"};
const KIND_LABEL = {backup:"backup", restored_here:"restored here", restore_out:"copied out"};
function virusCell(v){
  if (!v) return `<span class="sev">not scanned</span>`;
  const c = v.status === "clean" ? "ok" : v.status === "infected" ? "crit" : "warn";
  const about = [v.tool, v.version, v.signatures ? "signatures " + v.signatures : "",
                 v.by ? "by " + v.by : "", v.at ? "at " + v.at : "", v.text].filter(Boolean).join(" · ");
  return `<span class="sev ${c}" title="${esc(about)}">${esc(v.status)}</span>`;
}
/* Used for a restore: the file's mark, then the last copy's proof, then the tally. */
function restoreUseCell(f){
  if (!f.mark) return `<span class="sev">never used</span>`;
  const m = f.mark, r = f.lastRestore;
  const tested = r && r.testedOk ? `<span class="sev ok">RESTORE OK</span>`
    : m.action === "copy_only" ? `<span class="sev">copy only</span>`
    : `<span class="sev ${RESULT_CLS[m.result] || "warn"}">${esc(m.result || "")}</span>`;
  const copy = `<span class="sev ${COPY_VERDICT_CLS[m.verdict] || "crit"}">${esc(m.verdict || "")}</span>`;
  const proof = r ? `<div class="detail">target ${shaCell(r.sha256TargetAfter)} · ${
      tri(r.targetOnDisk, "on disk", "MISSING")} ${tri(r.targetMatches, "= catalog", "CHANGED")}${
      r.attempts != null ? ` · ${esc(r.attempts)} attempt(s), retry max ${esc(r.maxRetry)}` : ""}${
      r.refusedReason ? `<br>${esc(r.refusedReason)}` : ""}</div>` : "";
  return `${tested} ${copy}
    <div class="detail">${when(m.at)} · <span class="mono">${esc(m.action || "")}</span>
      ${f.kind === "restored_here" ? "from " + esc(f.server) : "→ " + esc(m.target || "")}${
      r && r.restoreId ? " · " + esc(r.restoreId) : ""}</div>${proof}
    <div class="detail">used ${esc(f.usedCount)}× · restored OK ${esc(f.restoredOk)}×</div>`;
}

/* Encrypted: what the backup script wrote the file with (its FILE line, 0.34.0) - "yes" / "no" -
   or "not recorded" for a file written before the scripts said, or catalogued by catalog-backfill:
   unknown is never shown as "no". A copy row has no answer of its own. */
function encryptedCell(f){
  if (f.kind !== "backup") return "";
  if (f.encrypted == null) return `<span class="sev">not recorded</span>`;
  if (f.encrypted) return `<span class="sev ok">yes</span>`;
  // Not by the engine, but its repository copy is: no warning for a backup that is encrypted where it is kept.
  return f.repo && f.repo.total && f.repo.encrypted === f.repo.total
    ? `<span class="sev">no</span> <span class="text-secondary">- encrypted on the repository</span>`
    : `<span class="sev warn">no</span>`;
}

/* Repository (0.37.0): where the backup's copy is and what was proven of it - copied and verified,
   encrypted with which key and until when that key encrypts - or why not. One look per backup; its
   files, bytes and checksums before and after encryption are in the opened row. */
const bfDay = v => v ? esc(String(v).slice(0, 10)) : "";
function bfRepoCell(f){
  if (f.kind !== "backup") return "";
  const r = f.repo;
  if (!r) return `<span class="sev">not copied</span>`;
  const where = r.server ? `<div class="detail">→ ${esc(r.server)}</div>` : "";
  if (r.state === "verified") {
    const enc = !r.total ? ""
      : r.encrypted === r.total
        ? `<div class="detail"><span class="sev ok">encrypted ${r.encrypted}/${r.total}</span> key ${
            r.keys.map(k => "#" + esc(k)).join(", ")}</div>${r.keyUntil ? `<div class="detail">until ${bfDay(r.keyUntil)}</div>` : ""}`
        : r.encrypted ? `<div class="detail"><span class="sev warn">encrypted ${r.encrypted}/${r.total}</span></div>`
        : `<div class="detail"><span class="sev">not encrypted</span></div>`;
    return `<span class="sev ok">verified</span><div class="detail nowrap">${when(r.verifiedAt)}</div>${where}${enc}`;
  }
  if (r.state === "expired") return `<span class="sev">expired</span> ${when(r.expiredAt)}${where}`;
  if (r.state === "failed") return `<span class="sev crit">copy failed</span>${where}<div class="detail">${esc(r.error)}</div>`;
  return `<span class="sev warn">${esc(r.state || "waiting")}</span>${where}`;
}

/* On the server: still there (and still its bytes), deleted once its repository copy was verified,
   only the manifest the next incremental reads, or gone without a release. */
function bfOnServerCell(f){
  const s = f.onServer;
  if (!s) return tri(f.onDisk, "on disk", "MISSING");
  if (s.state === "released") return `<span class="sev ok">deleted</span><div class="detail">${when(s.at)}</div><div class="detail">after its copy was verified</div>`;
  if (s.state === "manifest_only") return `<span class="sev ok">manifest only</span><div class="detail">kept for the next incremental</div>`;
  if (s.state === "pruned") return `<span class="sev">pruned</span><div class="detail">${esc(s.by || "")}</div>`;
  if (s.state === "missing") return `<span class="sev crit">MISSING</span>`;
  // Where every backup of an entry on the old flow is, and should be: neutral, never a warning.
  return `<span class="sev">on the server</span><div class="detail">${tri(f.checksumMatches, "= catalog", "CHANGED")}</div>`;
}

/* Used for restore, in the row: its result and when; the proof opens with the row. */
function bfRestoreUseShort(f){
  if (!f.mark) return `<span class="sev">never used</span>`;
  const m = f.mark, r = f.lastRestore;
  const tested = r && r.testedOk ? `<span class="sev ok">RESTORE OK</span>`
    : m.action === "copy_only" ? `<span class="sev">copy only</span>`
    : `<span class="sev ${RESULT_CLS[m.result] || "warn"}">${esc(m.result || "")}</span>`;
  return `${tested}<div class="detail">${when(m.at)} → ${esc(m.target || "")}</div>
    <div class="detail">used ${esc(f.usedCount)}×</div>`;
}

/* The opened row: the backup's own facts in full, then each of its files from the server to the
   repository to its encrypted copy, then the restores that used it. */
/* Tabler's datagrid for the facts, its card table for the files, its badges for states. */
function bfFact(k, v){ return `<div class="datagrid-item"><div class="datagrid-title">${k}</div><div class="datagrid-content text-break">${v}</div></div>`; }
const bfSha = h => h ? `<div class="font-monospace text-secondary text-break small">${esc(h)}</div>` : "—";
/* On the server, in words - for the opened row, where the list's badge is out of sight (1.345: the
   operator read "plain removed on the repository" and could not tell whether the file itself was
   still on its server). The state is the backup row's: its files are released together. */
function bfOnServerSaid(f){
  const s = f.onServer;
  if (!s) return tri(f.onDisk, "on disk", "MISSING");
  if (s.state === "released") return `<span class="sev ok">deleted</span> ${when(s.at)} <span class="text-secondary">- after its repository copy was verified</span>`;
  if (s.state === "manifest_only") return `<span class="sev ok">manifest only</span> <span class="text-secondary">- kept for the next incremental</span>`;
  if (s.state === "pruned") return `<span class="sev">pruned</span> <span class="text-secondary">${esc(s.by || "")}</span>`;
  if (s.state === "missing") return `<span class="sev crit">MISSING</span>`;
  return `<span class="sev">still there</span> <span class="text-secondary">- not deleted</span>`;
}
function bfMemberRows(r, f){
  return r.files.map(m => {
    const a = m.age;
    const same = m.sha256 && m.repoSha256 && m.sha256 === m.repoSha256;
    return `<tr>
      <td class="mono">${esc(m.name)}</td>
      <td><div class="mono">${esc(bytesB(m.bytes))}</div>${bfSha(m.sha256)}<div class="mt-1">now: ${bfOnServerSaid(f)}</div></td>
      <td><div class="mono">${esc(bytesB(m.repoBytes))} ${same ? `<span class="sev ok">= server</span>` : `<span class="sev crit">differs</span>`}</div>
          ${bfSha(m.repoSha256)}${m.copiedAt ? `<div class="detail">copied ${when(m.copiedAt)}</div>` : ""}</td>
      <td>${a ? `<div class="mono">${esc(bytesB(a.bytes))}</div>${bfSha(a.sha256)}${
              a.encryptedAt ? `<div class="detail">encrypted ${when(a.encryptedAt)}</div>` : ""}` : `<span class="sev">not encrypted</span>`}</td>
      <td class="nowrap">${a ? `age key #${esc(a.keyId)}<div class="detail">encrypts until ${bfDay(a.keyUntil)}</div>
` : "—"}</td>
      <td>${a && a.provenAt ? `<span class="sev ok">decrypted = server</span><div class="detail">${when(a.provenAt)}</div>`
            : a ? `<span class="sev warn">not proven</span>` : "—"}</td>
      <td>${a && a.plainRemovedAt ? `<span class="sev ok">none</span><div class="detail">since ${when(a.plainRemovedAt)}</div>`
            : a ? `<span class="sev warn">still there</span>` : "—"}</td>
    </tr>`;
  }).join("");
}

/* The backup's life, one line per step, each with the moment the catalog recorded for it (1.345 - the
   operator: when was it written on the server, copied to the repository, encrypted, the plain copy
   gone there, deleted on the server?). A step that has not happened says so; none is guessed. A
   backup of several files reaches a step when its last file does. */
function bfTimeline(f){
  if (f.kind !== "backup") return "";
  const r = f.repo, s = f.onServer || {}, on = esc(f.server || "the server");
  const step = (what, at, note) => ({what, at, note});
  const not = text => `<span class="sev">${text}</span>`;
  const rows = [step(`Written on ${on}`, f.startedAt && f.startedAt !== f.at ? `${when(f.startedAt)} → ${when(f.at)}` : when(f.at),
                     "the backup began → ended")];
  if (!r) rows.push(step("Copied to the repository", not("not copied"), ""));
  else {
    rows.push(step(`Copied to ${esc(r.server || "the repository")}`,
      r.copiedAt ? (r.copyStartedAt && r.copyStartedAt !== r.copiedAt ? `${when(r.copyStartedAt)} → ${when(r.copiedAt)}` : when(r.copiedAt))
        : r.state === "failed" ? `<span class="sev crit">failed</span>` : r.verifiedAt ? not("not recorded") : not("not yet"),
      r.copiedAt ? "the copy began → ended" : r.verifiedAt ? "the copy's own start and end were not kept" : ""));
    rows.push(step("Copy verified", r.verifiedAt ? when(r.verifiedAt) : not("not yet"), "held to the server's bytes and SHA-256"));
    if (r.total) {
      rows.push(step("Encrypted there", r.encryptedAt ? when(r.encryptedAt) : not(r.encrypted ? `${r.encrypted} of ${r.total} file(s)` : "not encrypted"),
        r.keys.length ? `age key ${r.keys.map(k => "#" + esc(k)).join(", ")}` : ""));
      if (r.encrypted || r.encryptedAt) {
        rows.push(step("Encrypted copy proven", r.provenAt ? when(r.provenAt) : not("not yet"), "decrypted back to the server's bytes"));
        rows.push(step("No plain copy left on the repository", r.plainGoneAt ? when(r.plainGoneAt) : not("a plain file is still there"), ""));
      }
    }
    if (r.expiredAt) rows.push(step("Repository copy expired", when(r.expiredAt), "deleted there by its retention"));
  }
  rows.push(s.state === "released" ? step(`Deleted on ${on}`, when(s.at), "after its repository copy was verified")
    : s.state === "manifest_only" ? step(`Deleted on ${on}`, `<span class="sev ok">manifest only</span>`, "the manifest is kept for the next incremental")
    : s.state === "pruned" ? step(`Deleted on ${on}`, `<span class="sev">pruned</span>`, esc(s.by || ""))
    : s.state === "missing" ? step(`On ${on}`, `<span class="sev crit">MISSING</span>`, "gone without a release")
    : step(`Deleted on ${on}`, not("not deleted"), "the file is still there"));
  // Tabler's datagrid, like the facts above it - numbered, since the order is the point.
  return `<div class="subheader mt-3 mb-2">Timeline</div><div class="datagrid">${
    rows.map((x, n) => bfFact(`${n + 1}. ${x.what}`,
      `${x.at}${x.note ? ` <span class="text-secondary">- ${x.note}</span>` : ""}`)).join("")}</div>`;
}

/* A diff's or a log's restore chain (1.345 - the operator: for a diff or a log, can its full, diff and
   log chain be had?): the newest full before it, the differential or incrementals after that full and
   every log since - the files a restore to this one's end reads, in the catalog's order - and whether
   each can be had: its repository copy verified, or the file still on its server. */
function bfChainLink(l){
  const repo = l.repo === "verified" ? `<span class="sev ok">verified</span>${l.repoServer ? ` → ${esc(l.repoServer)}` : ""}`
    : l.repo ? `<span class="sev warn">${esc(l.repo)}</span>` : `<span class="sev">not copied</span>`;
  const server = l.onServer === "present" ? `<span class="sev">still there</span>`
    : l.onServer === "released" ? `<span class="sev ok">deleted</span> ${when(l.deletedAt)}`
    : l.onServer === "manifest_only" ? `<span class="sev ok">manifest only</span>`
    : l.onServer === "missing" ? `<span class="sev crit">MISSING</span>` : `<span class="sev">${esc(l.onServer || "")}</span>`;
  return `<tr><td>${esc(l.type)}</td><td class="mono">${esc(l.name)}</td><td class="nowrap">${when(l.at)}</td><td>${repo}</td><td>${server}</td></tr>`;
}
function bfChain(f){
  const c = f.chain;
  if (!c) return "";
  const head = `<div class="subheader mt-3 mb-2">Restore chain - the files a restore to the end of this one reads, in the catalog's order</div>`;
  if (!c.full) return `${head}<div><span class="sev ${c.selfGone ? "" : "warn"}">no chain</span> ${esc(c.note || "")}</div>`;
  const g = c.logs;
  const logs = g ? `<tr><td>LOG × ${esc(g.count)}</td><td>every log since, up to this file</td>
      <td class="nowrap">${when(g.from)} → ${when(g.to)}</td>
      <td><span class="sev ${g.onRepository === g.count ? "ok" : "warn"}">verified ${esc(g.onRepository)}/${esc(g.count)}</span></td>
      <td>${g.onServer ? `${esc(g.onServer)} of ${esc(g.count)} still there` : `none there`}</td></tr>` : "";
  const verdict = c.complete
    ? `<span class="sev ok">complete</span> ${c.onRepository ? "every file of it is verified on the repository" : "every file of it can be had - on the repository, or still on its server"}`
    : c.selfGone
      // The file itself is gone as its retention meant: its chain is history, said plainly and not in red.
      ? `<span class="sev">no longer restorable</span> this file is neither on the repository nor on the server, with ${
          esc(c.missingCount - 1)} other file(s) of its chain`
    : `<span class="sev crit">INCOMPLETE</span> ${esc(c.missingCount)} file(s) neither verified on the repository nor on the server: ${
        c.missing.map(esc).join(", ")}${c.missingCount > c.missing.length ? ", ..." : ""}`;
  return `${head}<div class="mb-2">${verdict}</div>
    <div class="card"><div class="table-responsive"><table class="table table-sm table-vcenter card-table"><thead><tr>
      <th>Level</th><th>File</th><th>Taken</th><th>Repository</th><th>On the server</th></tr></thead><tbody>
      ${bfChainLink(c.full)}${c.diffs.map(bfChainLink).join("")}${logs}</tbody></table></div></div>`;
}
function bfDetailRow(f, i, cols){
  const r = f.repo;
  // What is on the repository under its own name: an encrypted copy is `<file>.age`, not the plain path.
  const kept = r && r.files.length === 1 && r.files[0].age && r.files[0].age.path ? r.files[0].age.path : r ? r.path : "";
  const facts = [
    bfFact("Path on the server", `<span class="mono">${esc(f.path)}${f.container ? " · container " + esc(f.container) : ""}</span>`),
    f.kind === "backup" ? bfFact("On the server now", bfOnServerSaid(f)) : "",
    bfFact("Size", `<span class="mono">${esc(bytesB(f.sizeBytes))}</span> ${esc(bytesHuman(f.sizeBytes))}`),
    bfFact("SHA-256 when written", f.sha256 ? bfSha(f.sha256) : `<span class="sev crit">none</span>`),
    f.kind === "backup" ? bfFact("Engine verify", `<span class="sev ${VERIFY_CLS[f.engineVerify] ?? ""}">${esc(f.engineVerify)}</span> ${esc(f.engineVerifyText)}`) : "",
    f.kind === "backup" ? bfFact("Engine's own encryption", encryptedCell(f)) : "",
    bfFact("Last checked on the server", `${tri(f.checksumMatches, "= catalog", "CHANGED")} ${when(f.lastChecked)}`),
    bfFact("Virus scan", virusCell(f.virus)),
    r ? bfFact("Repository copy", `<span class="mono">${esc(r.server)}:${esc(kept)}</span>${
      r.files.length > 1 && r.total && r.encrypted === r.total ? ` <span class="text-secondary">- each file kept as .age</span>` : ""}`) : "",
  ].join("");
  const files = r && r.files.length ? `
    <div class="subheader mt-3 mb-2">${r.files.length} file(s) of this backup - on the server, on the repository, encrypted</div>
    <div class="card"><div class="table-responsive"><table class="table table-sm table-vcenter card-table"><thead><tr><th>File</th><th>On the server: bytes · SHA-256 · now</th>
      <th>Repository: bytes · SHA-256</th><th>Encrypted .age: bytes · SHA-256</th><th>Key</th>
      <th>Proven</th><th>Plain copy on the repository</th></tr></thead><tbody>${bfMemberRows(r, f)}</tbody></table></div></div>` : "";
  return `<tr class="more" id="bf-more-${i}" hidden><td colspan="${cols}">
    <div class="datagrid">${facts}</div>${bfTimeline(f)}${files}${bfChain(f)}
    <div class="subheader mt-3 mb-2">Restores</div><div>${restoreUseCell(f)}</div></td></tr>`;
}

/* The Database filter's choices: the databases of the rows on the page, or of one server's rows
   when a server is picked - a database list across every server would offer names the picked
   server has never had. */
function dbOptions(files, server){
  const names = [...new Set((files || []).filter(f => !server || (f.host || "") === server)
    .map(f => f.database).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  return names.map(n => `<option>${esc(n)}</option>`).join("");
}

/* `opts.fleet`: the fleet page (backup-restore.html) - a Server column and filter, and the table
   always open; the server page folds it under its Backup section. */
/* Each backup entry's retention and point-in-time reach (0.35.0, 1.233), as its newest run recorded them. */
function retentionLine(rows){
  if (!rows || !rows.length) return "";
  return `<p class="sec-note">Retention: ${rows.map(r =>
    `<b>${esc(r.backupId)}</b> ${esc(r.windows)} · point-in-time reach <b>${esc(r.reach)}</b>`).join("; ")}</p>`;
}

function backupFilesBlock(b, opts = {}){
  if (!b || !b.files || !b.files.length) return "";
  const fleet = !!opts.fleet;
  const body = b.files.map((f, i)=>{
    // Deleted once its repository copy was verified, or pruned by its retention: meant, not missing.
    const gone = f.onServer ? f.onServer.state === "missing" : f.onDisk === false;
    const bad = (f.kind === "backup" && f.verdict !== "ok") || f.checksumMatches === false
      || gone || (f.repo && f.repo.state === "failed") || (f.virus && f.virus.status === "infected")
      || (f.lastRestore && !f.lastRestore.proven);
    const use = !f.usedCount ? "never" : f.restoredOk ? "ok" : "used";
    const verdict = f.kind === "backup"
      ? `<span class="sev ${f.verdict === "ok" ? "ok" : "crit"}">${esc(f.verdict)}</span>
         <span class="sev ${VERIFY_CLS[f.engineVerify] ?? ""}" title="${esc(f.engineVerifyText)}">${esc(f.engineVerify)}</span>`
      : `<span class="sev">${esc(KIND_LABEL[f.kind])}</span>`;
    const count = f.repo && f.repo.total > 1 ? ` <span class="sev">${f.repo.total} files</span>` : "";
    const use_ = bfRestoreUseShort(f);
    const repo = f.kind !== "backup" ? "" : !f.repo ? "none" : f.repo.state === "verified" ? "verified" : "other";
    return `<tr class="bf-main ${bad ? "crit" : ""}" data-i="${i}" data-repo="${repo}" data-type="${esc(f.type)}" data-use="${use}" data-server="${esc(f.host || "")}" data-db="${esc(f.database)}" data-bad="${bad ? "yes" : "no"}">
      <td class="caret" aria-label="details">&#9656;</td>
      <td class="nowrap">${when(f.at)}<div class="detail">${esc(KIND_LABEL[f.kind])}</div></td>
      ${fleet ? `<td class="nowrap mono">${esc(f.host || "")}</td>` : ""}
      <td>${esc(f.database)}</td>
      <td class="nowrap mono">${esc(f.type)}</td>
      <td class="filecell" title="${esc(f.path)}"><b>${esc(f.name)}</b>${count}</td>
      <td class="nowrap mono num" title="${esc(bytesB(f.sizeBytes))}">${f.sizeBytes == null
        ? `<span class="sev crit">unknown</span>` : esc(bytesHuman(f.sizeBytes))}</td>
      <td>${verdict}</td>
      <td>${bfRepoCell(f)}</td>
      <td>${bfOnServerCell(f)}</td>
      <td>${use_}</td>
    </tr>${bfDetailRow(f, i, fleet ? 11 : 10)}`;
  }).join("");
  const problems = b.notOk + b.changed + b.missing + b.notProven + b.infected;
  const summary = [`${b.shown} file(s)`, b.notOk ? `${b.notOk} not ok` : "",
    b.changed ? `${b.changed} changed` : "", b.missing ? `${b.missing} missing` : "",
    b.infected ? `${b.infected} infected` : "", `${b.used} used for a restore`,
    `${b.restoredOk} restored OK`, b.notProven ? `${b.notProven} copy not proven` : ""]
    .filter(Boolean).join(" · ");
  const typeOpts = (b.types || []).map(t=>`<option>${esc(t)}</option>`).join("");
  const serverOpts = (b.servers || []).map(s=>`<option>${esc(s)}</option>`).join("");
  const note = fleet
    ? `Every file a backup of every server wrote, and every copy of a file no backup recorded,`
    : `Every file a backup of this server wrote,`;
  const head = fleet
    ? `<section class="files" id="backupFiles"><h2 class="sec">Backup &amp; restore files</h2>
       <p class="sec-note">${esc(summary)}</p><div>`
    : `<details class="fold" id="backupFiles"${problems ? " open" : ""}>
    <summary>Backup &amp; restore files — ${esc(summary)}</summary>
    <div class="in">`;
  return `${head}
    <p class="sec-note">${note} and every file a restore or a copy
      ${fleet ? "and every restore that used them," : "and every file a restore or a copy\n      carried to or from it,"} newest first, from the backup catalog. Size is in bytes as read when the
      file was written. SHA-256 is the checksum recorded then and never changed since; "= catalog"
      means the file's last check hashed to that same value. Repository: the copy off the server,
      verified by its bytes and SHA-256, then encrypted with the server's age key and proven by
      decrypting it back to the same bytes. On the server: still there, or deleted once that copy was
      verified. Each restore marks the files it used - when, onto which target, its result - and
      "RESTORE OK" means a restore copied this exact file intact, restored it and verified the
      databases. Open a row for its files, sizes and checksums before and after encryption.</p>
    ${retentionLine(b.retention)}
    <div class="ffilters">
      ${fleet ? `<label class="ffilter">Server <select class="ffsel" data-key="server">
        <option value="">All</option>${serverOpts}</select></label>` : ""}
      <label class="ffilter">Database <select class="ffsel" data-key="db" id="bf-db">
        <option value="">All</option>${dbOptions(b.files, "")}</select></label>
      <label class="ffilter">File type <select class="ffsel" data-key="type">
        <option value="">All</option>${typeOpts}</select></label>
      <label class="ffilter">Used for a restore <select class="ffsel" data-key="use">
        <option value="">All</option><option value="any">Used</option>
        <option value="ok">Restored OK</option><option value="used">Used, not restored OK</option>
        <option value="never">Never used</option></select></label>
      <label class="ffilter">Repository <select class="ffsel" data-key="repo">
        <option value="">All</option><option value="verified">On the repository</option>
        <option value="other">Copy pending or failed</option><option value="none">Not copied</option></select></label>
      ${fleet ? `<label class="ffilter">Problems <select class="ffsel" data-key="bad">
        <option value="">All</option><option value="yes">Only problems</option></select></label>` : ""}
      <span class="sec-note">showing <b id="bf-count">${b.shown}</b> of ${b.shown}</span>
    </div>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>When</th>${fleet ? "<th>Server</th>" : ""}<th>Database</th><th>Type</th><th>File / path on the server</th>
        <th>Size</th><th>Verdict</th><th>Repository</th><th>On the server</th><th>Restore</th></tr></thead>
      <tbody id="bf-rows">${body}</tbody></table></div></div>${fleet ? "</section>" : "</details>"}`;
}

/* The selects filter together, over the rows already rendered - an open section stays open. Picking
   a server narrows the Database choices to its own; a database it does not have is let go. */
function bindFileFilters(files){
  const sels = [...document.querySelectorAll("select.ffsel")];
  const server = sels.find(s => s.dataset.key === "server");
  const db = document.getElementById("bf-db");
  if (server && db && files) server.addEventListener("change", () => {
    const keep = db.value;
    db.innerHTML = `<option value="">All</option>` + dbOptions(files, server.value);
    db.value = [...db.options].some(o => o.value === keep) ? keep : "";
  });
  const apply = () => {
    const want = Object.fromEntries(sels.map(s=>[s.dataset.key, s.value]));
    let shown = 0;
    document.querySelectorAll("#bf-rows tr[data-type]").forEach(tr=>{
      // Every select at once; "use" has its one non-exact choice ("any" = used at all).
      const on = Object.entries(want).every(([key, value]) => !value
        || (key === "use" && value === "any" ? tr.dataset.use !== "never" : tr.dataset[key] === value));
      tr.style.display = on ? "" : "none";
      const more = document.getElementById("bf-more-" + tr.dataset.i);
      if (more && !on) { more.hidden = true; tr.classList.remove("open"); tr.querySelector("td.caret").innerHTML = "&#9656;"; }
      if (on) shown++;
    });
    const count = document.getElementById("bf-count");
    if (count) count.textContent = shown;
  };
  sels.forEach(s=>s.addEventListener("change", apply));
  const rows = document.getElementById("bf-rows");
  if (rows) rows.addEventListener("click", e => {
    if (e.target.closest("a, select, button, tr.more")) return;
    const tr = e.target.closest("tr.bf-main");
    const more = tr && document.getElementById("bf-more-" + tr.dataset.i);
    if (!more) return;
    more.hidden = !more.hidden;
    tr.classList.toggle("open", !more.hidden);
    tr.querySelector("td.caret").innerHTML = more.hidden ? "&#9656;" : "&#9662;";
  });
}


function linkedServerBlock(rows){
  if (!rows || !rows.length) return "";
  const n = v => rows.filter(r=>r.verdict===v).length;
  const summary = [["FIX",n("FIX")],["DROP",n("DROP")],["REVIEW",n("REVIEW")],["KEEP",n("KEEP")]]
    .filter(([,c])=>c).map(([v,c])=>`${c} ${v.toLowerCase()}`).join(" · ");
  const body = rows.map(r=>{
    const c = VERDICT_CLS[r.verdict] || "unk";
    const refs = `${r.procedures} proc · ${r.objects} obj · ${r.databases} db`;
    const detail = [r.sample ? `references: ${r.sample}` : "", r.error ? `error: ${r.error}` : ""]
      .filter(Boolean).map(x=>`<div class="detail">${esc(x)}</div>`).join("");
    return `<tr class="${c === "ok" ? "" : c}">
      <td><span class="sev ${c}">${esc(r.verdict)}</span></td>
      <td class="metric">${esc(r.name)}<span class="code">${esc(r.dataSource)}</span></td>
      <td class="nowrap mono">${esc(r.state)}</td>
      <td class="nowrap mono">${esc(refs)}</td>
      <td>${esc(r.why)}${detail}</td>
    </tr>`;
  }).join("");
  /* Open when something needs doing, folded when every linked server is simply fine. */
  const needsAttention = rows.some(r=>r.verdict !== "KEEP");
  return `<details class="fold"${needsAttention ? " open" : ""}>
    <summary>Linked servers — ${rows.length} configured · ${esc(summary)}</summary>
    <div class="in">
    <p class="sec-note">Whether each linked server still answers, and whether any code still calls
      it. Both facts on one row, because neither decides anything alone: a dead linked server
      nothing references is cleanup, the same one with a procedure behind it fails the next time
      that procedure runs. "obj" counts every referencing object (a view over a four-part name
      breaks just as loudly as a procedure).</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Verdict</th><th>Linked server</th><th>State</th><th>Referenced by</th>
        <th>Why / what to do</th></tr></thead>
      <tbody>${body}</tbody></table></div></div></details>`;
}

/* ---------- Volumes ----------
   How large each volume is and how full. The Disk space tile reduces the whole host to one
   percentage, which on a machine with a 2 TB data volume at 28% and a 200 GB system volume at
   14% is a green "28%" and no way to see either size — so "how much room is left on D:" was a
   question the page held every number for and answered none of.

   Both platforms are read the same way: the Windows and Linux collectors already carry
   total_gb / used_gb / free_gb in their message, and the engine's own view of the same volumes
   fills in the hosts where the OS metric cannot run (cmd disabled, or no credential). */
function volumesBlock(v){
  if (!v || !v.volumes || !v.volumes.length) return "";
  const s = v.summary;
  const gb = n => n == null ? "—"
    : n >= 1024 ? (n/1024).toFixed(n >= 10240 ? 0 : 2) + " TB" : n.toFixed(n >= 100 ? 0 : 1) + " GB";
  const body = v.volumes.map(r=>{
    const c = cls(sev(r.status));
    const pct = r.usedPct == null ? null : Math.max(0, Math.min(100, r.usedPct));
