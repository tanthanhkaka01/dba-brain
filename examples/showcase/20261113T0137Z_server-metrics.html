  /* ============================================================
     SERVER HEALTH — one page for the whole fleet.
     Reading order = triage order: verdict -> health areas -> problems ->
     timeline -> charts. The charts are last because a chart never answers
     "is this server healthy"; it answers "why", once you already know.
     The series of the selected server are fetched on demand, so opening the
     page costs one small JSON, not the whole fleet's history.
     Charts are hand-drawn SVG: the worker has no internet, so no chart
     library can be fetched.
     Everything else is Tabler (lib.page_kit, inlined before this block): its cards, tables,
     badges, buttons, alerts and colour tokens. lib.page_kit.ALIASES says which Tabler class each
     of this page's names is; what is left here is layout Tabler has no class for, and the state
     edges (a red border, a red row) drawn in Tabler's colours.
     ============================================================ */
  :root{
    --bg:var(--tblr-bg-surface-secondary); --surface:var(--tblr-bg-surface); --surface-2:var(--tblr-bg-surface-tertiary);
    --ink:var(--tblr-body-color); --muted:var(--tblr-secondary); --faint:var(--tblr-gray-400); --line:var(--tblr-border-color);
    --brand:var(--tblr-primary); --brand-2:var(--tblr-primary-darken);
    --crit:var(--tblr-red); --crit-bg:var(--tblr-red-lt); --crit-line:color-mix(in oklab,var(--tblr-red) 30%,transparent);
    --warn:var(--tblr-orange); --warn-bg:var(--tblr-orange-lt); --warn-line:color-mix(in oklab,var(--tblr-orange) 30%,transparent);
    --ok:var(--tblr-green); --ok-bg:var(--tblr-green-lt); --ok-line:color-mix(in oklab,var(--tblr-green) 30%,transparent);
    --unk:var(--tblr-secondary); --unk-bg:var(--tblr-secondary-lt); --unk-line:var(--tblr-border-color);
    --info:var(--tblr-azure); --info-bg:var(--tblr-azure-lt); --info-line:color-mix(in oklab,var(--tblr-azure) 30%,transparent);
    --mono:var(--tblr-font-monospace);
    --sans:var(--tblr-font-sans-serif);
  }
  /* The whole window, not a centred 1180px column - see the same note in inventory_report.html. */
  .wrap{max-width:none; margin:0; padding:0 24px 64px;}
  header.masthead{padding:20px 0 4px; margin-bottom:8px}
  header .wrap{padding-bottom:0}
  .eyebrow{margin:0 0 6px}
  h1.title{margin:0 0 2px}
  .subtitle{color:var(--muted); margin:0}
  .back{display:inline-block; margin-top:10px; text-decoration:none; border-bottom:1px dotted var(--line)}

  /* One row per engine (SQL Server, Oracle, PostgreSQL, Host only): the label column on the left,
     that engine's servers to its right. */
  .picker{display:grid; grid-template-columns:max-content 1fr; gap:8px 12px; align-items:start;
    margin:14px 0 18px; padding:12px 14px}
  .picker .plabel{padding-top:6px; white-space:nowrap}
  .picker .plabel b{margin-left:6px}
  .picker .prow{display:flex; flex-wrap:wrap; gap:6px}
  .picker .dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; vertical-align:middle}

  /* ---------- Verdict ---------- */
  .verdict{display:grid; grid-template-columns:minmax(230px,1fr) 2fr; gap:14px; margin-bottom:18px}
  .vcard{padding:16px 18px}
  .vcard.crit{background:var(--crit-bg); border-color:var(--crit-line)}
  .vcard.warn{background:var(--warn-bg); border-color:var(--warn-line)}
  .vcard.ok{background:var(--ok-bg); border-color:var(--ok-line)}
  .vcard.unk{background:var(--unk-bg); border-color:var(--unk-line)}
  .vstatus{font-size:27px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
  .vstatus.crit{color:var(--crit)} .vstatus.warn{color:var(--warn)}
  .vstatus.ok{color:var(--ok)} .vstatus.unk{color:var(--unk)}
  .vsub{color:var(--muted); font-size:12.5px; margin-top:4px}
  .score{margin-top:12px}
  .score .bar{height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden}
  .score .bar i{display:block; height:100%; border-radius:99px}
  .score .num{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:4px}
  .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px}
  .fact .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
  .fact .v{font-size:18px; font-weight:700; font-family:var(--mono); margin-top:2px}
  .fact .v.crit{color:var(--crit)} .fact .v.warn{color:var(--warn)} .fact .v.stale{color:var(--crit)}

  h2.sec{font-size:15px; margin:26px 0 3px; letter-spacing:-.01em}
  .sec-note{color:var(--muted); font-size:12px; margin:0 0 12px}
  /* Sub-heading inside a folded section, for a block that holds more than one table. */
  h3.sub{font-size:12.5px; font-weight:650; margin:14px 0 6px; letter-spacing:-.01em}

  /* ---------- Health areas ---------- */
  .areas{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
  .area{border-left-width:4px; padding:10px 12px}
  .area.crit{border-left-color:var(--crit)} .area.warn{border-left-color:var(--warn)}
  .area.ok{border-left-color:var(--ok)} .area.unk{border-left-color:var(--unk)}
  .area .top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .area .name{font-weight:650; font-size:13px}
  .area .val{font-family:var(--mono); font-weight:700; font-size:13.5px}
  .area .val.crit{color:var(--crit)} .area .val.warn{color:var(--warn)} .area .val.ok{color:var(--ok)} .area .val.unk{color:var(--faint)}
  .area .thr{font-size:11px; color:var(--muted); font-family:var(--mono); margin-top:3px}
  .area .cap{font-size:11.5px; font-family:var(--mono); margin-top:4px; color:var(--text)}
  .area .why{font-size:11.5px; color:var(--muted); margin-top:5px}
  .area .src{font-size:10.5px; color:var(--faint); margin-top:4px}
  /* A tile whose value crossed the rule printed on it, and whose alert config removed. Dashed in
     the severity it WOULD have been, so it reads as neither "fine" (plain green, which is what it
     used to look like) nor "broken" (solid red, which would re-raise what somebody deliberately
     silenced). The badge carries the word, because a border is a hint and not a sentence. */
  .area.sil{border-left-style:dashed}
  .area.sil-crit{border-left-color:var(--crit)} .area.sil-warn{border-left-color:var(--warn)}
  .area .sil-tag{font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.04em;
    text-transform:uppercase; border:1px dashed currentColor; border-radius:99px; padding:0 5px;
    margin-left:6px; white-space:nowrap; vertical-align:1px}
  .area .sil-tag.crit{color:var(--crit)} .area .sil-tag.warn{color:var(--warn)}
  .area .sil-why{font-size:11px; margin-top:5px}
  .area .sil-why.crit{color:var(--crit)} .area .sil-why.warn{color:var(--warn)}

  /* ---------- Compact tables (problems / incidents / status) ----------
     These three sections were card lists: 48 problem cards, 14 timeline entries and 127
     status chips on the ERP host — several screens of scrolling to read three facts. A table
     puts one finding per line with its columns aligned, so the page is scanned, not read. */
  /* A table never widens the page: see the same note in inventory_report.html. max-width caps
     the box at the layout's width, overflow-x is the last resort inside it. */
  .tbl-wrap{max-width:100%}
  table.rpt{margin:0; font-size:13px}
  table.rpt th{white-space:nowrap}
  table.rpt td{vertical-align:top}
  table.rpt tr.crit td{background:var(--crit-bg)}
  table.rpt tr.warn td{background:var(--warn-bg)}
  table.rpt .metric{font-weight:650; white-space:nowrap}
  table.rpt .code{display:block; font-size:10px; color:var(--faint); font-family:var(--mono); font-weight:400}
  table.rpt .metric .wl-src{white-space:normal; max-width:340px}
  table.rpt .mono{font-family:var(--mono)}
  /* A label / value table: the label column as wide as its longest label, the value the rest. */
  table.rpt.kv td.metric{width:1%}
  table.rpt .nowrap{white-space:nowrap}
  /* A long server-role list used to sit in a nowrap cell, so the Access table grew past the
     page and the reader had to scroll sideways to see the flags. The table is the page's
     width; the long columns wrap inside it. */
  table.rpt{table-layout:auto; max-width:100%}
  table.rpt .wrapcell{white-space:normal; overflow-wrap:anywhere; word-break:break-word}
  table.rpt .rolecell{white-space:normal; overflow-wrap:anywhere; min-width:180px}
  /* A statement is a paragraph, not a value. Capped in height so one 4000-character PL/SQL block
     cannot push the rest of the top-SQL table off the screen, and scrollable so it is still all
     there — truncating would hide the WHERE clause, which is usually the reason it is listed. */
  table.rpt .sqltext{white-space:pre-wrap; overflow-wrap:anywhere; font-size:11.5px;
                     max-height:9em; overflow-y:auto; min-width:260px}
  /* A job step is up to 200 characters of T-SQL or PL/SQL with no spaces to break at. Capped so
     one long command cannot squeeze the eight columns beside it down to nothing. */
  table.rpt .cmdcell{white-space:normal; overflow-wrap:anywhere; word-break:break-word;
                     min-width:190px; max-width:400px; font-family:var(--mono); font-size:11px}
  table.rpt .muted{color:var(--muted)}
  /* Backup & restore files (0.37.0): a row opens to its files, from the server to the repository
     to the encrypted copy. The path and the checksums wrap rather than widen the table. */
  table.rpt tr.bf-main{cursor:pointer}
  table.rpt td.caret{width:1%; color:var(--muted); padding-right:0}
  table.rpt td.filecell{white-space:normal; min-width:180px; max-width:300px; overflow-wrap:anywhere}
  table.rpt td.filecell .detail{overflow-wrap:anywhere}
  table.rpt tr.more > td{background:var(--surface-2); padding:10px 14px 14px; white-space:normal}
  /* The band that separates one group of workload counters from the next. A table of 25
     measures with no grouping is a wall; the bands are what make it scannable. */
  table.rpt tr.wl-group td{background:var(--bg); font-size:10.5px; letter-spacing:.04em;
    font-weight:700; text-transform:uppercase; color:var(--muted); padding-top:9px}
  /* Fill bar for the Volumes table. Inline with the percentage rather than a column of its own:
     the pair is one fact, and splitting them puts a bar on one side of the eye and its number on
     the other. */
  .vbar{display:inline-block; width:64px; height:6px; border-radius:99px; background:var(--surface-2);
        overflow:hidden; vertical-align:middle; margin-right:7px}
  .vbar i{display:block; height:100%; border-radius:99px}
  table.rpt .detail{font-family:var(--mono); font-size:11px; color:var(--muted); word-break:break-word}
  table.rpt details summary{cursor:pointer; color:var(--muted); font-size:11.5px; outline:none}
  table.rpt details ul{margin:5px 0 0 0; padding-left:16px}
  table.rpt details li{font-size:11.5px; margin-bottom:2px}
  .sec-tools{float:right; font-size:11.5px; color:var(--muted); font-weight:400}
  .ffilters{margin:4px 0 8px}
  .ffilter{font-size:12px; color:var(--muted); margin-right:12px; display:inline-block}
  .ffilter select{display:inline-block; width:auto; margin-left:4px}
  td.num{text-align:right}

  /* ---------- Problems ---------- */
  .prob{display:flex; flex-direction:row; gap:11px; padding:11px 13px; margin-bottom:7px}
  .prob.crit{background:var(--crit-bg); border-color:var(--crit-line)}
  .prob.warn{background:var(--warn-bg); border-color:var(--warn-line)}
  /* A severity tag is Tabler's solid badge in the state's colour. The linked-server table badges a
     verdict on every row, including the healthy ones — a KEEP has to look like a decision that was
     made, not like a missing badge. */
  .sev{flex:0 0 auto; height:fit-content}
  .prob .body{flex:1; min-width:0}
  .prob .h{font-weight:650; font-size:13px}
  .prob .h .val{font-family:var(--mono); color:var(--ink)}
  .prob .code{font-size:10.5px; color:var(--faint); font-family:var(--mono)}
  .prob .act{font-size:12.5px; color:var(--muted); margin-top:3px}
  .all-ok{margin:0}

  /* ---------- Timeline ---------- */
  .tl{border-left:2px solid var(--line); margin-left:6px; padding-left:14px}
  .tl .ev{position:relative; padding:5px 0 5px 0; font-size:12.5px}
  .tl .ev::before{content:""; position:absolute; left:-19px; top:11px; width:8px; height:8px; border-radius:50%; background:var(--faint)}
  .tl .ev.crit::before{background:var(--crit)} .tl .ev.warn::before{background:var(--warn)}
  .tl .when{font-family:var(--mono); font-size:11px; color:var(--muted)}
  .tl .ongoing{color:var(--crit); font-weight:650}
  .tl .cleared{color:var(--ok)}

  /* ---------- Status cards (categorical, never charted) ---------- */
  .cards{display:flex; flex-wrap:wrap; gap:6px}
  .chip{background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:6px 10px; font-size:12px}
  .chip.crit{background:var(--crit-bg); border-color:var(--crit-line); color:var(--crit)}
  .chip.warn{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn)}
  .chip b{font-weight:650}
  .chip .c{color:var(--faint); font-family:var(--mono); font-size:10.5px}

  /* ---------- Charts ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px}
  .card{padding:11px 12px 6px}
  .card h3{font-size:12.5px; margin:0; font-weight:650; word-break:break-word}
  .card .meta{color:var(--muted); font-size:11px; font-family:var(--mono); margin:2px 0 6px}
  .card .code{color:var(--faint); font-size:10px; font-family:var(--mono)}
  .card.crit{border-color:var(--crit-line); background:var(--crit-bg)}
  .card.warn{border-color:var(--warn-line); background:var(--warn-bg)}
  .last{float:right; font-weight:700; font-family:var(--mono); font-size:13px}
  .last.crit{color:var(--crit)} .last.warn{color:var(--warn)} .last.ok{color:var(--ok)}
  svg{display:block; width:100%; height:92px; overflow:visible}
  .axis{fill:var(--faint); font-size:9px; font-family:var(--mono)}
  .empty{color:var(--faint); font-size:12px; padding:18px 0; text-align:center}
  details.fold{margin-top:10px; padding:0}
  details.fold > summary{cursor:pointer; padding:10px 13px; font-size:13px; font-weight:600; list-style:none}
  details.fold > summary::-webkit-details-marker{display:none}
  details.fold > summary::before{content:"▶ "; color:var(--faint); font-size:10px}
  details.fold[open] > summary::before{content:"▼ "}
  details.fold .in{padding:0 13px 13px}
  .foot{margin-top:16px; padding:9px 12px; background:var(--surface-2); border:1px solid var(--line);

const ENGINE_SECTIONS = [["sqlserver","SQL Server"],["oracle","Oracle"],["postgresql","PostgreSQL"],["mysql","MySQL"],["host","Host only"],["other","Other"]];   /* [[key, label], ...] in page order — lib.engine_sections */
const VERSION = "20261113_083758";   /* cache-buster: a rebuilt page must not serve yesterday's series */
const WINDOW_DAYS = "7";
const SNAPSHOT_DATE = "2026-11-13 08:37:58 +07";  /* kept on every per-server view, not just the landing one */

/* ?date= is answered by the web host, which swaps in that day's archived copy of whatever file
   was asked for. This page is only an index, so the date has to travel with it: the series it
   fetches must be the SAME day's, or a page dated last week would draw this morning's charts.
   It is carried on every outgoing link too, so clicking through a dated view stays dated. */
const DATE_PARAM = new URLSearchParams(location.search).get("date") || "";
const withDate = (url) => !DATE_PARAM ? url
  : url + (url.includes("?") ? "&" : "?") + "date=" + encodeURIComponent(DATE_PARAM);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CLS = {CRITICAL:"crit", WARNING:"warn", OK:"ok", HEALTHY:"ok", UNKNOWN:"unk"};
/* The DATABASE_STATUS values that mean "usable", one per engine's wording. Kept in step with
   dbabrain.lib.inventory_render.ONLINE_DATABASE_STATES, which the fleet page counts with. */
const ONLINE_STATES = ["ONLINE", "READ WRITE", "READ ONLY", "READ ONLY WITH APPLY"];
const COLOR = {crit:"#dc2626", warn:"#c2700a", ok:"#15803d", unk:"#94a3b8"};
const cls = s => CLS[String(s||"").toUpperCase()] || "unk";
const fmt = v => v == null ? "—" : (Math.abs(v) >= 1000 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2));
const isPercentUnit = u => {
  const raw = String(u||"").trim().toLowerCase();
  const compact = raw.replace(/[^a-z0-9%]+/g,"_").replace(/^_+|_+$/g,"");
  return raw.includes("%") || compact.includes("percent") || compact === "pct"
      || compact.startsWith("pct_") || compact.endsWith("_pct");
};
const unitText = u => isPercentUnit(u) ? "%" : String(u||"");
/* The report's clock, injected by the builder from config.json's `timezone`. The page used
   to render one axis in the VIEWER's browser zone and one label in UTC, so the same file read
   differently in Hanoi and in Chicago and neither matched the header. */
const DISPLAY_OFFSET_MINUTES = 420;
const DISPLAY_OFFSET_LABEL = "+07";
/* Shift the instant, then read it as UTC: that is the configured zone's wall clock, and it
   is the same wall clock wherever the page is opened. */
const inDisplayZone = t => new Date((t + DISPLAY_OFFSET_MINUTES*60)*1000);
const day = t => { const d = inDisplayZone(t); return `${d.getUTCMonth()+1}/${d.getUTCDate()}`; };
/* `when` is declared once, further down, as a function — a second `const when` here made the
   whole script a SyntaxError ("Identifier 'when' has already been declared") and the page
   rendered nothing but "Loading…". Timestamp formatting lives in that one place. */
const ago = s => {
  if (s == null) return "never";
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s/60) + " min ago";
  if (s < 172800) return Math.round(s/3600) + " h ago";
  return Math.round(s/86400) + " days ago";
};

/* ---------------- charts (hand-drawn SVG; no library is reachable offline) --------------- */
const W = 320, H = 92, PAD_L = 34, PAD_R = 6, PAD_T = 8, PAD_B = 16;
function hash(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return h; }

function lineChart(s){
  const pts = s.points.filter(p => p[1] != null);
  if (!pts.length) return '<div class="empty">no numeric data in window</div>';
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = s.min == null ? Math.min(0, Math.min(...ys)) : s.min;
  let y1 = s.max == null ? Math.max(...ys) : s.max;
  if (y1 === y0) y1 = y0 + 1;
  const sx = t => PAD_L + ((t-x0)/Math.max(x1-x0,1))*(W-PAD_L-PAD_R);
  const sy = v => PAD_T + (1-(v-y0)/(y1-y0))*(H-PAD_T-PAD_B);
  const color = COLOR[cls(s.severity)] || COLOR.ok;
  const line = pts.map((p,i)=>`${i?"L":"M"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join("");
  const area = `${line}L${sx(pts[pts.length-1][0]).toFixed(1)},${sy(y0).toFixed(1)}L${sx(pts[0][0]).toFixed(1)},${sy(y0).toFixed(1)}Z`;
  const gid = "g"+Math.abs(hash(s.code+s.item));
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".18"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${PAD_L}" x2="${W-PAD_R}" y1="${sy(y1)}" y2="${sy(y1)}" stroke="#e5e9ef"/>
    <line x1="${PAD_L}" x2="${W-PAD_R}" y1="${sy(y0)}" y2="${sy(y0)}" stroke="#e5e9ef"/>
    <text class="axis" x="0" y="${sy(y1)+3}">${fmt(y1)}</text>
    <text class="axis" x="0" y="${sy(y0)+3}">${fmt(y0)}</text>
    <text class="axis" x="${PAD_L}" y="${H-3}">${day(x0)}</text>
    <text class="axis" x="${W-PAD_R}" y="${H-3}" text-anchor="end">${day(x1)}</text>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${sx(pts[pts.length-1][0])}" cy="${sy(pts[pts.length-1][1])}" r="2.6" fill="${color}"/>
  </svg>`;
}

/* A word that CHANGED over the window (Running -> Stopped) is worth a picture: one block per
   sample, coloured by status. A word that never changed is a card, not a chart. */
function statusStrip(s){
  const pts = s.points;
  if (!pts.length) return '<div class="empty">no data in window</div>';
  const w = (W-PAD_L-PAD_R)/pts.length;
  const blocks = pts.map((p,i)=>
    `<rect x="${(PAD_L+i*w).toFixed(2)}" y="${PAD_T+18}" width="${Math.max(w,0.6).toFixed(2)}" height="34" fill="${COLOR[cls(sev(p[2]))]}" opacity=".85"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${blocks}
    <text class="axis" x="${PAD_L}" y="${H-3}">${day(pts[0][0])}</text>
    <text class="axis" x="${W-PAD_R}" y="${H-3}" text-anchor="end">${day(pts[pts.length-1][0])}</text>
  </svg>`;
}
const sev = s => {
  const u = String(s||"").toUpperCase();
  if (u==="CRITICAL"||u==="ERROR") return "CRITICAL";
  if (u==="WARNING"||u==="WARN"||u==="UNKNOWN"||u==="NO_DATA") return "WARNING";
  return "OK";
};

function chartCard(s){
  const c = cls(s.severity);
  const unit = unitText(s.unit);
  const suffix = unit ? ` ${esc(unit)}` : "";
  const head = s.numeric
    ? `<span class="last ${c}">${fmt(s.last)}${suffix}</span>`
    : `<span class="last ${c}">${esc(s.lastText||"")}</span>`;
  const scaleLabel = s.scaleKind === "capacity" ? "capacity" : s.scaleKind === "fixed" ? "range" : "auto scale";
  const stats = s.numeric
    ? `${scaleLabel} ${fmt(s.min)}–${fmt(s.max)}${suffix} · ${WINDOW_DAYS}d observed min ${fmt(s.observedMin)} · avg ${fmt(s.avg)} · max ${fmt(s.observedMax)}`
    : `${s.points.length} samples`;
  return `<div class="card ${c==="ok"||c==="unk"?"":c}">
    ${head}<h3>${esc(s.label)} — ${esc(s.item)}</h3>
    <div class="meta">${stats} <span class="code">${esc(s.code)}</span></div>
    ${s.numeric ? lineChart(s) : statusStrip(s)}
  </div>`;
}

function chartGrid(list){
  return list.length ? `<div class="grid">${list.map(chartCard).join("")}</div>`
                     : '<div class="empty">nothing in this group</div>';
}

/* ---------------- sections ---------------- */
function verdict(h, server){
  const c = cls(h.status);
  const bar = h.score >= 80 ? COLOR.ok : h.score >= 50 ? COLOR.warn : COLOR.crit;
  const staleTxt = h.stale
    ? `<span class="stale">stale — nothing collected for ${Math.round((h.staleAfterSeconds||10800)/3600)} h+</span>`
    : "fresh";
  return `<div class="verdict">
    <div class="vcard ${c}">
      <div class="vstatus ${c}">${esc(h.status)}</div>
      <div class="vsub">${esc([server.name, server.role && server.role !== server.name ? server.role : "",
                               server.platform||""].filter(Boolean).join(" · "))}</div>
      <div class="score">
        <div class="bar"><i style="width:${h.score}%;background:${bar}"></i></div>
        <div class="num">health score ${h.score}/100</div>
      </div>
    </div>
    <div class="vcard">
      <div class="facts">
        <div class="fact"><div class="k">Critical</div><div class="v ${h.critical?"crit":""}">${h.critical}</div></div>
        <div class="fact"><div class="k">Warning</div><div class="v ${h.warning?"warn":""}">${h.warning}</div></div>
        <div class="fact"><div class="k">Last collected</div><div class="v" style="font-size:13px">${h.lastCollected?esc(when(h.lastCollected)):"never"}</div></div>
        <div class="fact"><div class="k">Data freshness</div><div class="v ${h.stale?"stale":""}" style="font-size:13px">${esc(ago(h.ageSeconds))}</div></div>
        <div class="fact"><div class="k">Series</div><div class="v">${h.seriesCount}</div></div>
      </div>
      <div class="vsub" style="margin-top:10px">${h.stale
        ? "The newest sample is older than the collection interval: this page describes the past, not the present. Fix collection before trusting anything below."
        : "Collection is current, so the values below are what the server looks like now."}</div>
    </div>
  </div>`;
}

/* Store timestamps are UTC (docs/14); this shows them on the configured clock and names it.
   Saying which clock on every stamp is the difference between a reader trusting the number and a
   reader guessing whose it is - and the number moved between viewers before it said so. */
function when(value){
  if (value == null || value === "") return "";
  if (typeof value === "number")
    return inDisplayZone(value).toISOString().slice(0,16).replace("T"," ")+" "+DISPLAY_OFFSET_LABEL;
  /* A stored string: "2026-09-07T00:32:56Z" is UTC, so parse it and shift like the numbers. */
  const parsed = Date.parse(String(value).endsWith("Z") ? value : String(value)+"Z");
  if (!isNaN(parsed))
    return esc(inDisplayZone(parsed/1000).toISOString().slice(0,19).replace("T"," "))+" "+DISPLAY_OFFSET_LABEL;
  return esc(String(value).replace("T"," ").replace("Z",""))+" "+DISPLAY_OFFSET_LABEL;
}

/* The tile names the row it is reading. Without it a CPU tile could show a memory percentage
   and nothing on the page would say so — which is exactly what happened, for a whole run. */
function areaGrid(areas){
  return `<div class="areas">${areas.map(a=>{
    const c = cls(a.status);
    const src = a.sourceCode ? `${a.sourceCode}${a.sourceItem?" / "+a.sourceItem:""}` : "";
    /* The value graded itself worse than the tile shows, and config lowered it. Marked rather
       than repainted: repainting would undo the decision, and staying silent is what made a
       90.67% reading sit green under a tile that printed "CRITICAL >= 90%". */
    const down = a.downgradedFrom || "";
    const dc = down ? cls(down) : "";
    return `<div class="area ${c}${down?` sil sil-${dc}`:""}">
      <div class="top"><span class="name">${esc(a.label)}${
        down?`<span class="sil-tag ${dc}">silenced</span>`:""}</span><span class="val ${c}">${esc(a.value)}</span></div>
      ${a.capacity?`<div class="cap">${esc(a.capacity)}</div>`:""}
      ${a.capacityNote?`<div class="why">${esc(a.capacityNote)}</div>`:""}
      <div class="thr">${esc(a.threshold)}</div>
      <div class="why">${esc(a.note)}</div>
      ${down?`<div class="sil-why ${dc}">This reading grades <b>${esc(down)}</b> against the rule above.
        It is not alerting because a severity_map for this server lowers it in
        <span class="mono">data/db_instances.json</span> — the value is real, the silence is a decision.</div>`:""}
      ${a.detail?`<div class="src">${esc(a.detail)}</div>`:""}
      ${src?`<div class="src">source: ${esc(src)}${a.collectedAt?" · "+when(a.collectedAt):""}</div>`:""}
      ${a.stale?`<div class="src" style="color:var(--warn)">its metric is late or failing — not a current reading</div>`:""}
      ${a.reportJudged?`<div class="src">status judged by this report — the collector logs this metric without alerting</div>`:""}
    </div>`;
  }).join("")}</div>`;
}

/* Monitoring's own health. A verdict is only worth as much as the collection behind it, and the
   page-wide "data age" is the newest metric on the server — which hid a metric 48 hours stale
   behind one three minutes old, and said nothing at all about two that never ran. */
function coverage(f){
  if (!f || !f.metrics || !f.metrics.length) return "";
  const bad = f.metrics.filter(m=>m.state!=="OK");
  const missing = f.notCollected || [];
  const summary = `${f.seen}/${f.expected} metric(s) reporting`
    + (bad.length?` · ${bad.length} failing or late`:"")
    + (missing.length?` · ${missing.length} with no evidence`:"");
  const rows = bad.map(m=>`<tr class="${m.state==="FAILED"?"crit":"warn"}">
      <td class="metric">${esc(m.label)}<span class="code">${esc(m.code)}</span></td>
      <td class="nowrap mono">${m.state}</td>
      <td class="nowrap mono">${m.lastSuccess?when(m.lastSuccess):"never in window"}</td>
      <td class="nowrap mono">${m.cadenceSeconds?Math.round(m.cadenceSeconds/60)+" min":"—"}</td>
      <td class="detail">${esc(m.error||m.status||"")}</td>
    </tr>`).join("")
   + missing.map(m=>`<tr class="warn">
      <td class="metric">${esc(m.label)}<span class="code">${esc(m.code)}</span></td>
      <td class="nowrap mono">NO EVIDENCE</td><td class="nowrap mono">—</td><td class="nowrap mono">—</td>
      <td class="detail">Active in the catalog for this engine, no rows in the window. Either never
        collected here, or switched off for this target.</td>
    </tr>`).join("");
  if (!rows) return `<details class="fold"><summary>Metric coverage — ${esc(summary)}</summary>
    <div class="in"><p class="sec-note">Every expected metric reported inside its cadence.</p></div></details>`;
  return `<h2 class="sec">Metric coverage<span class="sec-tools">${esc(summary)}</span></h2>
    <p class="sec-note">A metric that is failing or late is not a healthy metric. Whatever the page
      shows for it is the last value from before it stopped.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Metric</th><th>State</th><th>Last success</th><th>Cadence</th><th>Now says</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

/* Per-database backup compliance. Server-level "newest backup" let one healthy database answer
   for a whole instance; this is one row per database and one column per required type. */
function backupBlock(b){
  const rows = (b && b.databases) || [];
  if (!rows.length) return "";
  const s = b.summary || {};
  const cell = t => t.required
    ? `${t.age_hours==null?"never":(t.age_hours<48?Math.round(t.age_hours)+"h":Math.round(t.age_hours/24)+"d")}`
    : `<span class="muted">n/r</span>`;
  return `<details class="fold"${s.status==="CRITICAL"?" open":""}><summary>Backup policy — ${
      s.compliant}/${s.eligible} database(s) within policy${s.reason?" · "+esc(s.reason):""}</summary>
    <div class="in"><p class="sec-note">Required types come from <code>data/backup_policy.json</code>.
      "n/r" means the policy does not require that type for this database. A stale LOG backup is an
      RPO violation; whether the log chain is intact needs backup LSN evidence, which is not collected.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Database</th><th>Recovery</th><th>FULL</th><th>DIFF</th><th>LOG</th><th>Verdict</th></tr></thead>
      <tbody>${rows.map(d=>`<tr class="${d.status==="CRITICAL"?"crit":d.status==="WARNING"?"warn":""}">
        <td class="metric">${esc(d.database)}</td>
        <td class="mono">${esc(d.recovery_model||"—")}</td>
        <td class="mono nowrap">${cell(d.types.FULL)}</td>
        <td class="mono nowrap">${cell(d.types.DIFF)}</td>
        <td class="mono nowrap">${cell(d.types.LOG)}</td>
        <td class="detail">${esc(d.reason||"within policy")}</td>
      </tr>`).join("")}</tbody></table></div></div></details>`;
}

/* Workload — how much the instance actually did, over three intervals.

   Every number here is a difference between two collections of a cumulative counter, never a
   counter read once. That distinction is the whole reason this section exists:
   sys.dm_os_wait_stats, sys.dm_io_virtual_file_stats, sys.dm_os_performance_counters and
   sys.dm_exec_query_stats all report totals since the engine started, so read once they answer
   "what has this instance done since it booted" — a question nobody asks — and divided by anything
   they give an average over months. On one production instance that average made a nine-month-old bad
   afternoon look like this morning's I/O latency.

   Three columns because "busy right now" and "busy last night" are different questions and a
   single column invites the reader to mistake one for the other. Each header states the span that
   was actually measured, not the one that was asked for: a 24-hour column built from 14 hours of
   samples says 14h. */
const wlUnit = (v, unit) => {
  if (v == null) return "—";
  if (unit === "pct")    return v.toFixed(1) + "%";
  if (unit === "ms_avg") return v.toFixed(2) + " ms";
  if (unit === "mb")     return v >= 1024 ? (v/1024).toFixed(2) + " GB" : v.toFixed(1) + " MB";
  if (unit === "ms")     return v >= 3600000 ? (v/3600000).toFixed(2) + " h"
                              : v >= 1000 ? (v/1000).toFixed(1) + " s" : Math.round(v) + " ms";
  /* Counts run to billions over a busy hour, and eleven digits in a table cell is a number nobody
     reads. The exact value stays in the cell's title attribute. */
  if (v >= 1e9) return (v/1e9).toFixed(2) + "B";
  if (v >= 1e6) return (v/1e6).toFixed(2) + "M";
  if (v >= 1e4) return (v/1e3).toFixed(1) + "k";
  return Math.round(v).toLocaleString("en-US");
};
const wlRate = (cell, unit) => {
  if (!cell || cell.perSecond == null) return "";
  const r = cell.perSecond;
  /* Milliseconds of something per second of wall clock is an average concurrency, and saying so
     is the difference between a number and a reading: 8,277 ms/s of CPU is 8.28 cores busy the
     whole time, and 174 ms/s of lock wait is 0.17 sessions blocked at any instant. "% of one core"
     was right for the CPU row and meaningless on the lock row; this is right on both. */
  const txt = unit === "mb" ? r.toFixed(2) + " MB/s"
            : unit === "ms" ? (r/1000).toFixed(2) + " concurrent"
            : (r >= 1e6 ? (r/1e6).toFixed(2)+"M" : r >= 1e4 ? (r/1e3).toFixed(1)+"k"
               : r >= 10 ? Math.round(r).toLocaleString("en-US") : r.toFixed(2)) + "/s";
  return `<span class="code">${esc(txt)}</span>`;
};
/* A plan cache can be a month old, and "733h" is a number the reader has to divide. */
const wlSpan = s => s == null ? "—"
  : s >= 172800 ? Math.round(s/86400) + " days"
  : s >= 82800  ? Math.round(s/3600) + "h"
  : s >= 5400   ? (s/3600).toFixed(1) + "h"
  : Math.round(s/60) + " min";

/* "· 48 of 60 CPUs online" wherever the engine said how many it may use - "· 32 of 32" too, as the
   CPU tile prints it (0.30.0's 1.185): a bare "· 32 CPUs" could not say whether the engine had been
   asked at all. The bare "· 60 CPU" before that was the host's count on an instance licensed for 48
   of them, read by everyone as the engine's. */
const wlCpuHead = c => !c || !c.total ? ""
  : c.online ? ` · ${c.online} of ${c.total} CPUs online` : ` · ${c.total} CPUs`;
function wlCpuFacts(w){
  const c = w.cpu || {};
  const parts = [];
  if (c.total && c.online && c.online < c.total) {
    parts.push(`<b>${esc(c.label || c.edition || c.engine || "This instance")}</b> runs on <b>${c.online}</b> of
      this host's <b>${c.total}</b> logical CPUs${c.limit?` — ${esc(c.limit)}`:""}. Database CPU is a
      percentage of those ${c.online}: 100% is the engine saturated, while the host's CPU reads about
      ${Math.round(c.online*100/c.total)}% at that moment.`);
  }
  if (w.cpuNote) parts.push(esc(w.cpuNote));
  return parts.length ? `<p class="sec-note">${parts.join(" ")}</p>` : "";
}

function workloadBlock(w){
  if (!w) return "";
  if (!w.available && !w.samples) {
    /* Nothing collected at all is a different statement from "one collection so far": an engine
       with no counters for this section must not be told to wait half an hour. */
    return `<details class="fold"><summary>Workload — not collected for this server${wlCpuHead(w.cpu)}</summary><div class="in">
      <p class="sec-note">No workload counters have been collected here. SQL Server and Oracle report
      them through <span class="mono">PERFORMANCE_WORKLOAD_COUNTERS</span>; the CPU of a PostgreSQL
      instance, which keeps no CPU total of its own, is counted from the host by
      <span class="mono">OS_CPU_COUNTERS</span> where host collectors run.${
      w.cpuNote?" "+esc(w.cpuNote):""}</p>
    </div></details>`;
  }
  if (!w.available) {
    /* Not a failure, and it must not read as one. Two collections 15 minutes apart is the
       earliest an interval can exist at all. */
    return `<details class="fold"><summary>Workload — no interval yet</summary><div class="in">
      <p class="sec-note">The workload counters need <b>two</b> collections before a rate exists;
      ${w.samples||0} so far. They run every 15 minutes, so the first reading appears about half an
      hour after this instance was onboarded. Nothing is wrong — and the cumulative totals are
      deliberately not shown in the meantime, because a since-boot total is not a rate.</p>
    </div></details>`;
  }
  const wins = w.windows || [];
  const head = wins.map(x=>`<th class="nowrap">${esc(x.label)}<span class="code">${esc(wlSpan(x.seconds))} measured</span></th>`).join("");
  const cells = (row) => wins.map(x=>{
    const c = (row.values||{})[x.key];
    if (!c) return `<td class="mono muted">—</td>`;
    /* "≈" on a figure built from per-minute samples rather than a counter, and the minutes it
       sampled under it: a reader comparing two servers must see which number is exact. */
    return `<td class="mono nowrap" title="${esc(String(c.total))}">${c.estimate?"≈ ":""}${esc(wlUnit(c.total, row.unit))}${wlRate(c, row.unit)}${
      c.sub?`<span class="code">${esc(c.sub)}</span>`:""}</td>`;
  }).join("");

  const groups = (w.groups||[]).map(g=>
    `<tr class="wl-group"><td colspan="${wins.length+1}">${esc(g.name)}</td></tr>`
    + g.rows.map(r=>`<tr><td class="metric">${esc(r.label)}${
        r.source?`<span class="code wl-src">${esc(r.source)}</span>`:""}</td>${cells(r)}</tr>`).join("")
  ).join("");

  const waits = (w.waits||[]).map(x=>`<tr><td class="metric mono">${esc(x.item)}</td>${
    wins.map(win=>{
      const c = (x.values||{})[win.key];
      if (!c) return `<td class="mono muted">—</td>`;
      return `<td class="mono nowrap">${esc(c.seconds.toLocaleString("en-US"))} s${
        c.sharePct==null?"":`<span class="code">${c.sharePct}% of all waits</span>`}</td>`;
    }).join("")}</tr>`).join("");

  const cache = w.cache && w.cache.rows && w.cache.rows.length ? `
    <p class="sec-note" style="margin-top:14px"><b>What the plan cache attributes the same work
      to.</b> <span class="mono">sys.dm_exec_query_stats</span> only holds plans that are still
      cached: an evicted plan takes its totals with it, and a batch that was never cached was never
      counted. So these are a <i>sample</i> of the interval and always an undercount — use them to
      find the statements to tune, never to total the instance. The Database CPU row above is the
      one that misses nothing; the share below is these two divided, and is left blank where that
      row is itself an estimate.
      ${(w.cache.evicted||[]).length?`<b>${esc(w.cache.evicted.join(", "))}</b> fell during a window 
        because the cache dropped a plan, so ${w.cache.evicted.length>1?"those figures are":"that figure is"} 
        left blank rather than shown as negative work.`:""}
      ${w.cache.plans!=null?`The cache holds ${esc(wlUnit(w.cache.plans,"count"))} plans`:""}${
        w.cache.baselineMinutes!=null?`, the oldest ${esc(wlSpan(w.cache.baselineMinutes*60))} old`:""}.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Plan cache</th>${head}</tr></thead>
      <tbody>${w.cache.rows.map(r=>`<tr><td class="metric">${esc(r.label)}</td>${cells(r)}</tr>`).join("")}
        <tr><td class="metric">Share of instance CPU</td>${wins.map(x=>{
          const v = (w.cache.coveragePct||{})[x.key];
          return `<td class="mono nowrap">${v==null?'<span class="muted">—</span>':esc(v+"%")}</td>`;
        }).join("")}</tr>
      </tbody></table></div>` : "";

  const waitTable = waits ? `
    <p class="sec-note" style="margin-top:14px"><b>What it waited on, over the same intervals.</b>
      These are the cumulative wait counters differenced, so they cover the whole window with no
      sampling gap — unlike the wait alert, which watches for five seconds every 150 and therefore
      sees 3% of it. Idle and background waits are excluded from the share.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Wait type</th>${head}</tr></thead><tbody>${waits}</tbody></table></div>` : "";

  /* The windows end at the newest sample, not at now: said, so counters that stopped a day ago do
     not read as the last hour (audit 2026-11-05, B8). */
  return `<details class="fold" open><summary>Workload — what this instance actually did${
      wlCpuHead(w.cpu)}${w.asOf ? ` · to ${when(w.asOf)}` : ""}</summary><div class="in">
    ${wlCpuFacts(w)}
    <p class="sec-note">Counters differenced between two collections, so every figure is work done
      <b>during</b> the interval — not a total since the engine started${
      w.countersSince?` (<span class="mono">${esc(w.countersSince)}</span>)`:""}, which is what
      the engine's own views report and what makes them useless read once. The small grey line under a value is
      the rate per second. A column is missing when there is no honest pair of samples to subtract:
      counters that went backwards mean a restart, and a delta across one would show as work that
      never happened.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Measure</th>${head}</tr></thead><tbody>${groups}</tbody></table></div>
    ${waitTable}
    ${cache}
    </div></details>`;
}

/* Attribution — which database wrote the log, and which statements did the work.

   Asked on 2026-09-11 from this page: WRITELOG was 36% of an instance's waits and the plan cache had
   run 2.8M executions in 15 minutes, and nothing here said which database or which statement. Both
   blocks are cumulative totals differenced per database / per query_hash, over the same windows as
   the Workload table. Each window is its own fold because a table per window side by side would be
   thirty columns wide; the newest is open. */
const attrWait = (w, key) => {
  const row = ((w && w.waits) || []).find(x => x.item === "WRITELOG");
  const c = row && (row.values||{})[key];
  return c ? ` · WRITELOG ${c.seconds.toLocaleString("en-US")} s${c.sharePct==null?"":` (${c.sharePct}% of waits)`}` : "";
};
const attrNum = (v, unit) => v == null ? '<span class="muted">—</span>' : esc(wlUnit(v, unit));

function logBlock(l, w){
  if (!l || (!l.available && !l.samples)) return "";
  if (!l.available) {
    return `<details class="fold"><summary>Transaction log by database — no interval yet</summary><div class="in">
      <p class="sec-note">Each database needs <b>two</b> collections before its log rate exists;
      ${l.samples||0} so far, every 15 minutes.</p></div></details>`;
  }
  const folds = (l.windows||[]).map((win, i) => {
    const rows = win.databases.map(db => `<tr>
      <td class="metric">${esc(db.database)}</td>
      <td class="mono nowrap">${attrNum(db.logMb, "mb")}${db.logMbPerSec==null?"":`<span class="code">${esc(db.logMbPerSec.toFixed(3))} MB/s</span>`}</td>
      <td class="mono nowrap">${db.sharePct==null?"—":esc(db.sharePct+"%")}</td>
      <td class="mono nowrap">${attrNum(db.flushes, "count")}</td>
      <td class="mono nowrap">${db.avgFlushKb==null?"—":esc(db.avgFlushKb.toFixed(1)+" KB")}</td>
      <td class="mono nowrap">${attrNum(db.flushWaits, "count")}</td>
      <td class="mono nowrap">${attrNum(db.writeTransactions, "count")}</td>
      <td class="mono nowrap">${db.avgTxnKb==null?"—":esc(db.avgTxnKb.toFixed(1)+" KB")}</td>
      <td class="mono nowrap">${db.writeLatencyMs==null?"—":esc(db.writeLatencyMs.toFixed(2)+" ms")}</td>
      <td class="mono nowrap">${db.writeStallSec==null?"—":esc(db.writeStallSec < 1
        ? Math.round(db.writeStallSec*1000)+" ms"
        : db.writeStallSec.toLocaleString("en-US",{maximumFractionDigits:1})+" s")}${
        db.stallSharePct==null?"":`<span class="code">${esc(db.stallSharePct+"% of log stall")}</span>`}</td>
    </tr>`).join("");
    const others = win.others ? `<tr><td class="metric muted">${win.others.count} more database(s)</td>
      <td class="mono nowrap muted">${attrNum(win.others.logMb, "mb")}</td><td colspan="8"></td></tr>` : "";
    return `<details class="fold"${i===0?" open":""}><summary>${esc(win.label)} · ${esc(wlSpan(win.seconds))} measured · ${
        esc(wlUnit(win.totals.logMb, "mb"))} of log from ${win.totals.databases} database(s)${attrWait(w, win.key)}</summary>
      <div class="in"><div class="tbl-wrap"><table class="rpt">
        <thead><tr><th>Database</th><th>Log generated</th><th>Share</th><th>Flushes</th><th>Avg flush</th>
          <th>Commits that waited</th><th>Write transactions</th><th>Log per write txn</th>
          <th>Log write latency</th><th>Log write stall</th></tr></thead>
        <tbody>${rows}${others}</tbody></table></div></div></details>`;
  }).join("");
  return `<details class="fold" open><summary>Transaction log — which database wrote it</summary><div class="in">
    <p class="sec-note">WRITELOG is a session waiting for its log block to reach disk, so it has two
      causes and this table separates them: <b>how much</b> log a database generates (volume, and
      how many commits it is cut into) and <b>how long</b> writing it takes (log write latency, from
      the log file's own write stall over the same window). A database with modest volume and high
      latency is a storage problem; one with small transactions and many flushes is a commit-pattern
      problem — "Log per write txn" of a few KB is row-by-row committing. <b>No DMV attributes log to
      a procedure</b>; the nearest honest proxy is <i>logical writes</i> in the Top queries block
      below.</p>
    ${folds}</div></details>`;
}

function topQueriesBlock(q){
  if (!q || (!q.available && !q.samples)) return "";
  if (!q.available) {
    return `<details class="fold"><summary>Top queries — no interval yet</summary><div class="in">
      <p class="sec-note">A query's work over an interval is two collections of it subtracted; ${
      q.samples||0} collection(s) so far, every 30 minutes.</p></div></details>`;
  }
  const rankings = q.rankings || [];
  const valueOf = (row, key) => ({cpu_ms: row.cpuMs, elapsed_ms: row.elapsedMs,
    logical_reads: row.logicalReads, physical_reads: row.physicalReads,
    logical_writes: row.logicalWrites, executions: row.executions})[key];
  const table = (rows, key) => `<div class="tbl-wrap"><table class="rpt">
    <thead><tr><th>#</th><th>Statement</th><th>Executions</th><th>CPU</th><th>Duration</th>
      <th>Logical reads</th><th>Physical reads</th><th>Logical writes</th>
      <th>Per execution</th><th>Elapsed spread<span class="code">since cached</span></th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td class="mono">${r.ranks[key]}</td>
      <td><div class="mono" style="font-size:11px">${esc(r.database||"?")}${r.object?" · <b>"+esc(r.object)+"</b>":""}
        <span class="code">${esc(r.hash)}${r.plans>1?" · "+r.plans+" plans":""}${
        r.basis==="cached_in_window"?" · cached inside this window":""}</span></div>
        <div class="sqltext">${esc(r.text||"(text no longer in cache)")}</div></td>
      <td class="mono nowrap">${attrNum(r.executions, "count")}</td>
      <td class="mono nowrap">${attrNum(r.cpuMs, "ms")}${r.cpuSharePct==null?"":`<span class="code">≈${esc(r.cpuSharePct+"% of instance CPU")}</span>`}</td>
      <td class="mono nowrap">${attrNum(r.elapsedMs, "ms")}</td>
      <td class="mono nowrap">${attrNum(r.logicalReads, "count")}</td>
      <td class="mono nowrap">${attrNum(r.physicalReads, "count")}</td>
      <td class="mono nowrap">${attrNum(r.logicalWrites, "count")}</td>
      <td class="mono nowrap">${r.avgElapsedMs==null?"—":esc(r.avgElapsedMs.toFixed(2)+" ms")}<span class="code">${
        r.avgCpuMs==null?"":esc("cpu "+r.avgCpuMs.toFixed(2)+" ms")}${
        r.avgLogicalReads==null?"":esc(" · "+wlUnit(r.avgLogicalReads,"count")+" reads")}</span></td>
      <td class="mono nowrap">${r.minElapsedMs==null||r.maxElapsedMs==null?"—":esc(
        r.minElapsedMs.toFixed(1)+" – "+r.maxElapsedMs.toLocaleString("en-US",{maximumFractionDigits:1})+" ms")}</td>
    </tr>`).join("")}</tbody></table></div>`;
  const folds = (q.windows||[]).map((win, i) => {
    const inner = rankings.map((rk, j) => {
      const rows = win.queries.filter(r => r.ranks[rk.key]).sort((a,b) => a.ranks[rk.key]-b.ranks[rk.key]);
      if (!rows.length) return "";
      const by = rk.label === rk.label.toUpperCase() ? rk.label : rk.label.toLowerCase();  /* "CPU" stays CPU */
      return `<details class="fold"${j===0?" open":""}><summary>Top ${rows.length} by ${esc(by)}</summary>
        <div class="in">${table(rows, rk.key)}</div></details>`;
    }).join("");
    return `<details class="fold"${i===0?" open":""}><summary>${esc(win.label)} · ${esc(wlSpan(win.seconds))} measured${
        win.unranked?` · ${win.unranked} cached statement(s) had no earlier sample and are not ranked`:""}</summary>
      <div class="in">${inner || '<p class="sec-note">No cached statement did any work in this window.</p>'}</div></details>`;
  }).join("");
  return `<details class="fold" open><summary>Top queries — which statements did the work</summary><div class="in">
    <p class="sec-note">The plan cache's work broken down by statement (grouped by
      <span class="mono">query_hash</span>, so one statement with many plans ranks as one). Every figure
      is the statement's work <b>during</b> the window. Same caveat as the plan-cache table above: an
      evicted plan takes its totals with it, so this ranks what is still cached. A statement is ranked
      only when it has an earlier sample to subtract from, or when all its plans were cached inside the
      window; the rest are counted, not guessed. <b>The elapsed spread is not a percentile</b> — it is
      the fastest and slowest single execution since the plan was cached, which is all the engine
      keeps; a max far above the per-execution average is the sign that a percentile would show a
      tail.</p>
    ${folds}</div></details>`;
}

/* Memory, as ranges rather than readings.

   The section exists because the page had CPU, I/O, waits and workload and nothing about memory,
   so every memory question was answered by running a DMV by hand. It is built as a range per
   window because of what happened when one was: page life expectancy read 54 seconds, the
   instance was called short of memory, and the same counter read 447 shortly afterwards. A cell
   that can only show one instant makes that mistake available; one that shows the spread does
   not. */
const memKB = kb => {
  if (kb == null) return "—";
  const gb = kb / 1048576;
  if (gb >= 10) return gb.toFixed(0) + " GB";
  if (gb >= 1)  return gb.toFixed(1) + " GB";
  return (kb/1024).toFixed(0) + " MB";
};
/* Page life expectancy is quoted in seconds by every DBA and every article about it — "PLE 54"
   is the sentence, and rounding it to "1 min" makes the page disagree with the conversation it
   is meant to settle. So seconds always, with the readable form added only once the number is
   long enough to need one. */
const memSecs = s => s == null ? "—"
  : s >= 3600 ? Math.round(s).toLocaleString("en-US") + " s (" + (s/3600).toFixed(1) + "h)"
  : Math.round(s).toLocaleString("en-US") + " s";
const memValue = (v, unit) => unit === "kb" ? memKB(v)
  : unit === "seconds" ? memSecs(v)
  : unit === "flag" ? (v ? "YES" : "no")
  : (v == null ? "—" : Math.round(v).toLocaleString("en-US"));

function memoryBlock(m){
  if (!m || !m.available || !(m.groups||[]).length) return "";
  const wins = m.windows || [];
  const head = wins.map(x=>`<th class="nowrap">${esc(x.label)}<span class="code">${
     x.key === "now" ? "one reading" : esc(wlSpan(x.seconds)) + " · " + x.samples + " readings"
   }</span></th>`).join("");

  const cell = (row, win) => {
    const c = (row.values||{})[win.key];
    if (!c) return `<td class="mono muted">—</td>`;
    /* The latest reading is the headline; the range under it is what stops the headline being
       mistaken for the window. A single-reading column has no range to show, and one invented
       from one sample would be a lie in the reader's favour. */
    const headline = memValue(c.latest, row.unit);
    if (win.key === "now" || c.count < 2 || c.min === c.max) {
      return `<td class="mono nowrap">${esc(headline)}</td>`;
    }
    /* Which end is the finding differs per row, and saying so is the difference between a table
       that can be read and one that has to be interpreted. */
    const watched = row.watch === "min" ? memValue(c.min, row.unit)
                  : row.watch === "max" ? memValue(c.max, row.unit) : null;
    const label = row.watch === "min" ? "lowest " : row.watch === "max" ? "peak " : "";
    const range = `${memValue(c.min, row.unit)} – ${memValue(c.max, row.unit)}`;
    return `<td class="mono nowrap">${esc(headline)}<span class="code">${
      watched ? `<b>${esc(label + watched)}</b> · range ${esc(range)}` : `range ${esc(range)}`
    }</span></td>`;
  };

  const groups = (m.groups||[]).map(g=>
    `<tr class="wl-group"><td colspan="${wins.length+1}">${esc(g.name)}</td></tr>`
    + g.rows.map(r=>`<tr><td class="metric">${esc(r.label)}</td>${
        wins.map(w=>cell(r,w)).join("")}</tr>`).join("")
  ).join("");

  const nodes = m.facts && m.facts.ple_node_count;
  const restarted = (wins||[]).some(w=>w.restarted);

  return `<details class="fold"><summary>Memory — what the pool looked like${
      m.atTarget === true ? " · at target" : m.atTarget === false ? " · BELOW target" : ""
    }</summary><div class="in">
    <p class="sec-note">These are <b>gauges</b>, not counters: each one is a reading of the moment,
      so they are summarised over the window rather than subtracted like the workload figures
      above. The headline in each cell is the latest reading and the grey line is the spread — the
      end that matters is named, because for page life expectancy it is the <i>lowest</i> value and
      for pending grants it is the <i>highest</i>.</p>
    <p class="sec-note"><b>Read this table downwards, not from the middle.</b> Page life expectancy
      is the number everyone reaches for and the weakest evidence here: it drops whenever a large
      scan lands and recovers on its own. The rows above it are what settle the question — if
      nothing waited for a memory grant and the pool is holding its target, then a low page life
      expectancy is the workload reading data, not the instance being short of memory.${
      nodes ? ` This instance has <b>${esc(String(Math.round(nodes)))} NUMA nodes</b>, and the
      instance-wide figure is a combination of them rather than the worst of them — so the node row
      is the one that shows a single node under pressure.` : ""}${
      restarted ? ` <b>A window here spans an engine restart.</b> Page life expectancy starts near
      zero after one and climbs, so a minimum drawn across it is the restart rather than memory
      pressure.` : ""}</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Measure</th>${head}</tr></thead><tbody>${groups}</tbody></table></div>
    <p class="sec-note" style="margin-top:10px">Lazy writes, physical reads and PAGEIOLATCH waits
      are in the Workload section above, not repeated here: they are cumulative counters and belong
      with the interval arithmetic. Read together with this table they are the full picture —
      buffer cache hit ratio is deliberately absent from both, because it counts a read-ahead page
      as a hit and reads 99.99% on exactly the scan-heavy workload this section exists to
      describe.</p>
    </div></details>`;
}

/* Linked servers, as a decision table. Reachability alone is a status chip; reachability NEXT
   TO the reference count is a decision — which is why this is a table and not a chip strip.
   The verdict column is the whole point: an unreachable server nothing calls is cleanup, the
   same server with a procedure behind it is the next outage. */
const VERDICT_CLS = {FIX:"crit", DROP:"warn", REVIEW:"warn", KEEP:"ok"};
/* Query Store, per database. Its own section because the question is per database and the
   answer has settings attached: "can I still investigate what happened on this database
   yesterday" is not answerable from a status chip.

   The state shown is the ACTUAL state. A Query Store that reaches its max_storage_size flips
   itself to READ_ONLY and stops capturing while sys.databases.is_query_store_on still reads 1 —
   so a page built on the configured flag calls that database covered when it has recorded
   nothing since the day it filled up. That is the row this section exists to surface. */
function queryStoreBlock(q){
  if (!q || !q.databases || !q.databases.length) return "";
  const s = q.summary;
  const num = v => v==null ? "—" : String(v);
  const mb = v => v==null ? "—" : (v>=1024 ? (v/1024).toFixed(1)+" GB" : v+" MB");
  const stateChip = r => {
    if (r.state === "READ_WRITE") return `<span class="sev ok">CAPTURING</span>`;
    if (r.state === "AG_SECONDARY") return `<span class="sev">SECONDARY</span>`;
    if (r.state === "OFF") return `<span class="sev warn">OFF</span>`;
    /* ERROR / READ_ONLY / NOT_ONLINE: switched on at some point and not recording now. */
    return `<span class="sev crit">${esc(r.state || "UNKNOWN")}</span>`;
  };
  const storage = r => {
    if (r.storagePct == null) return "—";
    const cls = r.storagePct >= 90 ? "crit" : r.storagePct >= 75 ? "warn" : "";
    return `<span class="${cls}">${r.storagePct}%</span> <span class="code">${esc(mb(r.storageMB))} / ${esc(mb(r.maxStorageMB))}</span>`;
  };
  const rows = q.databases.map(r=>{
    /* "off" on its own cannot be acted on. Somebody switching Query Store off is a decision;
       Query Store switching itself off after an error is a fault, usually with captured data
       still sitting in the database — one instance here reads desired OFF / actual ERROR with
       2128 MB still there, and both cases used to render as the same flat "off". */
    const why = [r.offReasonDesc, r.readonlyReasonDesc,
                 (r.desiredState && r.actualState && r.desiredState !== r.actualState)
                   ? `configured ${r.desiredState}, actually ${r.actualState}` : ""]
      .filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(" · ");
    const note = why ? `<div class="detail">${esc(why)}</div>` : "";
    return `<tr class="${r.capturing ? "" : "warn"}">
      <td>${stateChip(r)}</td>
      <td class="metric">${esc(r.name)}${note}</td>
      <td class="nowrap mono">${esc(r.actualState || r.state || "—")}</td>
      <td class="nowrap">${storage(r)}</td>
      <td class="nowrap mono">${esc(r.captureMode || "—")}</td>
      <td class="nowrap mono">${esc(r.cleanupMode || "—")}</td>
      <td class="nowrap mono">${esc(r.waitStatsCapture || "—")}</td>
      <td class="nowrap mono">${esc(num(r.staleQueryThresholdDays))}d / ${esc(num(r.intervalLengthMinutes))}m</td>
      <td class="nowrap mono">${esc(num(r.maxPlansPerQuery))}</td>
    </tr>`;
  }).join("");
  const head = `${s.capturing}/${s.databases} capturing`
    + (s.off ? ` · ${s.off} off` : "")
    + (s.onButNotCapturing ? ` · ${s.onButNotCapturing} on but not capturing` : "")
    + (s.stoppedOnItsOwn ? ` · ${s.stoppedOnItsOwn} stopped on its own` : "");
  return `<details class="fold"${(s.onButNotCapturing || s.off) ? " open" : ""}>
    <summary>Query Store — ${esc(head)}</summary>
    <div class="in">
    <p class="sec-note">Whether each database is recording query history, and how it is
      configured. <b>CAPTURING</b> is the actual state (READ_WRITE), not the configured one:
      Query Store that reaches its storage limit switches itself to READ_ONLY and stops
      recording, while the database still reports Query Store as on — so the state here is the
      one that says whether a slowdown can still be diagnosed afterwards. Each row that is not
      capturing says <b>why</b>: <i>switched off</i> is somebody's decision, while <i>stopped
      after an error</i> or <i>storage size limit reached</i> is Query Store having stopped by
      itself, usually with captured data still in the database (turning it back on cleanly then
      needs <span class="mono">ALTER DATABASE … SET QUERY_STORE CLEAR</span>). Storage shows how
      close each one is to that limit. <b>Retention</b> is the stale-query threshold and the
      aggregation interval. This is an inventory collected once a day; the alerting on a
      misbehaving query belongs to QUERY_STORE_QUERY_ISSUES.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>Database</th><th>State</th><th>Storage used</th><th>Capture</th>
        <th>Cleanup</th><th>Wait stats</th><th>Retention</th><th>Max plans</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    </div></details>`;
}

/* Query Store findings — QUERY_STORE_QUERY_ISSUES over the last day, one row per query plan,
   each marked still happening or cleared. The charts could not carry these: the metric's item is
   the KIND of finding, so three regressed queries became one series with one query's message, a
   kind seen for the first time had too few samples to be drawn, and a regression that cleared left
   no trace at all. A day is kept so the morning after a plan flip still shows what happened. */
function queryStoreFindingsBlock(q){
  if (!q || !q.summary || !q.summary.collected) return "";
  const s = q.summary;
  const n = (v, d=0) => v==null ? "—" : Number(v).toLocaleString(undefined, {maximumFractionDigits:d});
  const kind = k => String(k||"").replace(/^QUERY_/, "").replace(/_/g, " ").toLowerCase();
  const sev = v => v==="CRITICAL" ? "crit" : v==="WARNING" ? "warn" : "";
  if (!q.findings.length){
    return `<details class="fold"><summary>Query Store findings — none in the last ${s.windowHours} h</summary>
      <div class="in"><p class="sec-note">QUERY_STORE_QUERY_ISSUES last ran at ${when(s.asOf)} and has
      reported no query on a worse plan, and no heavy, long or blocked execution, in the last
      ${s.windowHours} hours.</p></div></details>`;
  }
  const rows = q.findings.map(f=>`<tr class="${f.now ? sev(f.severity) : ""}">
      <td>${f.now ? `<span class="sev ${sev(f.severity)}">NOW</span>` : `<span class="sev">cleared</span>`}</td>
      <td><span class="sev ${sev(f.worst)}">${esc(f.worst)}</span></td>
      <td class="metric">${esc(kind(f.kind))}</td>
      <td class="nowrap mono">${esc(f.database)}</td>
      <td class="nowrap mono">${esc(f.queryId)} / ${esc(f.planId)}${f.otherPlanId ? ` <span class="muted">vs ${esc(f.otherPlanId)}</span>` : ""}</td>
      <td class="nowrap mono">${when(f.firstSeen)}</td>
      <td class="nowrap mono">${when(f.lastSeen)}</td>
      <td class="nowrap mono">${n(f.reports)}</td>
      <td class="nowrap mono">${n(f.peakRecentCpuSec, 1)} s${f.queryBadPlans > 1 ? ` <span class="muted">query ${n(f.peakQueryBadCpuSec, 1)} s on ${n(f.queryBadPlans)} plans</span>` : ""}</td>
      <td class="nowrap mono">${n(f.recentAvgCpuMs, 1)} ms${f.bestAvgCpuMs!=null ? ` <span class="muted">was ${n(f.bestAvgCpuMs, 2)} ms</span>` : ""}</td>
      <td class="nowrap mono">${f.peakCpuRatio!=null ? n(f.peakCpuRatio, 1)+"×" : "—"}</td>
      <td class="nowrap mono">${n(f.peakMaxDurationSec, 1)} s</td>
      <td class="nowrap mono">${n(f.peakMaxLogicalReads)}</td>
    </tr>`).join("");
  const head = (s.now ? `${s.now} happening now` + (s.criticalNow ? ` (${s.criticalNow} critical)` : "")
                      : "nothing happening now")
    + (s.cleared ? ` · ${s.cleared} cleared` : "") + ` · last ${s.windowHours} h`;
  return `<details class="fold" open>
    <summary>Query Store findings — ${esc(head)}</summary>
    <div class="in">
    <p class="sec-note">One row per query on one plan over the last ${s.windowHours} hours.
      <b>NOW</b> is still reported by the newest collection (${when(s.asOf)}); <b>cleared</b> was
      reported earlier and no longer is. <b>Reports</b> counts the runs that reported it, every
      15 minutes while it lasted. <b>Plan regressed, frequent</b> is a small statement on a worse
      plan run often: its average CPU now, what the cheapest other plan of the same query averaged
      over seven days, and the peak ratio between them; its CPU is judged for the whole query, all its
      bad plans together, and shown beside the plan's own when there is more than one. The other kinds are one execution being
      heavy, long or blocked. CPU, ratio, duration and reads are the peaks over the day.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>Worst</th><th>Finding</th><th>Database</th><th>Query / plan</th>
        <th>First seen</th><th>Last seen</th><th>Reports</th><th>CPU per run</th><th>Avg CPU</th>
        <th>Ratio</th><th>Max duration</th><th>Max reads</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    </div></details>`;
}

/* Latency percentiles — Query Store, Oracle wait event histograms, and PostgreSQL statement totals.
   Arithmetic across collections is evaluated by dbabrain/lib/latency_percentiles.py. */
function latencyBlock(l){
  if (!l) return "";
  if (!l.collected){
    return `<details class="fold"><summary>Latency percentiles — not collected</summary><div class="in">
      <p class="sec-note">Nothing was collected for latency percentiles on this server in the window.</p>
    </div></details>`;
  }

  const ms = v => v == null ? "—" : Number(v).toFixed(2);
  const count = v => v == null ? "—" : Number(v).toLocaleString();
  const bound = v => v == null ? "—" : "&lt;= " + (Number.isInteger(v) ? v : Number(v).toFixed(2)) + " ms";

  const blocks = [];

  const pr = l.probe;
  if (pr && pr.collected){
    if (pr.available){
      const rows = (pr.targets || []).map(t => `<tr>
        <td class="metric">${esc(t.target)}</td>
        <td class="nowrap mono">${count(t.samples)}</td>
        <td class="nowrap mono">${count(t.failed)}</td>
        <td class="nowrap mono">${ms(t.p50_ms)}</td>
        <td class="nowrap mono">${ms(t.p95_ms)}</td>
        <td class="nowrap mono">${ms(t.p99_ms)}</td>
        <td class="nowrap mono">${ms(t.max_ms)}</td>
      </tr>`).join("");
      blocks.push(`<h3 class="sub">Connection probe (last 24 h)</h3>
        <p class="sec-note">${esc(pr.nature)}</p>
        <div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>Instance</th><th>Probes</th><th>Failed</th><th>p50 (ms)</th><th>p95 (ms)</th>
            <th>p99 (ms)</th><th>Max (ms)</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`);
    } else {
      blocks.push(`<h3 class="sub">Connection probe (last 24 h)</h3>
        <p class="sec-note">${esc(pr.reason || "No timed probe yet.")}</p>`);
    }
  }

  if (l.sqlserver && l.sqlserver.collected){
    if (l.sqlserver.available && l.sqlserver.databases && l.sqlserver.databases.length){
      const rows = [];
      l.sqlserver.databases.forEach(db => {
        (db.intervals || []).forEach(it => {
          rows.push(`<tr>
            <td class="metric">${esc(db.database || db.name)}</td>
            <td class="nowrap mono">${when(it.interval_start_utc || it.interval_start) || "—"}</td>
            <td class="nowrap mono">${when(it.interval_end_utc || it.interval_end) || "—"}</td>
            <td class="nowrap mono">${count(it.executions)}</td>
            <td class="nowrap mono">${count(it.plans)}</td>
            <td class="nowrap mono">${ms(it.p50_ms)}</td>
            <td class="nowrap mono">${ms(it.p95_ms)}</td>
            <td class="nowrap mono">${ms(it.p99_ms)}</td>
            <td class="nowrap mono">${ms(it.avg_ms)}</td>
            <td class="nowrap mono">${ms(it.max_ms)}</td>
          </tr>`);
        });
      });
      blocks.push(`<h3 class="sub">SQL Server Query Store latency</h3>
        <p class="sec-note">${esc(l.sqlserver.nature)}</p>
        <div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>Database</th><th>Interval start</th><th>Interval end</th>
            <th>Executions</th><th>Plans</th><th>p50 (ms)</th><th>p95 (ms)</th><th>p99 (ms)</th>
            <th>Avg (ms)</th><th>Max (ms)</th></tr></thead>
          <tbody>${rows.join("")}</tbody></table></div>`);
    } else {
      blocks.push(`<h3 class="sub">SQL Server Query Store latency</h3>
        <p class="sec-note">${esc(l.sqlserver.reason || "No completed intervals in the window.")}</p>`);
    }
  }

  if (l.oracle && l.oracle.collected){
    if (l.oracle.available && l.oracle.events && l.oracle.events.length){
      const rows = l.oracle.events.map(e => `<tr>
        <td class="metric">${esc(e.event)}</td>
        <td class="nowrap mono">${count(e.waits)}</td>
        <td class="nowrap mono">${bound(e.p50_ms_le)}</td>
        <td class="nowrap mono">${bound(e.p95_ms_le)}</td>
        <td class="nowrap mono">${bound(e.p99_ms_le)}</td>
      </tr>`).join("");
      blocks.push(`<h3 class="sub">Oracle wait event latency</h3>
        <p class="sec-note">${esc(l.oracle.nature)}</p>
        <div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>Wait event</th><th>Waits</th><th>p50</th><th>p95</th><th>p99</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`);
    } else {
      blocks.push(`<h3 class="sub">Oracle wait event latency</h3>
        <p class="sec-note">${esc(l.oracle.reason || "An interval needs two collections with no restart between them.")}</p>`);
    }
  }

  const pg = l.postgresql;
  if (pg && pg.collected){
    if (pg.available && pg.interval){
      const it = pg.interval;
      blocks.push(`<h3 class="sub">PostgreSQL statement latency</h3>
        <p class="sec-note">${esc(pg.nature)}</p>
        <div class="tbl-wrap"><table class="rpt">
          <thead><tr><th>Calls</th><th>Calls covered</th><th>Statements</th><th>Mean (ms)</th><th>p50 (ms)</th><th>p95 (ms)</th><th>p99 (ms)</th></tr></thead>
          <tbody><tr>
            <td class="nowrap mono">${count(it.calls)}</td>
            <td class="nowrap mono">${count(it.covered_calls)}</td>
            <td class="nowrap mono">${count(it.statements)}</td>
            <td class="nowrap mono">${ms(it.mean_ms)}</td>
            <td class="nowrap mono">${ms(it.p50_ms)}</td>
            <td class="nowrap mono">${ms(it.p95_ms)}</td>
            <td class="nowrap mono">${ms(it.p99_ms)}</td>
          </tr></tbody></table></div>`);
    } else {
      blocks.push(`<h3 class="sub">PostgreSQL statement latency</h3>
        <p class="sec-note">${esc(pg.reason || "An interval needs two collections with no restart between them.")}</p>`);
    }
  }

  if (!blocks.length){
    return `<details class="fold"><summary>Latency percentiles — not collected</summary><div class="in">
      <p class="sec-note">${esc(l.reason || "Nothing was collected.")}</p>
    </div></details>`;
  }

  const isOpen = Boolean(l.available);
  const head = l.available ? "measured intervals"
    : (pg && pg.state === "not_installed" ? "pg_stat_statements not configured"
       : "no interval yet");

  return `<details class="fold"${isOpen ? " open" : ""}>
    <summary>Latency percentiles — ${esc(head)}</summary>
    <div class="in">
      ${blocks.join("")}
    </div></details>`;
}

/* Operational diagnostics — newest error log / alert log readings, ADR incidents,
   memory dumps and sp_server_diagnostics, PostgreSQL server log, and suspect pages corruption.
   An older collection's finding that cleared is not shown. */
function diagnosticsBlock(d){
  if (!d || !d.sources || !d.sources.length) return "";

  const isOpen = d.worst === "CRITICAL" || d.worst === "WARNING";
  const head = isOpen
    ? `Diagnostics — ${esc(d.worst)} · ${d.findingCount} finding(s)`
    : "Diagnostics — clean";

  const rows = [];
  d.sources.forEach(s => {
    if (s.findings && s.findings.length) {
      s.findings.forEach(f => {
        const c = cls(f.status);
        rows.push(`<tr class="${c === "ok" ? "" : c}">
          <td class="metric">${esc(s.label || s.code)}</td>
          <td><span class="sev ${c}">${esc(f.status)}</span></td>
          <td class="nowrap mono">${when(s.collectedAt)}</td>
          <td class="mono">${esc(f.item || "-")}</td>
          <td class="wrapcell">${esc(f.message || "-")}</td>
        </tr>`);
      });
    } else {
      rows.push(`<tr>
        <td class="metric">${esc(s.label || s.code)}</td>
        <td><span class="sev ok">OK</span></td>
        <td class="nowrap mono">${when(s.collectedAt)}</td>
        <td class="mono">-</td>
        <td class="muted">no finding in the newest reading</td>
      </tr>`);
    }
  });

  return `<details class="fold"${isOpen ? " open" : ""}>
    <summary>${head}</summary>
    <div class="in">
    <p class="sec-note">Newest operational diagnostic readings across error logs, incidents, dumps,
      server logs and corruption checks. An older finding that cleared is not shown.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Source</th><th>Status</th><th>When</th><th>Item</th><th>Detail</th></tr></thead>
      <tbody>${rows.join("")}</tbody></table></div>
    </div></details>`;
}


/* Oracle storage — one row per tablespace, its datafiles folded underneath.

   Every number here was already in the store and none of it was readable: TABLESPACE_FREE_SPACE
   rendered as ten sparklines all labelled "Tablespace free space" with the name only in a
   tooltip, and the datafiles as fifteen more cards saying "15000 MB" with nothing saying which
   tablespace they extend.

   The headline is EFFECTIVE free, not free-right-now: free space plus autoextend headroom is what
   the tablespace can still absorb before ORA-01653. One RBS tablespace here holds 2.3 GB free
   inside 65 GB of headroom — read as "free now" it is nearly full, and the datafile added on that
   reading was never needed. The largest free extent is carried beside it because an allocation has
   to fit in one piece: 4 GB of free space in small fragments still raises ORA-01653. */
function tablespaceBlock(t){
  if (!t || !t.tablespaces || !t.tablespaces.length) return "";
  const s = t.summary;
  const mb = v => v == null ? "—"
    : v >= 1024 ? (v/1024).toFixed(v >= 10240 ? 0 : 1) + " GB" : Math.round(v) + " MB";
  const pctCell = r => {
    if (r.usedPct == null) return `<span class="muted">—</span>`;
    const cls = r.usedPct >= 95 ? "crit" : r.usedPct >= 85 ? "warn" : "";
    return `<span class="${cls}">${r.usedPct.toFixed(1)}%</span>`;
  };
  /* Headroom counted from files that cannot grow is a promise the database will not keep, so the
     count of autoextending files is stated next to it rather than left to the total. */
  const headroomCell = r => {
    if (r.autoextendHeadroomMB == null) return `<span class="muted">—</span>`;
    const none = r.autoextendFiles === 0;
    return `<span class="${none ? "warn" : ""}">${esc(mb(r.autoextendHeadroomMB))}</span>`
      + (r.autoextendFiles == null ? ""
         : `<div class="detail">${none ? "no file autoextends"
              : r.autoextendFiles + " of " + r.declaredFiles + " autoextend"}</div>`);
  };
  /* A fragmented tablespace fails an allocation it has the space for. Only worth flagging when
     the gap is real: plenty of free space whose largest piece is small. */
  const extentCell = r => {
    if (r.largestFreeExtentMB == null) return `<span class="muted">—</span>`;
    const fragmented = r.freeNowMB != null && r.freeNowMB > 1024
      && r.largestFreeExtentMB < r.freeNowMB / 10;
    return `<span class="${fragmented ? "warn" : ""}">${esc(mb(r.largestFreeExtentMB))}</span>`
      + (fragmented ? `<div class="detail">fragmented</div>` : "");
  };
  const tempCell = r => {
    if (!r.temp) return `<span class="muted">—</span>`;
    return `<span class="mono">${esc(mb(r.tempMaxUsedMB))}</span>`
      + `<div class="detail">peak sort use of ${esc(mb(r.tempTotalMB))}</div>`;
  };
  /* Datafile paths under the tablespace name rather than in a table of their own: the path is
     only ever read to answer "where does this tablespace live", so it belongs next to it. */
  const fileRows = r => {
    if (!r.files || !r.files.length) return "";
    return r.files.map(f=>`<div class="detail mono">${esc(f.file)} — ${esc(mb(f.sizeMB))}</div>`)
      .join("");
  };
  const chip = st => `<span class="sev ${cls(sev(st))}">${esc(sev(st))}</span>`;
  const rows = t.tablespaces.map(r=>`<tr class="${cls(sev(r.status))}">
      <td>${chip(r.status)}</td>
      <td class="metric">${esc(r.name)}${r.temp ? ` <span class="code">TEMP</span>` : ""}${fileRows(r)}</td>
      <td class="nowrap">${pctCell(r)}</td>
      <td class="nowrap mono">${esc(mb(r.effectiveFreeMB))}</td>
      <td class="nowrap mono">${esc(mb(r.freeNowMB))}</td>
      <td class="nowrap">${headroomCell(r)}</td>
      <td class="nowrap mono">${esc(mb(r.allocatedMB))} / ${esc(mb(r.maxMB))}</td>
      <td class="nowrap">${extentCell(r)}</td>
      <td class="nowrap">${tempCell(r)}</td>
    </tr>`).join("");
  const orphans = (t.orphanFiles || []).length
    ? `<p class="sec-note">${t.orphanFiles.length} datafile(s) belong to a tablespace that
        reported no free-space row this run: ${
        t.orphanFiles.map(f=>`<span class="mono">${esc(f.tablespace)}</span>`)
          .filter((v,i,a)=>a.indexOf(v)===i).join(", ")}.</p>`
    : "";
  const head = `${s.tablespaces} tablespace(s) · ${s.datafiles} datafile(s)`
    + (s.critical ? ` · ${s.critical} critical` : "")
    + (s.warning ? ` · ${s.warning} warning` : "")
    + (s.noAutoextend ? ` · ${s.noAutoextend} cannot autoextend` : "");
  return `<details class="fold"${(s.critical || s.warning) ? " open" : ""}>
    <summary>Tablespaces &amp; datafiles — ${esc(head)}</summary>
    <div class="in">
    <p class="sec-note"><b>Free</b> is the effective figure: space free inside the current files
      <i>plus</i> what autoextend can still add, which is what a growing segment actually has
      available before ORA-01653. <b>Free now</b> is only the first half — a tablespace with
      little of it and plenty of headroom is fine, one with no autoextending file is not, and
      the headroom column says which. <b>Largest extent</b> is what a single allocation has to
      fit inside: a tablespace can hold gigabytes in fragments too small to satisfy one extent.
      <b>Used %</b> is measured against the maximum the tablespace can reach, not against what is
      allocated today. Datafile paths are listed under each tablespace name.</p>
    ${orphans}
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th></th><th>Tablespace / datafiles</th><th>Used</th><th>Free</th>
        <th>Free now</th><th>Autoextend headroom</th><th>Allocated / max</th>
        <th>Largest extent</th><th>Temp peak</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    </div></details>`;
}

/* ---- The four Oracle sections. Each renders "" when its metrics produced no rows, which is how
   a SQL Server or PostgreSQL page is unchanged without anything here knowing the engine. ---- */

const oraMB = v => v == null ? "—"
  : v >= 1024 ? (v/1024).toFixed(v >= 10240 ? 0 : 1) + " GB" : (v >= 10 ? Math.round(v) : v.toFixed(2)) + " MB";
/* Counts in the hundreds of millions are unreadable as digits, and these are all counters. */
const oraCount = v => {
  if (v == null) return "—";
  if (v >= 1e9) return (v/1e9).toFixed(1) + "B";
  if (v >= 1e6) return (v/1e6).toFixed(1) + "M";
  if (v >= 1e4) return (v/1e3).toFixed(0) + "k";
  return String(Math.round(v * 100) / 100);
};

/* Oracle instance health: the SGA pools, the caches, and how close the instance is to its
   process/session ceilings. SHARED_POOL_FREE on one instance has been CRITICAL at 9 MB free —
   the instance's only critical finding — while rendering as one nameless sparkline among thirty. */
function oracleInstanceBlock(o){
  if (!o || (!o.pools.length && !o.limits.length && !o.bufferCache)) return "";
  const chip = st => `<span class="sev ${cls(sev(st))}">${esc(sev(st))}</span>`;
  const poolRows = o.pools.map(p=>`<tr class="${cls(sev(p.status))}">
      <td>${chip(p.status)}</td>
      <td class="metric">${esc(p.pool)}<div class="detail">${esc(p.name)}</div></td>
