    /* The bar is the column that makes the table scannable: 14% of 200 GB and 28% of 2 TB are
       the same word "low" and very different amounts of room, and the eye reads the pair
       faster than it reads two numbers. */
    const bar = pct == null ? "" :
      `<span class="vbar"><i style="width:${pct.toFixed(1)}%;background:${COLOR[c] || COLOR.unk}"></i></span>`;
    const where = [r.filesystem, r.device].filter(Boolean).join(" · ");
    return `<tr class="${c === "ok" || c === "unk" ? "" : c}">
      <td class="metric">${esc(r.name)}${where?`<span class="code">${esc(where)}</span>`:""}</td>
      <td class="mono nowrap">${esc(gb(r.totalGB))}</td>
      <td class="mono nowrap">${esc(gb(r.usedGB))}</td>
      <td class="mono nowrap"><b>${esc(gb(r.freeGB))}</b></td>
      <td class="nowrap">${bar}<span class="mono ${c === "ok" || c === "unk" ? "" : c}">${
        r.usedPct == null ? "—" : r.usedPct.toFixed(1) + "%"}</span></td>
      <td class="mono nowrap muted">${r.source === "os" ? "OS" : "engine"}</td>
    </tr>`;
  }).join("");
  /* "free of total" only when every volume reported a size — see build_volumes. An old SQL
     Server falls back to xp_fixeddrives, which knows free space and nothing else. */
  const head = `${s.count} volume(s) · ${gb(s.freeGB)} free`
    + (s.totalGB == null ? "" : ` of ${gb(s.totalGB)}`)
    + (s.unsized ? ` · ${s.unsized} with no size reported` : "")
    + (s.fullestPct == null ? "" : ` · fullest ${s.fullest} at ${s.fullestPct.toFixed(1)}%`)
    + (s.critical ? ` · ${s.critical} critical` : "")
    + (s.warning ? ` · ${s.warning} warning` : "");
  return `<details class="fold"${(s.critical || s.warning) ? " open" : ""}>
    <summary>Volumes — ${esc(head)}</summary>
    <div class="in">
    <p class="sec-note">Every fixed volume on the host, fullest first: how large it is, how much
      is used, and how much room is left. <b>Free</b> is the column that decides anything — a
      volume at 90% has 20 GB left if it is 200 GB and 200 GB left if it is 2 TB, and only one of
      those is a problem tonight. The OS collector grades these at <span class="mono">WARN ≥ 85% ·
      CRITICAL ≥ 95%</span>. <b>Source</b> says who was asked: <i>OS</i> is the host itself
      (Windows <span class="mono">DriveInfo</span> / Linux <span class="mono">df</span>, which is
      also where the file system and device come from), <i>engine</i> is the database's own view
      of the same volume, used where the OS metric cannot run. How fast each one is draining is
      the Capacity forecast below.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Volume</th><th>Size</th><th>Used</th><th>Free</th><th>Used %</th>
        <th>Source</th></tr></thead>
      <tbody>${body}</tbody></table></div></div></details>`;
}

/* ---------- Capacity forecast ----------
   The current free-space number is on the page already; what was missing is its direction. A
   volume two days from full and one flat for a month rendered identically. "insufficient history"
   is shown as itself, never as "no growth" — a confident zero from two samples is the worst thing
   this table could say. */
function capacityBlock(rows){
  if (!rows || !rows.length) return "";
  const soon = rows.filter(r=>r.daysToFull != null && r.status !== "ok" && r.status !== "OK");
  const summary = soon.length
    ? `${soon.length} volume(s) projected to fill — soonest ${soon[0].item} in ${soon[0].daysToFull} day(s)`
    : `${rows.length} volume(s), none projected to fill`;
  const body = rows.map(r=>{
    const c = cls(r.status);
    const when = r.daysToFull == null
      ? (r.enough ? '<span class="muted">not filling</span>' : '<span class="muted">unknown</span>')
      : `<b>${r.daysToFull}</b> d`;
    const rate = r.enough
      ? `${r.perDay > 0 ? "+" : ""}${r.perDay} GB/day`
      : '<span class="muted">—</span>';
    return `<tr class="${c === "ok" || c === "unk" ? "" : c}">
      <td class="metric">${esc(r.item)}</td>
      <td class="mono nowrap">${r.freeGb == null ? "—" : r.freeGb + " GB"}</td>
      <td class="mono nowrap">${rate}</td>
      <td class="mono nowrap">${when}</td>
      <td class="mono nowrap muted">${r.enough ? r.points + " pts / " + r.spanHours + "h" : "—"}</td>
      <td>${esc(r.text)}</td>
    </tr>`;
  }).join("");
  const needsAttention = soon.length > 0;
  return `<details class="fold"${needsAttention ? " open" : ""}>
    <summary>Capacity forecast — ${esc(summary)}</summary>
    <div class="in">
    <p class="sec-note">Projected from stored free-space history using the median of pairwise
      slopes, so a shrink/regrow spike cannot reverse the trend. A resize or shrink restarts the
      measurement — the row says when that happened. Thresholds and any reserve come from
      <code>data/capacity_policy.json</code>.</p>
    <div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Volume</th><th>Free now</th><th>Rate</th><th>Full in</th><th>History</th>
        <th>Reading</th></tr></thead>
      <tbody>${body}</tbody></table></div></div></details>`;
}

/* One row per metric, not per failing item: 24 stale statistics objects are one finding with
   a count, and the objects themselves live behind the expander. */
function problemList(problems){
  if (!problems.length) return '<div class="all-ok">Nothing is failing right now — every collected metric is OK.</div>';
  const itemLine = it => `${esc(it.item)} · <span class="mono">${esc(it.value)}</span>`
    + (it.age?` <span class="muted">(${esc(it.age)})</span>`:"")
    + (it.detail?`<br><span class="detail">${esc(it.detail)}</span>`:"");
  return `<div class="tbl-wrap"><table class="rpt">
    <thead><tr><th>Sev</th><th>Metric</th><th>Finding</th><th>What to do</th></tr></thead>
    <tbody>${problems.map(p=>{
      const c = cls(p.severity);
      const worst = (p.items||[])[0]||{};
      const more = p.count>1
        ? `<details><summary>${p.count} items — show all</summary><ul>${
             p.items.map(it=>`<li>${itemLine(it)}</li>`).join("")}</ul></details>`
        : (worst.detail?`<div class="detail">${esc(worst.detail)}</div>`:"");
      /* When the sample was taken, on the row itself. A 48-hour-old error-log finding sat in
         this table looking exactly like one from the last five minutes. */
      const stamp = p.collectedAt ? `<span class="code">sampled ${when(p.collectedAt)}</span>` : "";
      return `<tr class="${c}">
        <td><span class="sev ${c}">${esc(p.severity)}</span></td>
        <td class="metric">${esc(p.label)}<span class="code">${esc(p.code)}</span></td>
        <td>${esc(p.headline)}${stamp}${more}</td>
        <td class="muted">${esc(p.action)}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

/* Folded by default. Two sections that answer "since when" and "what are the words right now"
   do not need to sit open above the charts: the page opens on the verdict, the areas and the
   things that need doing, and these two are one summary line each until asked for. */
function timeline(events){
  if (!events.length) return "";
  const ongoing = events.filter(e=>e.end==null).length;
  return `<details class="fold"><summary>Recent incidents — ${ongoing} ongoing · ${events.length-ongoing} cleared</summary>
    <div class="in">
    <p class="sec-note">When each problem started and whether it cleared — this is where
      "better or worse" is visible.</p>
    ${timelineTable(events)}</div></details>`;
}

function timelineTable(events){
  const ongoing = events.filter(e=>e.end==null).length;
  return `<div class="tbl-wrap"><table class="rpt">
    <thead><tr><th>State</th><th>Metric</th><th>Item</th><th>Started</th><th>Cleared</th><th class="nowrap">Samples</th></tr></thead>
    <tbody>${events.map(e=>{
      const c = cls(e.severity);
      return `<tr class="${c}">
        <td class="nowrap">${e.end==null?'<span class="sev '+c+'">ongoing</span>':'<span class="cleared">cleared</span>'}</td>
        <td class="metric">${esc(e.label)}</td>
        <td>${esc(e.item)}</td>
        <td class="mono nowrap">${esc(when(e.start))}</td>
        <td class="mono nowrap muted">${e.end==null?"—":esc(when(e.end))}</td>
        <td class="mono nowrap">${e.samples}</td>
      </tr>`;
    }).join("")}</tbody></table></div>
    <div class="foot">${ongoing} ongoing · ${events.length-ongoing} cleared in the window.
      Ongoing and cleared each keep their own share of this list, so a problem that came and went
      is not pushed out by one that is simply still there.</div>`;
}

/* 127 chips of "word values that never changed" is a wall. Grouped by metric, one row each,
   with the ones that are actually not OK pulled out on top and the rest folded away. */
function cardStrip(cards){
  if (!cards.length) return "";
  /* Anything not OK is already a row in Problems, with its action. Repeating it here made the
     same 27 stale-statistics objects appear twice on one page. This section is the reference
     list: what the words currently are. */
  const byMetric = list => {
    const groups = new Map();
    list.forEach(s=>{ if(!groups.has(s.label)) groups.set(s.label,[]); groups.get(s.label).push(s); });
    return [...groups.entries()].map(([label, items])=>`<tr>
      <td class="metric">${esc(label)}<span class="code">${esc(items[0].code)}</span></td>
      <td>${items.map(s=>`<span class="nowrap">${esc(s.item)}: <b class="mono">${esc(s.lastText||"—")}</b></span>`).join(" · ")}</td>
    </tr>`).join("");
  };
  const table = rows => `<div class="tbl-wrap"><table class="rpt">
      <thead><tr><th>Metric</th><th>Values</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const metrics = new Set(cards.map(s=>s.label)).size;
  return `<details class="fold"><summary>Status checks — ${cards.length} value(s) across ${metrics} metric(s)</summary>
    <div class="in">
    <p class="sec-note">Values that are words, not numbers, and did not change in the window — a chart of them
      would be a flat line. Anything not OK is listed above, in Problems, with what to do about it.</p>
    ${table(byMetric(cards))}</div></details>`;
}

function omittedFoot(omitted){
  if (!omitted.length) return "";
  const total = omitted.reduce((a,o)=>a+o.dropped,0);
  const detail = omitted.map(o=>`${esc(o.label)} (${o.dropped})`).join(", ");
  return `<div class="foot"><b>${total} item(s) not charted.</b> They are absent from the latest
    collection or have fewer than 3 samples — a session id or a query hash is an event, not a
    series. By metric: ${detail}.</div>`;
}

/* ---------------- page ---------------- */
function renderPicker(active){
  /* Buttons carry the server_id because it is unique; the role name (which is not — an FCI
     pair shares one) rides along in the tooltip for anyone who knows the box by that name.
     One row per engine, in ENGINE_SECTIONS order: a flat row of 77 buttons mixing SQL Server
     instances, Oracle and PostgreSQL databases and bare hosts made "the Oracle servers" a search. */
  const button = s=>
    `<button data-slug="${esc(s.slug)}" class="${s.slug===active?"on":""}"
             title="${esc([s.role, s.ip, s.platform].filter(Boolean).join(" · "))}">
       <span class="dot" style="background:${COLOR[cls(s.status)]}"></span>${esc(s.name)}
     </button>`;
  const known = new Set(ENGINE_SECTIONS.map(([key])=>key));
  const sectionOf = s=> known.has(s.engine) ? s.engine : "other";
  document.getElementById("picker").innerHTML = ENGINE_SECTIONS.map(([key, label])=>{
    // Targets with nothing collected (grey) go to the end of their row: most of them are
    // registered and switched off, and they buried the monitored servers in front of them.
    const members = SERVERS.filter(s=>sectionOf(s)===key)
      .map((s, i)=>[s, i]).sort((a, b)=>((cls(a[0].status)==="unk")-(cls(b[0].status)==="unk")) || a[1]-b[1])
      .map(([s])=>s);
    if (!members.length) return "";
    return `<div class="plabel">${esc(label)}<b>${members.length}</b></div>
            <div class="prow">${members.map(button).join("")}</div>`;
  }).join("");
  document.querySelectorAll("#picker button").forEach(b=>b.addEventListener("click",()=>select(b.dataset.slug)));
}

async function select(slug){
  const server = SERVERS.find(s=>s.slug===slug) || SERVERS[0];
  if (!server) return;
  history.replaceState(null,"",withDate("?server="+encodeURIComponent(server.slug)));
  renderPicker(server.slug);
  document.getElementById("hostTitle").textContent = server.name;
  // Published by the same workflow as this page, under a name derived from the same slug.
  const ix = document.getElementById("indexUsageLink");
  if (server.index_usage_file){
    ix.href = withDate(server.index_usage_file);
    ix.style.display = "";
  } else {
    ix.style.display = "none";
  }
  /* The snapshot stamp is part of this line's initial text and was being written over the
     moment a server was picked, so every per-server view lost the one thing that says how old
     the page is - while the inventory page beside it kept showing it. It is re-appended here
     rather than moved: the host facts are what the reader came for and stay first. */
  document.getElementById("hostMeta").textContent =
    [server.role && server.role !== server.name ? server.role : "",
     server.ip, server.platform, `last ${WINDOW_DAYS} days`,
     SNAPSHOT_DATE ? `snapshot ${SNAPSHOT_DATE}` : ""].filter(Boolean).join(" · ");
  document.getElementById("body").innerHTML = '<div class="empty">Loading…</div>';

  let d;
  try {
    const r = await fetch(withDate(server.file + "?v=" + VERSION));
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch (err) {
    document.getElementById("body").innerHTML =
      `<div class="empty">Could not load ${esc(server.file)} (${esc(err.message)}). This page loads each
       server's data on demand, so it must be opened over the report web host, not from a copied file.</div>`;
    return;
  }

  /* The build and the edition join the host line once the server's file says them: the version
     is the first thing looked up about a server, and it was on no line of this page. */
  if (d.serverDetail && d.serverDetail.summary){
    document.getElementById("hostMeta").textContent =
      [server.role && server.role !== server.name ? server.role : "",
       server.ip, d.serverDetail.summary, server.platform, `last ${WINDOW_DAYS} days`,
       SNAPSHOT_DATE ? `snapshot ${SNAPSHOT_DATE}` : ""].filter(Boolean).join(" · ");
  }

  /* The severity a chart is coloured by is the one the analysis decided (which is the
     collector's, except for the two metrics the collector logs without judging). */
  for (const s of d.series) s.severity = seriesSeverity(s, d);
  for (const s of d.cards) s.severity = seriesSeverity(s, d);

  const tier = t => d.series.filter(s=>s.tier===t);
  const primary = tier("primary"), dbSize = tier("database_size"),
        diag = tier("diagnostics"), detail = tier("detail");

  document.getElementById("body").innerHTML =
      verdict(d.health, server)
    + `<h2 class="sec">Current status</h2>
       <p class="sec-note">Each health area shows the worst thing in it, the rule that decided the status, and what it means.</p>`
    + areaGrid(d.areas)
    + `<h2 class="sec">Problems — what needs doing<span class="sec-tools">${
         d.problems.length} finding(s) · ${d.problems.reduce((a,p)=>a+p.count,0)} item(s), worst first</span></h2>`
    + problemList(d.problems)
    + coverage(d.freshness)
    /* Before the inventory sections: "how much is this instance doing" is the question a
       performance complaint arrives as, and it is answered by counters, not by the list of
       what is installed. */
    + workloadBlock(d.workload)
    /* Directly under the totals they break down: the WRITELOG row and the plan-cache table above
       say how much, these two say which database and which statement. */
    + logBlock(d.attribution && d.attribution.log, d.workload)
    + topQueriesBlock(d.attribution && d.attribution.queries)
    /* Immediately after it, and never inside it: the memory gauges answer "why did it cost that"
       for the workload above, and they are a different kind of number — a reading of the moment,
       summarised as a range, not a counter differenced into a rate. */
    + memoryBlock(d.workload && d.workload.memory)
    /* The server before what is on it: its build, configuration and host are the facts every
       section below is read against. */
    + serverDetailBlock(d.serverDetail)
    /* First of the inventory sections after it: the "what is on this server" overview that every
       section below details one aspect of. */
    + databasesBlock(d.databases)
    /* Directly under the database list: on Oracle the tablespace is the storage unit the
       database list has no column for, and the first thing looked up after "what is here". */
    + tablespaceBlock(d.tablespaces)
    /* Redo before backup: "can this be restored to a point in time" is the question the backup
       verdict below is read against, and on a NOARCHIVELOG instance the answer is no whatever
       the backup ages say. */
    + oracleRedoBlock(d.oracleRedo)
    + backupBlock(d.backup)
    /* The backup verdict says whether the policy is met; this says, file by file, what was
       written, whether it can still be trusted, and which restores used it. */
    + backupFilesBlock(d.backupFiles)
    /* What the storage is, then when it runs out: the forecast's "12 days" is unreadable
       without the size and free space it was projected from. */
    + volumesBlock(d.volumes)
    + capacityBlock(d.capacity)
    + linkedServerBlock(d.linkedServers)
    + queryStoreFindingsBlock(d.queryStoreFindings)
    + queryStoreBlock(d.queryStore)
    + latencyBlock(d.latency)
    + diagnosticsBlock(d.diagnostics)
    + jobsBlock(d.jobs)
    /* Instance health, then what is broken inside it, then the statements doing the damage —
       the order an Oracle problem is actually worked through. */
    + oracleInstanceBlock(d.oracleInstance)
    + oracleObjectsBlock(d.oracleObjects)
    + oracleTopSqlBlock(d.oracleTopSql)
    + accessBlock(d.access)
    + protectionBlock((d.serverDetail || {}).protection)
    + timeline(d.timeline)
    + cardStrip(d.cards)
    + `<h2 class="sec">Primary health indicators</h2>
       <p class="sec-note">The metrics that decide whether the server is healthy.</p>`
    + chartGrid(primary)
    + `<details class="fold"><summary>Database size history (${dbSize.length})</summary><div class="in">
         <p class="sec-note">Allocated file size per database: MDF/NDF data and LDF log are shown separately in GB.</p>
         ${chartGrid(dbSize)}</div></details>`
    + `<details class="fold"><summary>Performance diagnostics (${diag.length})</summary><div class="in">${chartGrid(diag)}</div></details>`
    + `<details class="fold"><summary>Detailed / raw metrics (${detail.length})</summary><div class="in">${chartGrid(detail)}</div></details>`
    + omittedFoot(d.omitted);
  bindFileFilters();
  showBackupFilesLink(d.backupFiles);
}

/* The header link to the backup & restore files: the count, or no link when there are none. */
function showBackupFilesLink(b){
  const link = document.getElementById("backupFilesLink");
  if (!link) return;
  const files = (b && b.files) || [];
  link.style.display = files.length ? "" : "none";
  if (!files.length) return;
  link.textContent = `backup & restore files (${files.length}${b.notOk ? `, ${b.notOk} not ok` : ""}) ↓`;
  link.onclick = ev => {
    const section = document.getElementById("backupFiles");
    if (!section) return;
    ev.preventDefault();
    section.open = true;
    section.scrollIntoView({behavior: "smooth", block: "start"});
  };
}

/* Mirrors the Python: the collector's status, except for the two metrics whose SQL returns OK
   on every branch (they are logging-only) — those are judged on their value. */
function seriesSeverity(s){
  if (s.code === "PERFORMANCE_IO_LATENCY")
    return s.last == null ? "OK" : s.last >= 50 ? "CRITICAL" : s.last >= 20 ? "WARNING" : "OK";
  if (s.code === "PAGE_LIFE_EXPECTANCY")
    return s.last == null ? "OK" : (s.last > 0 && s.last < 300) ? "CRITICAL"
         : (s.last > 0 && s.last < 2000) ? "WARNING" : "OK";
  return sev(s.status);
}

/* Every link off this page keeps the date, including the one back to the fleet. */
const inventoryLink = document.getElementById("inventoryLink");
if (DATE_PARAM) inventoryLink.href = withDate(inventoryLink.getAttribute("href"));

const wanted = new URLSearchParams(location.search).get("server");
select(wanted && SERVERS.some(s=>s.slug===wanted) ? wanted : (SERVERS[0]||{}).slug);
</script>
</body>
</html>
