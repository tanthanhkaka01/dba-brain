# A throwaway SQL Server to point the toolkit at.
#
# Developer edition is free for non-production use and is the full engine — the same DMVs the
# metric SQL reads in production, not a reduced Express feature set. `docker compose down -v`
# removes it and its data completely.
#
# The password is in the file on purpose. It belongs to a container that listens on loopback only
# and is deleted at the end of the quickstart. Every OTHER password in this toolkit lives in the
# encrypted secret store — including this one, once you finish step 3 of the README.
#
# SQL Server has no equivalent of the postgres image's initdb directory, so the monitoring login
# is created by a `docker exec` in step 2 rather than by a mounted script. That is the honest
# shape: one visible command you can read before you run it.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbops_quickstart_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Quickstart_not_a_real_password_1"
      MSSQL_PID: "Developer"
    ports:
      # Loopback only. Binding 0.0.0.0 would put an sa account with a published password on
      # whatever network this machine is attached to.
      - "127.0.0.1:1433:1433"
    healthcheck:
      # -C trusts the container's self-signed certificate. Driver 18 requires encryption by
      # default and would otherwise refuse its own local connection.
      test: ["CMD-SHELL",
             "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
