# gitleaks configuration.
#
# The secret scan is the one CI job that must never be red, and that only works if a red run means
# something. So every finding gets resolved rather than tolerated — by changing the code where the
# code is at fault, and by an entry here, with its reason, where the rule is.
#
# The bar for an entry: the match must be provably not a credential, and the allowance must be
# narrow enough that a real secret in the same file would still be caught. A rule switched off
# wholesale, or a path excluded entirely, is how a scanner becomes decoration.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = """
  `PBKDF2_ITERATIONS` is the name of a key-derivation cost parameter, and the value beside it is an
  iteration count. `generic-api-key` reads the identifier as the secret because it contains no word
  that says otherwise, which is the rule doing what it is for on a string that is not one.

  The test that trips it lowers the KDF cost so the console suite does not spend a second per
  sign-in; the real cost is asserted in `tests/test_web_auth.py`. It began failing when `webhost`
  joined the distribution in v0.2.0 and its tests were scanned for the first time.

  Scoped to the constant's own name, so a real secret anywhere in the same file is still found.
  """
  regexes = ['''PBKDF2_ITERATIONS''']

  [[rules.allowlists]]
  description = """
  The quickstart's passphrase, which is the word `quickstart` base64-encoded. It is printed in
  `examples/*/README.md` on purpose — a reader has to type it to follow the walkthrough — and it
  unlocks a throwaway container that the same page tells them to delete at the end.

  The scan reads it as a `generic-api-key` because it is a base64 blob next to `--key-base64`,
  which is the rule doing its job on a string that only looks like a credential.

  It went red on 2026-08-24 after the repository's history was rewritten (to strip a commit
  trailer). That reset the action's incremental baseline, so gitleaks re-scanned commits it had
  already passed and found the literal in an *older* version of
  `tests/test_first_run_reports_what_it_did.py`. The current file does not contain it — the test
  was changed to `not-a-key` when this first came up, because a value that only looks realistic
  costs something and buys nothing. History keeps the old commits, and rewriting history again to
  launder a placeholder would be a far worse trade than one allowlist entry.

  Scoped to this exact string, so any other key-shaped value in the same files is still reported.
  """
  regexes = ['''cXVpY2tzdGFydA==''']

  [[rules.allowlists]]
  description = """
  Test placeholders that are shaped like credentials because the code under test takes a
  credential. Each was decoded and compared against the real store passphrase before being listed
  here; none matches, and each decodes to a phrase that says what it is — `forwarded-by-the-daemon`,
  `secret-phrase`, and two invented passphrases used to exercise `--key-base64` parsing. The last
  is not base64 at all: `abc123notmasked` is the input to the assertion that error text gets
  masked, so the test's whole subject is that this string must NOT survive into a log.

  `generic-api-key` reads them as keys because they are high-entropy strings next to `--key-base64`
  or `token:`, which is the rule working correctly on values that only look like credentials.

  Listed one literal at a time, deliberately. A path allowlist over `tests/` would have been two
  lines and would have hidden a genuine key checked into a test — which is exactly the accident
  this scan exists to catch.

  Why this matters beyond the noise: **the CI job scans incrementally**, only the commits in a
  push range, so it never sees these and reports green. A whole-tree scan is the stronger check and
  the one the maintainers' release gate prescribes locally — it is only usable if its findings are all
  real, so these are resolved rather than tolerated.
  """
  regexes = [
    '''Zm9yd2FyZGVkLWJ5LXRoZS1kYWVtb24=''',
    '''QWhkc2YjaHNkZiQlMjM4SGZzIw==''',
    '''SkZuc2gjJDcyM0hzM2g=''',
    '''c2VjcmV0LXBocmFzZQ==''',
    '''abc123notmasked''',
  ]
