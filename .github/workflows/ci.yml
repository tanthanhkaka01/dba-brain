# Tests, lint and a secret scan on every push and pull request. Go-live gate item `G-08`.
#
# **Two test jobs, and the split is the point.** `core` must pass and does. `full` runs the whole
# suite and is allowed to fail, because 38 tests in this tree read configuration files the
# distribution does not ship — a coupling being removed rather than a broken product.
#
# Neither extreme was acceptable. Deselecting those 38 to get one green badge would hide them, and
# the first real regression would arrive looking exactly like the noise it was buried in. Leaving
# one job permanently red is the same failure wearing the other hat: a badge that is always red is
# a badge nobody reads, so the day it means something, it means nothing.
#
# `full` becomes required the moment it is green. That is one line, and it is the point of keeping
# it visible.
#
# The secret scan is the job that must never be red. It guards the one mistake that cannot be undone.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        # `requires-python` is >=3.11. The floor is a policy choice — no dependency and no language
        # feature needs more than 3.9 — so the matrix is what proves the claim, not the metadata.
        # It has already earned its place: the first lint run found a backslash inside an f-string,
        # which is 3.12+ syntax, in a package declaring 3.11.
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      # Collection first, and on its own. A collection error makes pytest exit 2 with the reason
      # buried above a wall of output, and the annotation a reader sees says only "exit code 2" —
      # which names the symptom and nothing else. Run separately, the failing module is the whole
      # message.
      #
      # It also fails fast: on an import error there is no point running two thousand tests.
      - name: Import and collect
        run: |
          python -c "import db_ops; print('db_ops', db_ops.__version__)"
          python -m pytest tests --collect-only -q

      # No database, no network, no credentials — the suite is offline by design, and a test that
      # needs any of those has escaped.
      #
      # This used to skip twenty files, and a second `full` job ran them and was allowed to fail.
      # Both were scaffolding around a known remainder: tests that read the operator's own
      # configuration and could not pass without it. Those assertions now live in `tests_estate/`,
      # which never ships, so there is one job and it has to pass.
      - name: Tests
        run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      # `ruff check` only. A `ruff format --check` was here for one commit and failed immediately:
      # it wants to reformat 408 of 591 files, because this tree has never been run through a
      # formatter. Adopting it is a real change worth making — in its own pass, where the diff is
      # the whole commit and reviewable as such — not as a side effect of turning CI on.
      #
      # Recorded rather than quietly dropped: the check was added without ever being run, which is
      # how a workflow ends up asserting something that was never true.
      - name: Lint
        run: ruff check .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not just the tip: a secret removed in a later commit is still in the
          # repository, and this one was created from a filtered copy precisely so that its history
          # is short enough for this to be cheap.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
