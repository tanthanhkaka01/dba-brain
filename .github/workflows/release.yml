# Publish to PyPI when a GitHub Release is published.
#
# Uses **trusted publishing**: PyPI is configured to accept uploads from this repository and this
# workflow file, and no API token exists anywhere. That is the reason nothing can be uploaded from
# a laptop — which is the point, not a limitation.
#
# **The filename and the job name below must match what was declared on PyPI.** Trusted publishing
# checks the workflow *file name* (`release.yml`) and the environment name against the publisher
# configuration; if either differs, PyPI refuses the upload with a message about the claim not
# matching. Change one here and the other there, in the same pass.
name: release

on:
  release:
    types: [published]
  # Lets the whole path be exercised without publishing anything. `dry_run` builds and validates
  # and stops before the upload, because the first time a release workflow runs should not be the
  # first time anybody finds out whether it works.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the artifacts
        run: python -m twine check dist/*

      # The version is in `pyproject.toml`, and a release tag that disagrees with it produces a
      # package nobody can find from the release page. Checked here rather than trusted: the two
      # are written by different people at different times.
      - name: The tag and the version must agree
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "release tag '$GITHUB_REF_NAME' does not match pyproject version '$VERSION'" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only on a real release. A manual run builds and stops, whatever `dry_run` says, because
    # "publish unless somebody unticked a box" is the wrong default for something irreversible.
    if: github.event_name == 'release'
    # The PyPI publisher for `dbabrain` names the environment `pypi`, so this job has to run in it:
    # the environment is part of the claim GitHub presents, and a mismatch is refused as
    # `invalid-publisher` - which is what the first release attempt hit, with the claim reading
    # `environment: MISSING` because this key was absent. PyPI is the authority; the two must agree.
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing; nothing else needs it
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # The container half of HR-4. Until 2026-08-23 a `v*` release published to PyPI and produced no
  # image at all, while `mvp04` documented `docker run ghcr.io/.../dbabrain:<v>` as a way to use the
  # toolkit — a documented artifact that had never existed. Four acceptance criteria across two MVPs
  # were waiting on this one job.
  #
  # It runs after `publish` rather than beside it so a failed PyPI upload does not leave an image
  # published for a version that is not on the index.
  image:
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write        # to push to GHCR; nothing here needs more
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows a real release and never a prerelease. An `-rc` tag is published so it can
      # be pulled by name and tested; moving `latest` to it would hand every `docker pull` with no
      # tag a release candidate, which is the failure this rule exists to prevent.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dbabrain
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The image is documented as runnable with nothing mounted, and as not running as root.
      # Both are checked here, against the image that was just pushed, because an image nobody
      # ran is a claim rather than an artifact.
      - name: The published image runs, and not as root
        run: |
          set -euo pipefail
          tag="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          uid="$(docker run --rm --entrypoint id "$tag" -u)"
          test "$uid" != "0" || { echo "the image runs as root"; exit 1; }
          docker run --rm "$tag" --help > /dev/null
          echo "ok: $tag runs as uid $uid with no config mounted"
