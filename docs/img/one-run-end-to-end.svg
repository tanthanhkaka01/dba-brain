<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
  <title id="title">One run, end to end</title>
  <desc id="desc">Flow of a run: the daemon, a person, a chat command or an AI agent starts an app; the app asks transport, which starts the common CLI as a process; the common CLI reaches your estate. The app writes to the runtime store; reports read the store and publish to the web host and to Telegram.</desc>
  <!--
    A fixed palette rather than the page's CSS variables: this file is shown through an <img>, where
    a stylesheet outside it does not apply. The white background is deliberate - without it the dark
    text disappears on a dark theme.
  -->
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f5f7ff; stroke: #898ea4; stroke-width: 1.5; }
    .hl { fill: #f5f7ff; stroke: #0d47a1; stroke-width: 2; }
    text { fill: #212121; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; }
    .t { font-weight: bold; }
    .s { fill: #585858; font-size: 12.5px; }
    .m { fill: #585858; font-size: 12.5px; font-family: ui-monospace, Consolas, Menlo, monospace; }
    .ln { stroke: #585858; stroke-width: 1.5; fill: none; }
    .ah { fill: #585858; }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="430"/>

  <text class="s" x="10" y="26">CALLERS</text>
  <text class="s" x="250" y="26">APP</text>
  <text class="s" x="520" y="26">SHARED LAYERS</text>
  <text class="s" x="760" y="26">YOUR ESTATE</text>

  <rect class="box" x="10" y="40" width="170" height="44" rx="5"/><text x="24" y="67">Daemon (schedule)</text>
  <rect class="box" x="10" y="100" width="170" height="44" rx="5"/><text x="24" y="127">Person (shell)</text>
  <rect class="box" x="10" y="160" width="170" height="44" rx="5"/><text x="24" y="187">Chat command</text>
  <rect class="box" x="10" y="220" width="170" height="44" rx="5"/><text x="24" y="247">AI agent</text>

  <line class="ln" x1="180" y1="62" x2="248" y2="100" marker-end="url(#a1)"/>
  <line class="ln" x1="180" y1="122" x2="248" y2="135" marker-end="url(#a1)"/>
  <line class="ln" x1="180" y1="182" x2="248" y2="170" marker-end="url(#a1)"/>
  <line class="ln" x1="180" y1="242" x2="248" y2="205" marker-end="url(#a1)"/>

  <rect class="hl" x="250" y="40" width="200" height="224" rx="5"/>
  <text class="t" x="266" y="68">App CLI</text>
  <text class="m" x="266" y="96">metrics</text>
  <text class="m" x="266" y="118">sql_tasks</text>
  <text class="m" x="266" y="140">backup_restore</text>
  <text class="m" x="266" y="162">sla &#183; reports</text>
  <text class="m" x="266" y="184">sre &#183; control</text>
  <text class="s" x="266" y="214">the same command,</text>
  <text class="s" x="266" y="232">whoever started it</text>

  <line class="ln" x1="452" y1="102" x2="518" y2="102" marker-start="url(#a1)" marker-end="url(#a1)"/>
  <text class="s" x="456" y="92">request</text>
  <rect class="box" x="520" y="80" width="170" height="44" rx="5"/><text class="t" x="536" y="107">transport</text>
  <line class="ln" x1="605" y1="124" x2="605" y2="168" marker-end="url(#a1)"/>
  <text class="s" x="612" y="150">starts process</text>
  <rect class="box" x="520" y="170" width="170" height="78" rx="5"/>
  <text class="t" x="536" y="195">common.cli</text>
  <text class="s" x="536" y="216">one JSON object in,</text>
  <text class="s" x="536" y="234">one envelope out</text>

  <line class="ln" x1="690" y1="200" x2="758" y2="200" marker-end="url(#a1)"/>
  <rect class="box" x="760" y="40" width="190" height="224" rx="5"/>
  <text x="776" y="72">SQL Server</text>
  <text x="776" y="100">Oracle</text>
  <text x="776" y="128">PostgreSQL</text>
  <text x="776" y="156">MySQL / MariaDB</text>
  <text x="776" y="184">Linux / Windows</text>
  <text class="s" x="776" y="222">a login you already have,</text>
  <text class="s" x="776" y="240">SSH or WinRM</text>

  <line class="ln" x1="350" y1="264" x2="350" y2="328" marker-end="url(#a1)"/>
  <text class="s" x="358" y="300">job_runs, measurements</text>
  <rect class="hl" x="250" y="330" width="200" height="60" rx="5"/>
  <text class="t" x="266" y="356">Runtime store</text>
  <text class="s" x="266" y="377">SQLite or PostgreSQL</text>

  <line class="ln" x1="450" y1="360" x2="518" y2="360" marker-end="url(#a1)"/>
  <rect class="box" x="520" y="338" width="170" height="44" rx="5"/><text class="t" x="536" y="365">Reports</text>

  <line class="ln" x1="690" y1="350" x2="758" y2="332" marker-end="url(#a1)"/>
  <line class="ln" x1="690" y1="372" x2="758" y2="392" marker-end="url(#a1)"/>
  <rect class="box" x="760" y="310" width="190" height="44" rx="5"/><text x="776" y="337">Web host :8080</text>
  <rect class="box" x="760" y="370" width="190" height="44" rx="5"/><text x="776" y="397">Telegram delivery</text>
</svg>
