# Packaging metadata.
#
# Added 2026-08-21 as the first structural step toward a publishable toolkit. Until now the
# repository was only ever *run from a checkout* — there was no way to install it, so nothing
# forced the question of what belongs to the package and what belongs to the operator.
#
# Deliberately still named `db_ops`, with the package still at the repository root rather than
# under `src/`. Both of those change to `dbabrain` and `src/` at the moment the code moves to the
# public repository, not before: the module path is stored as text in `data/app_commands.json`
# for every scheduled app and named in the Dockerfile and `docker/entrypoint.sh`, so renaming or
# relocating it in place breaks the running worker until it is redeployed in lockstep. See
# `audits/go-live/PUBLIC_RELEASE_ROADMAP.md` (D-03).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbabrain"
description = "Database operations toolkit: metrics, reports, scheduled SQL, backup/restore validation, SLA checks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Trieu Tan Thanh" }]
keywords = ["dba", "database", "sqlserver", "oracle", "postgresql", "mysql", "monitoring", "operations"]
version = "0.7.2"

# Measured 2026-08-21, not guessed (D-05):
#
#   * No dependency requires more than 3.10. `pypsrp` (the WinRM extra) is the strictest at
#     >=3.10; every driver — pyodbc, pymssql, oracledb, pg8000, PyMySQL, paramiko — says >=3.9,
#     and the two core dependencies say >=3.9 and >=3.8.
#   * No language feature in the tree requires more than 3.9: no `match` statements, no
#     `ExceptionGroup`, no PEP 695 syntax. `from __future__ import annotations` is used
#     throughout, so the `X | Y` annotations are not a floor either.
#
# That reasoning produced a *policy* floor of 3.11, and the CI matrix — added to prove the claim
# rather than trust it — disproved it on its first unrestricted run. **The floor is 3.12, and it is
# measured**: `db_ops/lib/result_format.py` writes CSV with `csv.QUOTE_STRINGS`, which arrived in
# 3.12, so every CSV path raises `AttributeError` on 3.11. The property it is there for — NULL and
# the empty string staying distinct while numbers stay unquoted — cannot be had from the 3.11
# stdlib writer, and hand-rolled quoting is the one thing that module refuses to do.
#
# Note what the survey above missed: it looked for *syntax* and dependency metadata, and this is a
# **stdlib API**. It is the second defect of this shape — the first, a backslash inside an
# f-string, is recorded under [tool.ruff.lint] below — and neither was findable by reading.
requires-python = ">=3.12"

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

# Core: what every install needs regardless of which engine the operator runs.
#   cryptography — the encrypted secret store (PBKDF2-HMAC-SHA256 + Fernet). Nothing that
#                  connects anywhere works without it.
#   PyYAML       — legacy inventory files passed explicitly. Small, and dropping it would break
#                  existing operators for no gain.
# Every database driver is an extra: a DBA who runs only PostgreSQL must not be made to install
# an ODBC driver and an Oracle client to start.
dependencies = [
    "cryptography>=42.0.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.3.0", "pymssql>=2.3.13"]
oracle = ["oracledb>=3.1.0"]
postgres = ["pg8000>=1.31.0"]
mysql = ["PyMySQL>=1.1.0"]
ssh = ["paramiko>=3.0.0"]
winrm = ["pypsrp"]
all = [
    "pyodbc>=5.3.0",
    "pymssql>=2.3.13",
    "oracledb>=3.1.0",
    "pg8000>=1.31.0",
    "PyMySQL>=1.1.0",
    "paramiko>=3.0.0",
    "pypsrp",
]
dev = ["pytest>=8.0.0"]

# One command, apps as subcommands. `db-ops metrics --help` rather than twelve entry points a
# reader has to discover — and it becomes `dbabrain` with the package rename, which is the whole
# reason the dispatcher is a lookup table and not twelve script declarations.
[project.scripts]
db-ops = "db_ops.cli:main"

[project.urls]
Homepage = "https://github.com/tanthanhkaka01/dba-brain"
Repository = "https://github.com/tanthanhkaka01/dba-brain"
Changelog = "https://github.com/tanthanhkaka01/dba-brain/blob/main/CHANGELOG.md"


# The package is at the repository root today, so `find` is scoped rather than left to guess:
# `data`, `assets`, `docs`, `tests`, `scripts` and `tools` are all top-level directories that are
# emphatically not part of the distribution.
#
# The list is narrower than `db_ops*` from 2026-08-22, and the reason is the release rather than
# the packaging: `v0.1.0` is one sentence — point it at one SQL Server, collect metrics, add a
# Telegram token, get an alert — so seven of the fourteen apps do not ship until `v0.2.0`. The
# authority is `db_ops/lib/distribution.py`, which states which and why; this list is generated
# from it and `tests/test_distribution_closure.py` fails if the two drift apart. A second copy of
# that decision is how a wheel and a repository start shipping different software.
#
# Nothing is deleted from this repository to achieve it. The worker runs the full toolkit, and the
# image copies `db_ops/` wholesale rather than installing the wheel, so what is distributed and
# what is deployed are independent by construction.
[tool.setuptools.packages.find]
include = [
    "db_ops",
    "db_ops.lib*",
    "db_ops.common*",
    "db_ops.db*",
    "db_ops.logging_ops*",
    "db_ops.metrics*",
    "db_ops.telegram*",
    "db_ops.jobs*",
    "db_ops.reports*",
    "db_ops.sql_tasks*",
    "db_ops.backup_restore*",
    "db_ops.sla*",
    "db_ops.sre*",
    "db_ops.webhost*",
    "db_ops.control*",
]
namespaces = false

# The built-in assets are not Python, and setuptools ships no non-Python file unless told. They
# are the SQL and scripts that *implement* the shipped metrics, backups, restores and host checks
# — an install without them is an install that cannot collect a metric. The operator's own
# `assets/tasks` and `assets/sql_telegram_commands` stay at the repository root and are
# deliberately not here: they are per-estate data, and they never ship.
# The shipped SQL and scripts are not Python, and setuptools ships no non-Python file unless
# told. They *implement* the shipped metrics, backups, restores and host checks — an install
# without them cannot collect a metric. Each lives with the component that owns it; the
# operator's own `assets/` stays at the repository root and deliberately never ships.
[tool.setuptools.package-data]
"db_ops.metrics" = ["collectors/**/*.sql", "collectors/**/*.sh", "collectors/**/*.ps1",
                    "catalogue/*.json"]
# The rest of what `db-ops init` writes. These are product data - which reports exist, which bot
# commands are answered, which apps can be scheduled - so each ships with the component that owns
# it. Without them the daemon starts and every scheduled command fails on a missing file.
"db_ops.telegram" = ["catalogue/*.json"]
"db_ops.jobs" = ["catalogue/*.json"]
"db_ops.db" = ["catalogue/*.json"]
"db_ops.control" = ["catalogue/*.json"]
"db_ops.sla" = ["catalogue/*.json"]
"db_ops.common" = ["backup_scripts/**/*.sh", "backup_scripts/**/*.ps1",
                   "restore_scripts/**/*.sh", "restore_scripts/**/*.ps1",
                   "catalogue/*.json"]
# Back with the packages in `v0.2.0`. The removal note is worth keeping as the reason this list is
# checked rather than trusted: **package-data for a package that is not in `packages.find` is
# silently ignored**, so an entry here proves nothing on its own — a stale one reads as "this
# ships" while nothing does, and `tests/test_packaging_carries_its_assets.py` is what makes the
# claim true.
#
# Every one of these is a file the code *executes or renders*, not documentation that happens to
# live nearby: without them `sre` cannot write a compose file or run a playbook, `reports` renders
# a blank page, and `webhost` serves one.
"db_ops.sre" = ["host_config/**/*", "automation/**/*.j2", "automation/**/*.yml",
                "automation/**/*.ps1", "automation/**/*.sh", "automation/**/*.cfg",
                "docker_db/templates/**/*", "inventory/**/*.sql", "inventory/**/*.md"]
"db_ops.reports" = ["templates/**/*.html", "catalogue/*.json"]
"db_ops.webhost" = ["templates/**/*", "static/**/*", "catalogue/*.json"]
"db_ops.backup_restore" = ["sql/**/*.sql", "**/*.ps1", "**/*.sh"]
"db_ops.sql_tasks" = ["**/*.sql"]


# Lint and format. Added 2026-08-22 for go-live gate `G-08`, which requires CI green on tests,
# lint and a secret scan — and "lint is green" was true only because nothing ran.
#
# The line length is 100 to match what this tree already writes; picking 88 would have produced a
# few thousand findings on the first run, which is how a linter gets switched off in its first week.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "tools/python32_legacy", "scripts/archive"]

[tool.ruff.lint]
# Deliberately narrow to start. Each rule set earns its place by finding something real; a wide
# default on an existing tree buries the findings that matter under stylistic ones.
# Measured before choosing, on 2026-08-22. The wide set produced **775 findings**, of which 250
# were import ordering and ~280 were modernisation rewrites: a diff across nearly every file, days
# before a release, hiding the fifty that mean something. `I` and `UP` are left out until the tree
# is quiet enough that turning one on is a readable change.
#
# The narrow set found what mattered on its first run: a **backslash inside an f-string**, which is
# Python 3.12+ syntax in a package declaring `requires-python = ">=3.11"`. The tree did not run at
# all on the floor it promised, and nothing else would have said so.
select = ["E", "F", "W", "B"]
ignore = [
    "E501",   # line length is enforced by the formatter, not twice
    "B008",   # a call in a default argument is how several CLIs declare their defaults here
    "F401",   # unused imports: 159 of them, cosmetic, and a mass rewrite before a release is risk
              # with no reader. Turn it on in its own pass.
    # The rest need judgement rather than a rewrite, and each is deferred with its reason so the
    # list reads as decisions rather than as a linter somebody muted. The lint job is green today
    # so that the first time it goes red, it means something.
    "B905",   # zip(strict=): 19 sites. The right value differs per call - some pairs are known
              # equal length and some are deliberately truncating - so this is a read, not a fix.
    "E402",   # imports below the top: 16, and most are the *deliberate* lazy imports that keep
              # `--help` working on an install with no database driver.
    "F841",   # unused variables: 13, several of which are `_, value = ...` unpacking.
    "B023",   # loop variable captured in a closure: 4, and each needs checking rather than binding.
    "E731",   # lambda assignment: 3, all short table entries where a def would read worse.
    "B007",   # unused loop control variable: 2.
    "B018",   # useless expression: 1, and it may be an assertion someone dropped.
]

[tool.ruff.lint.per-file-ignores]
# Tests say what they mean at the cost of some repetition; `F811` fires on pytest fixtures that
# shadow, which is the fixture mechanism working.
"tests/*" = ["F811"]
