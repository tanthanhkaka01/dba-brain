[pytest]
pythonpath = .
addopts = -p no:cacheprovider --basetemp=.pytest_tmp
testpaths = tests
markers =
    slow: builds an artifact or starts a process; seconds rather than milliseconds
    real_lockdown: sees the real lockdown state instead of the suite's "off" (tests/conftest.py)
    real_source_clock: asks the source database its clock instead of the suite's "unknown" (tests/conftest.py)
